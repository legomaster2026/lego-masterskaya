padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}

.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}
.tower-body{transition:transform .8s cubic-bezier(.30,.08,.76,1.16)}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}}</style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">Урок 14 · Полигон прыгунов</div><h1>Секрет прыжка</h1><p>Открой секрет упругих деталей и создай подбрасыватель для LEGO-страны!</p></div><div class="emoji" aria-hidden="true">🚀</div></section><div id="app"></div></main><script>
'use strict';
const S={step:0,done:new Set(),material:'elastic',bend:0,seen:new Set(),power:2,angle:45,logs:[],base:'small',spring:false,checks:new Set(),note:''};
const $=s=>document.querySelector(s);let frame=0,busy=false;const names=['Упругая деталь','Лаборатория прыжка','Подбрасыватель','Моя модель'];
function msg(t,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=t}
function mark(){S.done.add(S.step);if($('#next'))$('#next').disabled=false}
function beam(b){return `<svg viewBox="0 0 660 310" role="img" aria-label="${S.material==='elastic'?'Упругая деталь изгибается и возвращается в исходное положение':'Жёсткий кирпичик: в модели не изгибается'}"><rect x="84" y="97" width="46" height="163" rx="7" fill="#397fce"/><rect x="60" y="260" width="140" height="18" rx="5" fill="#22558e"/>${S.material==='elastic'?`<path d="M124 140 Q300 140 490 ${140+b}" fill="none" stroke="#29a58f" stroke-width="18" stroke-linecap="round"/><path d="M124 140 H490" stroke="#92acc5" stroke-width="2" stroke-dasharray="6 6"/><circle cx="490" cy="${140+b}" r="12" fill="#f2b543"/>`:'<rect x="124" y="122" width="300" height="36" rx="5" fill="#e89a5e"/><path d="M160 122 v-10 h40 v10 M260 122 v-10 h40 v10" fill="#f6bf8b"/>'}<text x="330" y="300" text-anchor="middle" font-size="16" fill="#4d6784">${S.material==='elastic'?'Пунктир — исходное положение':'Жёсткую деталь не нужно сгибать силой'}</text></svg>`}
function arena(x=100,y=305,path='',loaded=true){let a=`<svg viewBox="0 0 660 385" role="img" aria-label="Испытательная площадка: старт слева, шкала дальности в шипах, цель дальше 10 шипов"><rect x="280" y="285" width="260" height="29" rx="7" fill="#e2f5e9"/><path d="M60 320 H610" stroke="#8caac5" stroke-width="5"/>`;
for(let i=0;i<=24;i+=2)a+=`<path d="M${100+i*18} 320 v9" stroke="#688ba9" stroke-width="2"/><text x="${100+i*18}" y="350" text-anchor="middle" font-size="13" fill="#426683">${i}</text>`;
a+=`<text x="340" y="378" text-anchor="middle" font-size="14" fill="#4d6784">Дальность от старта, в шипах</text><path d="M280 70 V320" stroke="#4fa978" stroke-dasharray="5 5"/><text x="290" y="87" font-size="14" fill="#26704a">10 шипов</text><rect x="${S.base==='wide'?45:70}" y="310" width="${S.base==='wide'?120:60}" height="12" rx="4" fill="#3176bf"/>`;
const theta=S.angle*Math.PI/180,dx=Math.cos(theta)*63,dy=Math.sin(theta)*63;
a+=`<path d="M70 310 L${100+dx} ${305-dy}" stroke="${S.step===2&&!S.spring?'#a8b9c7':'#27a38b'}" stroke-width="10" stroke-linecap="round"/><circle cx="100" cy="305" r="7" fill="#315575"/>`;
if(path)a+=`<path d="${path}" fill="none" stroke="#de9b47" stroke-width="2" stroke-dasharray="4 5"/>`;
if(loaded)a+=`<rect x="${x-7}" y="${y-14}" width="14" height="14" rx="3" fill="#ed9251" stroke="#9d5126" stroke-width="1.5"/>`;
return a+'</svg>'}
function settings(){return `<div class="two controls"><label>Изгиб: <b id="powerValue">${S.power}</b> из 3<input id="power" type="range" min="1" max="3" value="${S.power}" style="width:100%"></label><label>Направление: <b id="angleValue">${S.angle}°</b><input id="angle" type="range" min="15" max="90" step="15" value="${S.angle}" style="width:100%"></label></div><p class="small">Условная модель: одинаковый лёгкий груз, без сопротивления воздуха. Числа на экране не предсказывают дальность настоящей конструкции.</p>`}
function table(){return S.logs.length?`<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Опыт</th><th>Изгиб</th><th>Угол</th><th>Дальность</th></tr></thead><tbody>${S.logs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.p} / 3</td><td>${r.a}°</td><td>${r.d.toLocaleString('ru',{maximumFractionDigits:1})} шип.</td></tr>`).join('')}</tbody></table></div>`:''}
function render(){cancelAnimationFrame(frame);busy=false;let i=S.step,h='';
if(i===0)h=`<span class="badge">Исследование 1</span><h2>Согни — и отпусти</h2><p class="sub">Испытай две детали на экране. У упругой детали установи изгиб хотя бы 2, затем отпусти её. Переключись на жёсткий кирпичик и сравни поведение.</p><div class="pills">${[['elastic','Упругая деталь'],['rigid','Жёсткий кирпичик']].map(([v,t])=>`<button class="pill ${S.material===v?'active':''}" data-material="${v}" aria-pressed="${S.material===v}">${t}</button>`).join('')}</div><div class="scene" id="scene">${beam(S.bend*25)}</div><div class="controls"><label for="bend">Изгиб детали: <b id="bendValue">${S.bend}</b> из 3</label><input id="bend" type="range" min="0" max="3" value="${S.bend}" ${S.material==='rigid'?'disabled':''} style="width:100%"><button class="btn primary" id="release">${S.material==='elastic'?'Отпустить деталь':'Проверить кирпичик'}</button></div><p class="explain">Упругая деталь запасает энергию при изгибе и отдаёт её, возвращаясь в исходную форму. Гибкая деталь может гнуться; упругая ещё и восстанавливает форму.</p>`;
if(i===1)h=`<span class="badge">Исследование 2</span><h2>От чего зависит прыжок?</h2><p class="sub">Проведи два опыта с одинаковым углом и разным изгибом. Затем оставь изгиб прежним и измени угол. После таких сравнений откроется следующий шаг.</p>${settings()}<div class="scene" id="scene">${arena()}</div><button class="btn primary" id="launch">Согнуть и отпустить</button><h3 style="margin-top:20px">Журнал испытаний</h3><div id="logs">${table()}</div>`;
if(i===2)h=`<span class="badge">Инженерная задача</span><h2>Перелети отметку 10 шипов</h2><p class="sub">Собери подбрасыватель: выбери широкое тяжёлое основание, закрепи упругую деталь и настрой прыжок так, чтобы груз оказался дальше 10 шипов.</p><div class="controls row"><label>Основание <select id="base"><option value="small" ${S.base==='small'?'selected':''}>Маленькое</option><option value="wide" ${S.base==='wide'?'selected':''}>Широкое и тяжёлое</option></select></label><button class="btn ${S.spring?'primary':''}" id="spring" aria-pressed="${S.spring}">${S.spring?'✓ Упругая деталь закреплена':'Закрепить упругую деталь'}</button></div>${settings()}<div class="scene" id="scene">${arena()}</div><button class="btn primary" id="launch">Испытать подбрасыватель</button>`;
if(i===3)h=`<span class="badge">Практическая работа</span><h2>Построй своего Прыгуна</h2><p class="sub">Используй широкое основание и предназначенную для изгиба упругую деталь. При необходимости попроси учителя подобрать её. Испытай подбрасыватель с лёгким бумажным шариком и измерь дальность в шипах LEGO.</p><p class="explain">Не сгибай обычные жёсткие кирпичики и балки силой. Изгибай подходящую деталь понемногу. Направляй запуск на свободную площадку, подальше от людей.</p><div class="checklist">${['Я выбрал подходящую упругую деталь и надёжно закрепил её.','Моё широкое основание не сдвигается при изгибе детали.','Я провёл несколько запусков и измерил дальность.'].map((t,k)=>`<label><input type="checkbox" data-check="${k}" ${S.checks.has(k)?'checked':''}>${t}</label>`).join('')}</div><p class="small">Если деталей сейчас нет, вернись к этому шагу после сборки.</p><label for="note"><h3 style="margin-top:18px">Запиши результат и своё открытие</h3></label><textarea id="note" placeholder="Мой лучший результат — … шипов. При изгибе деталь…"></textarea><button class="btn primary" id="finish">Завершить работу</button><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Шаги задания"><b>Твои шаги</b>${names.map((t,k)=>`<button class="step ${k===i?'current':S.done.has(k)?'done':''}" data-step="${k}" aria-label="${k+1}. ${t}" ${k>0&&!S.done.has(k-1)?'disabled':''}>${S.done.has(k)?'✓':k+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div></section>`;
document.querySelectorAll('[data-material]').forEach(b=>b.onclick=()=>{S.material=b.dataset.material;S.bend=0;render()});
if($('#bend'))$('#bend').oninput=e=>{S.bend=Number(e.target.value);$('#bendValue').textContent=S.bend;$('#scene').innerHTML=beam(S.bend*25)};
if($('#release'))$('#release').onclick=release;
for(const k of ['power','angle'])if($('#'+k))$('#'+k).oninput=e=>{S[k]=Number(e.target.value);$('#'+k+'Value').textContent=S[k]+(k==='angle'?'°':'');if(!busy)$('#scene').innerHTML=arena()};
if($('#base'))$('#base').onchange=e=>{S.base=e.target.value;S.done.delete(2);render()};if($('#spring'))$('#spring').onclick=()=>{S.spring=!S.spring;S.done.delete(2);render()};if($('#launch'))$('#launch').onclick=launch;
if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));
if(i===3){$('#note').value=S.note;$('#note').oninput=e=>S.note=e.target.value;document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let k=Number(c.dataset.check);c.checked?S.checks.add(k):S.checks.delete(k)});$('#finish').onclick=()=>{if(S.checks.size<3||!S.note.trim()){msg('Отметь выполненные действия и запиши результат своих испытаний.',false);return}mark();$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Испытатель гибкости!</h2><p>Ты исследовал упругость, сравнил прыжки и создал подбрасыватель. Энергия изгиба превратилась в движение!</p><button class="btn" id="again">Начать заново</button></div>';$('#again').onclick=()=>{S.done.clear();S.seen.clear();S.logs=[];S.checks.clear();S.note='';S.material='elastic';S.bend=0;S.power=2;S.angle=45;S.base='small';S.spring=false;go(0)}};}}
function checkMaterials(){if(S.seen.size===2){mark();msg('Оба опыта выполнены! Упругая деталь вернулась в исходную форму. Жёсткий кирпичик в этой модели не сгибается.')}}
function release(){if(busy)return;if(S.material==='rigid'){S.seen.add('rigid');msg('Кирпичик сохраняет форму. Не пытайся согнуть его силой.');checkMaterials();return}if(S.bend<2){msg('Задай изгиб 2 или 3, затем отпусти деталь.',false);return}busy=true;$('#release').disabled=true;$('#bend').disabled=true;let start=null,b=S.bend;function tick(t){if(start===null)start=t;const f=Math.min(1,(t-start)/900);$('#scene').innerHTML=beam(b*25*Math.cos(f*3*Math.PI)*Math.exp(-f*4)*(1-f));if(f<1)frame=requestAnimationFrame(tick);else{S.bend=0;busy=false;S.seen.add('elastic');$('#bend').value=0;$('#bendValue').textContent=0;$('#bend').disabled=false;$('#release').disabled=false;msg('Упругая деталь выпрямилась: запасённая энергия перешла в движение.');checkMaterials();}}frame=requestAnimationFrame(tick)}
function distance(p,a){return Math.max(0,2*p*p*Math.sin(2*a*Math.PI/180))}
function comparisons(){let bend=false,angle=false;for(const a of S.logs)for(const b of S.logs){if(a.a===b.a&&a.p!==b.p)bend=true;if(a.p===b.p&&a.a!==b.a)angle=true}return bend&&angle}
function launch(){if(busy)return;if(S.step===2&&(!S.spring||S.base!=='wide')){msg(!S.spring?'Сначала закрепи упругую деталь.':'Выбери широкое тяжёлое основание, чтобы выполнить условие модели.',false);return}const p=S.power,a=S.angle,d=distance(p,a),th=a*Math.PI/180,v=6*p,g=18,T=2*v*Math.sin(th)/g;busy=true;$('#launch').disabled=true;for(const k of ['power','angle','base','spring'])if($('#'+k))$('#'+k).disabled=true;let start=null,path='M100 305';function tick(ts){if(start===null)start=ts;const f=Math.min(1,(ts-start)/1500),t=f*T,x=100+v*Math.cos(th)*t*18,y=305-(v*Math.sin(th)*t-g*t*t/2)*18;path+=` L${x.toFixed(2)} ${y.toFixed(2)}`;$('#scene').innerHTML=arena(x,y,path);if(f<1){frame=requestAnimationFrame(tick);return}busy=false;$('#launch').disabled=false;for(const k of ['power','angle','base','spring'])if($('#'+k))$('#'+k).disabled=false;if(S.step===1){S.logs.push({p,a,d});$('#logs').innerHTML=table();if(comparisons()){mark();msg('Сравнения готовы! При одинаковом угле больший изгиб дал больший прыжок. При одинаковом изгибе изменение угла изменяет дальность.')}else msg('Дальность: '+d.toLocaleString('ru',{maximumFractionDigits:1})+' шип. Продолжи опыты: меняй только один параметр за раз.');}else if(d>10){mark();msg('Успех! Дальность '+d.toLocaleString('ru',{maximumFractionDigits:1})+' шипов — больше 10. Энергия упругой детали привела груз в движение.')}else msg('Дальность: '+d.toLocaleString('ru',{maximumFractionDigits:1})+' шип. Измени изгиб или угол и повтори запуск.',false);}frame=requestAnimationFrame(tick)}
function go(i){S.step=i;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
