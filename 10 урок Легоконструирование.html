<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>LEGO-Мастерская — урок 10. Машина-помощник</title>
<style>
:root{--ink:#152b49;--muted:#57708c;--blue:#1859af;--blue2:#2f7dca;--cyan:#e8f3ff;--line:#d9e6f3;--pale:#f5f9fd;--good:#108165;--red:#db695c;--gold:#ffba42}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 6% 4%,#dfedff 0%,transparent 34%),radial-gradient(ellipse at 96% 4%,#fff0d6 0%,transparent 34%),#f5f8fc;color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #46a5ff;outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(25px,4.5vw,34px);line-height:1.13;margin:5px 0 10px}h2{font-size:clamp(22px,4vw,28px);line-height:1.2;margin:7px 0 10px}h3{font-size:17px;margin:0 0 9px}.wrap{max-width:970px;margin:auto;padding:0 15px}.header{padding:20px 0 17px;display:flex;align-items:center;gap:12px}.logo{display:grid;grid-template-columns:repeat(2,20px);gap:5px;transform:rotate(-8deg)}.logo i{height:18px;border-radius:4px;box-shadow:inset 0 -4px rgba(0,0,0,.14);background:#ffc342}.logo i:nth-child(2){background:#e95f58}.logo i:nth-child(3){background:#3886da}.logo i:nth-child(4){background:#2db396}.kicker{color:#316bae;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.brand{font-size:19px;font-weight:900;letter-spacing:-.025em}.hero{background:linear-gradient(112deg,#16549f,#2b7daf);color:white;display:flex;gap:15px;justify-content:space-between;align-items:center;border-radius:23px;padding:22px 25px}.hero .kicker{color:#d4ebff}.hero p{color:#e8f4ff;max-width:730px}.hero-icon{font-size:46px}.progress{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:17px 0}.progress b{font-size:12px;color:var(--muted);margin-right:7px}.dot{border:1px solid #ccdef1;border-radius:11px;width:37px;height:37px;display:grid;place-items:center;background:white;color:#4a6c8e;font-weight:800;font-size:12px}.dot.now{color:#164e97;background:#e8f3ff;border-color:#4087dc}.dot.done{color:#137b5a;background:#e4f8ec;border-color:#9cdbb8}.paper{background:white;border:1px solid #dce7f1;border-radius:23px;padding:clamp(17px,3.6vw,30px);box-shadow:0 13px 32px #1f4d7c0c;margin-bottom:38px}.eyebrow{display:inline-block;border-radius:999px;color:#245a98;background:#ebf5ff;padding:5px 11px;font-size:12px;font-weight:850}.sub{color:var(--muted);margin:0 0 19px;max-width:780px}.scene{border:1px solid var(--line);border-radius:17px;background:linear-gradient(#f9fcff,#edf5ff);padding:13px;overflow:hidden}.scene svg{width:100%;height:auto;display:block;max-height:315px}.scene small,.note{display:block;color:var(--muted);font-size:12px;text-align:center;margin-top:5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.answer{border:2px solid #dce8f5;border-radius:15px;min-height:95px;padding:12px;background:#fbfdff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--ink);font-weight:700;text-align:center}.answer svg{width:100%;max-height:140px;height:auto}.answer .letter{align-self:flex-start;font-size:12px;font-weight:900;border-radius:8px;background:#e8f0fa;color:#245b90;padding:5px 10px}.answer.selected{background:#e9f3ff;border-color:#1b63bd}.answer:hover{border-color:#7eafe7}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.btn{border:2px solid #cddfeb;background:white;color:#315e87;padding:11px 17px;border-radius:12px;font-weight:850}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.secondary{background:#eaf4ff;color:#185caa;border-color:#a7c8eb}.btn:disabled{opacity:.48;cursor:default}.btn:hover:not(:disabled){filter:brightness(.97)}.feedback{padding:13px 15px;border-radius:12px;margin-top:16px;font-weight:650}.feedback.good{border-left:5px solid #15936c;background:#e9f8f0;color:#106b50}.feedback.bad{border-left:5px solid #e0a13d;background:#fff6e6;color:#77551b}.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.toolrow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.tool{border:2px solid #dce8f5;border-radius:13px;padding:10px 7px;font-weight:800;background:white;color:#244d77;text-align:center}.tool.active{background:#dcecff;border-color:#3982cf;color:#174d91}.tool small{display:block;font-size:11px;font-weight:550;margin-top:3px;color:var(--muted)}.feature{display:flex;align-items:center;gap:9px;border-radius:12px;padding:10px 12px;background:#f1f7fe;margin:11px 0;color:#3d5d7b;font-size:14px}.feature b{color:#183d67}.pill{display:inline-flex;align-items:center;gap:7px;border-radius:10px;padding:9px 11px;background:#eff7ff;color:#245d95;font-weight:750;font-size:13px}.stage{border:1px solid #d7e4f3;background:#f6faff;border-radius:15px;padding:14px}.stage h3{margin-bottom:5px}.stepbox{display:grid;gap:10px}.checkline{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fbfdff;font-weight:600}.checkline input{width:21px;height:21px;accent-color:#246aba;flex:none;margin:2px 0 0}.complete{padding:clamp(24px,5vw,42px);border-radius:23px;background:linear-gradient(125deg,#e8fff0,#eff7ff);border:1px solid #bde7d3;margin-top:18px}.complete .big{font-size:47px}.complete p{max-width:630px;color:#38657a;margin:8px 0 20px}.sectiongap{margin-top:15px}.tiny{font-size:12px;color:var(--muted)}.readout{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:11px;background:#fff;border:1px solid #dbe6f2;margin-top:12px}.readout b{font-size:14px}.strongblue{color:#185aa8}.hintline{font-size:13px;color:#4a6889;margin-top:10px}.foot{margin:12px auto 35px;font-size:13px;color:#57708a;text-align:center}.endline{height:5px;background:#dce6f4;border-radius:999px;margin:13px 0}.endline span{height:100%;display:block;background:#1e75c8;border-radius:999px;transition:width .2s}
@media(max-width:650px){.hero{padding:18px}.hero-icon{display:none}.two{grid-template-columns:1fr}.three{grid-template-columns:repeat(2,1fr)}.choicegrid{grid-template-columns:1fr 1fr}.toolrow{grid-template-columns:1fr 1fr}.answer{padding:9px;min-height:85px}.paper{padding:17px}.scene{padding:8px}.readout{flex-direction:column;align-items:flex-start}.btn{padding:10px 13px}.feature{font-size:13px}}
@media(max-width:370px){.choicegrid,.three{grid-template-columns:1fr}.progress{gap:6px}.dot{width:32px;height:32px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

<body><header class="wrap header"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><div class="kicker">Интерактивный курс · 2 класс</div><div class="brand">LEGO-Мастерская</div></div></header>
<main class="wrap"><section class="hero"><div><div class="kicker">Урок 10 · Инженерная долина</div><h1>Машина-помощник</h1><p>Ты узнаешь, как работают рычаг, колесо и ось, а затем создашь машину, которая помогает перемещать груз.</p></div><div class="hero-icon" aria-hidden="true">⚙️</div></section><div id="app"></div></main>
<script>
'use strict';
const $=sel=>document.querySelector(sel);
const tasks=['Найди рычаг','Испытай рычаг','Собери колёса','Проверь движение','Машина-помощник','Настоящая мастерская'];
const state={step:0,done:new Set(),feedback:'',success:false,selected:null,optionOrder:{},pivot:1,pressed:false,parts:{axle:false,left:false,right:false},trial:{drag:false,roll:false},cargo:1,checks:new Set()};
function randint(max){let r;if(window.crypto?.getRandomValues){let a=new Uint32Array(1);window.crypto.getRandomValues(a);r=a[0]/4294967296}else{r=Math.random()}return Math.floor(r*max)}
function shuffle(a){let v=a.slice();for(let i=v.length-1;i>0;i--){let j=randint(i+1);[v[i],v[j]]=[v[j],v[i]]}return v}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function progress(){return `<div class="progress"><b>Твои шаги</b>${tasks.map((_,i)=>`<span class="dot ${i===state.step?'now':state.done.has(i)?'done':''}">${state.done.has(i)?'✓':i+1}</span>`).join('')}</div>`}
function svgHead(label,w=650,h=245){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" xmlns="http://www.w3.org/2000/svg">`}
function brick(x,y,w,h,c='#e85b52'){return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${c}" stroke="#284969" stroke-width="1.2"/>${Array.from({length:Math.max(1,Math.floor(w/24))},(_,i)=>`<rect x="${x+6+i*(w-13)/Math.max(1,Math.floor(w/24))}" y="${y-5}" width="8" height="6" rx="2" fill="${c}" stroke="#284969" stroke-width=".6"/>`).join('')}</g>`}
function beamCard(kind){let s=svgHead('Пример механизма',300,147);s+=`<path d="M12 125H288" stroke="#cbd9e8" stroke-width="3"/>`;
if(kind==='lever')s+=`<polygon points="135,116 155,83 176,116" fill="#f2b342" stroke="#9e7132" stroke-width="2"/><path d="M30 89L259 89" stroke="#2474c2" stroke-width="16" stroke-linecap="round"/>${brick(36,53,51,27)}<path d="M251 52V74" stroke="#c85847" stroke-width="4"/><path d="M239 63L251 77L263 63" fill="none" stroke="#c85847" stroke-width="4"/>`;
if(kind==='cart')s+=`<rect x="68" y="58" width="167" height="49" rx="7" fill="#2e89d0" stroke="#275382" stroke-width="2"/><path d="M68 62l27 -20h117l23 20" fill="#6bb0e8" stroke="#285682" stroke-width="2"/><rect x="77" y="105" width="145" height="7" fill="#547698"/><circle cx="107" cy="121" r="19" fill="#223f63"/><circle cx="197" cy="121" r="19" fill="#223f63"/><circle cx="107" cy="121" r="7" fill="#dceefe"/><circle cx="197" cy="121" r="7" fill="#dceefe"/>`;
if(kind==='stack')s+=brick(95,92,109,29)+brick(103,57,92,29)+`<path d="M237 44v61" stroke="#b2bfd0" stroke-width="5"/><path d="M223 104H248" stroke="#b2bfd0" stroke-width="5"/>`;
return s+'</svg>'}
function renderFirst(){let choices=[{id:'lever',name:'Балка на опоре'},{id:'cart',name:'Тележка на колёсах'},{id:'stack',name:'Башня из кирпичиков'}];if(!state.optionOrder[0])state.optionOrder[0]=shuffle(choices.map(x=>x.id));return `<p class="sub">В Инженерной долине нужно поднять тяжёлый кирпич. На каком рисунке показан <b>рычаг</b> — длинная балка, лежащая на опоре?</p><div class="choicegrid">${state.optionOrder[0].map((id,i)=>{let c=choices.find(x=>x.id===id);return `<button class="answer ${state.selected===id?'selected':''}" data-choice="${id}" aria-pressed="${state.selected===id}"><span class="letter">${'АБВ'[i]}</span>${beamCard(id)}</button>`}).join('')}</div>`}
const pivots=[168,246,325];
function leverDiagram(){let p=pivots[state.pivot],tilt=state.pressed&&state.pivot===0?0.13:0;let y=x=>157+(x-p)*Math.sin(tilt);let ly=y(78),ry=y(560);let loadY=ly-42;let s=svgHead('Синий рычаг с красным грузом слева и точкой опоры',650,268);s+=`<path d="M30 216H620" stroke="#cfdeed" stroke-width="7" stroke-linecap="round"/><text x="43" y="241" fill="#486a8d" font-size="16" font-weight="700">ГРУЗ</text><text x="493" y="241" fill="#486a8d" font-size="16" font-weight="700">НАЖМИ ЗДЕСЬ</text>`;
s+=`<polygon points="${p-23},216 ${p},161 ${p+23},216" fill="#f4b343" stroke="#ad7938" stroke-width="3"/><circle cx="${p}" cy="164" r="8" fill="#fcebc1" stroke="#ad7938" stroke-width="2"/>`;
s+=`<path d="M78 ${ly} L560 ${ry}" stroke="#165eae" stroke-width="17" stroke-linecap="round"/>`;
s+=brick(50,loadY,57,35,'#e86d54')+`<path d="M530 ${ry-63}v39" stroke="#d55d57" stroke-width="6" stroke-linecap="round"/><path d="M515 ${ry-37}l15 16 15 -16" stroke="#d55d57" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
s+=`<text x="${p}" y="137" text-anchor="middle" fill="#966015" font-size="14" font-weight="800">ОПОРА</text>`;
return s+'</svg>'}
function renderLever(){return `<p class="sub">Груз лежит слева. Передвигай жёлтую опору под синей балкой и нажимай на её правый конец. <b>Где груз поднимется легче?</b></p><div class="scene">${leverDiagram()}<div class="readout"><span class="tiny">Положение опоры</span><b>${['Слева','Посередине','Справа'][state.pivot]}</b></div></div><div class="toolrow">${['Передвинуть влево','Поставить посередине','Передвинуть вправо'].map((txt,i)=>`<button class="tool ${state.pivot===i?'active':''}" data-pivot="${i}" aria-pressed="${state.pivot===i}">${txt}</button>`).join('')}</div><div class="buttons"><button class="btn secondary" id="pressLever">⬇ Нажать на рычаг</button></div><div class="hintline">Пробуй разные положения опоры и наблюдай, поднимается ли красный кирпичик.</div>`}
function cartDiagram(){let {axle,left,right}=state.parts;let s=svgHead('Конструктор тележки: кузов, ось и два колеса',650,236);s+=`<path d="M30 194H620" stroke="#cbd9e9" stroke-width="7" stroke-linecap="round"/>`;
s+=`<rect x="170" y="63" width="316" height="93" rx="14" fill="#4a98dd" stroke="#245a92" stroke-width="3"/><rect x="190" y="47" width="275" height="21" rx="5" fill="#9acaf1" stroke="#245a92" stroke-width="2"/>`;
s+=brick(256,75,54,39,'#f3bc3f')+brick(325,75,54,39,'#eb6961');
if(axle)s+=`<path d="M215 171H445" stroke="#455976" stroke-width="12" stroke-linecap="round"/><text x="330" y="222" text-anchor="middle" fill="#54718d" font-size="14">ось</text>`;
else s+=`<path d="M215 171H445" stroke="#b0c8df" stroke-dasharray="11 8" stroke-width="6" stroke-linecap="round"/>`;
for(let [x,exists] of [[235,left],[427,right]]){if(exists)s+=`<circle cx="${x}" cy="171" r="26" fill="#264a72" stroke="#183959" stroke-width="4"/><circle cx="${x}" cy="171" r="12" fill="#ceeafa" stroke="#46779d" stroke-width="3"/>`;else s+=`<circle cx="${x}" cy="171" r="26" fill="none" stroke="#a9c3dc" stroke-dasharray="6 6" stroke-width="3"/>`}
return s+'</svg>'}
function renderCart(){return `<p class="sub">У машины уже есть кузов с грузом. Помоги ей поехать: установи <b>ось и два колеса</b>. Нажимай на детали, чтобы добавить или снять их.</p><div class="scene">${cartDiagram()}<div class="note">Нажми на названия деталей под рисунком.</div></div><div class="toolrow">${[['axle','Ось','Соединяет колёса'],['left','Левое колесо','Круглая деталь'],['right','Правое колесо','Круглая деталь']].map(([key,t,desc])=>`<button class="tool ${state.parts[key]?'active':''}" data-part="${key}" aria-pressed="${state.parts[key]}">${state.parts[key]?'✓ ':''}${t}<small>${desc}</small></button>`).join('')}</div><div class="buttons"><button class="btn secondary" id="testCart">▶ Проверить машину</button></div>`}
function transportDiagram(){let a=state.trial;let s=svgHead('Сравнение: коробка скользит по полу и коробка катится на колёсах',650,300);s+=`<text x="35" y="30" fill="#254f7c" font-size="18" font-weight="750">Без колёс</text><text x="35" y="170" fill="#254f7c" font-size="18" font-weight="750">С колёсами</text>`;
s+=`<path d="M27 130H625" stroke="#c4d7e9" stroke-width="5" stroke-linecap="round"/><path d="M27 269H625" stroke="#c4d7e9" stroke-width="5" stroke-linecap="round"/>`;
s+=brick(a.drag?164:83,76,73,51,'#ed8d45');
let x=a.roll?290:83;s+=`<rect x="${x}" y="204" width="73" height="43" rx="5" fill="#ed8d45" stroke="#a35b31" stroke-width="2"/><path d="M${x-2} 253H${x+76}" stroke="#496885" stroke-width="6"/>`;
for(let dx of [15,60]){let cx=x+dx,cy=258;s+=`<circle cx="${cx}" cy="${cy}" r="15" fill="#1e4e81" stroke="#163958" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="6" fill="#cde9ff"/>`}
if(a.drag)s+=`<path d="M83 57H159" stroke="#ed9e74" stroke-width="4" stroke-dasharray="5 6"/>`;
if(a.roll)s+=`<path d="M83 192H282" stroke="#9bb9d5" stroke-width="4" stroke-dasharray="5 6"/>`;
return s+'</svg>'}
function renderCompare(){const options=[{id:'wheels',label:'На колёсах'},{id:'floor',label:'Без колёс'},{id:'same',label:'Одинаково'}];if(!state.optionOrder[3])state.optionOrder[3]=shuffle(options.map(x=>x.id));return `<p class="sub">Две одинаковые коробки стоят на одном полу. Одну передвигают без колёс, другую — на колёсах. Сравни, что происходит при одинаковом толчке.</p><div class="scene">${transportDiagram()}</div><div class="buttons"><button class="btn secondary" data-trial="drag">Толкнуть без колёс</button><button class="btn secondary" data-trial="roll">Толкнуть на колёсах</button><button class="btn" id="resetTrial">Начать сравнение заново</button></div><div class="sectiongap"><h3>Какую коробку обычно передвигать легче?</h3><div class="choicegrid">${state.optionOrder[3].map((id,i)=>`<button class="answer ${state.selected===id?'selected':''}" data-choice="${id}" aria-pressed="${state.selected===id}"><span class="letter">${'АБВ'[i]}</span>${options.find(x=>x.id===id).label}</button>`).join('')}</div></div>`}
const positions=[245,325,405];
function wheelbarrow(){let x=positions[state.cargo];let lift=state.success&&state.step===4?26:0;let s=svgHead('Схема тачки: переднее колесо служит опорой, груз можно перемещать ближе к колесу или дальше',650,305);
s+=`<path d="M23 247H625" stroke="#c9d9e8" stroke-width="6" stroke-linecap="round"/><text x="67" y="292" fill="#4e6c8a" font-size="15">КОЛЕСО</text><text x="503" y="292" fill="#4e6c8a" font-size="15">РУЧКИ</text>`;
s+=`<g transform="rotate(${lift?(-lift/5):0} 130 218)"><path d="M122 218L557 191" stroke="#1f67b1" stroke-width="16" stroke-linecap="round"/><path d="M194 150L460 150L432 215L222 218Z" fill="#80b5e2" stroke="#28669e" stroke-width="4"/><path d="M208 158H448" stroke="#cae5f6" stroke-width="3"/></g>`;
s+=`<circle cx="130" cy="220" r="33" fill="#294d78" stroke="#123f6c" stroke-width="5"/><circle cx="130" cy="220" r="13" fill="#d6edff" stroke="#3878a5" stroke-width="3"/>`;
s+=`<g transform="rotate(${lift?(-lift/5):0} 130 218)">${brick(x-30,105,60,38,'#ed8d4a')}</g>`;
for(let [i,xx] of positions.entries()){s+=`<path d="M${xx} 81V98" stroke="${i===state.cargo?'#1878c8':'#afc3d7'}" stroke-width="${i===state.cargo?5:2}" stroke-dasharray="4 4"/>`}
s+=`<path d="M540 158L558 180" stroke="#ef6c5c" stroke-width="5" stroke-linecap="round"/>`;
return s+'</svg>'}
function renderHelper(){return `<p class="sub">Перед тобой тачка. Её колесо помогает катиться, а ручки работают как рычаг. <b>Куда положить тяжёлый кирпичик, чтобы ручки было легче приподнять?</b> Пробуй разные места.</p><div class="scene">${wheelbarrow()}<div class="note">Нажми на одно из мест, чтобы переставить красный груз.</div></div><div class="toolrow">${['Место 1','Место 2','Место 3'].map((t,i)=>`<button class="tool ${state.cargo===i?'active':''}" data-cargo="${i}" aria-pressed="${state.cargo===i}">${t}</button>`).join('')}</div><div class="buttons"><button class="btn secondary" id="liftBarrow">⬆ Попробовать поднять ручки</button></div>`}
function renderProject(){let texts=['Я построил простую конструкцию с осью и колёсами.','Я проверил, что колёса свободно вращаются.','Я использовал длинную деталь как рычаг.','Я испытал модель с грузом и рассказал учителю, как работают механизмы.'];return `<p class="sub">Теперь инженерная мастерская ждёт тебя! Возьми настоящий конструктор и собери машину-помощник: например, тачку для перевозки кирпичиков.</p><div class="two"><div class="stage"><h3>Твой план</h3><div class="scene">${cartDiagram()}</div><p class="hintline">Колёса должны катиться, а ручки — помогать поднимать груз.</p><p class="hintline"><b>Испытай модель:</b> сначала без груза, затем с несколькими LEGO-кирпичиками.</p></div><div><h3>Проверь свою работу</h3><div class="stepbox">${texts.map((x,i)=>`<label class="checkline"><input type="checkbox" data-check="${i}" ${state.checks.has(i)?'checked':''}><span>${x}</span></label>`).join('')}</div><p class="hintline">Отмечай только то, что действительно сделал.</p></div></div>`}
function stepContent(){switch(state.step){case 0:return renderFirst();case 1:return renderLever();case 2:return renderCart();case 3:return renderCompare();case 4:return renderHelper();case 5:return renderProject()}}
function actionButtons(){if(state.success)return `<div class="buttons"><button class="btn primary" id="next">${state.step===5?'Завершить урок →':'Следующее задание →'}</button></div>`;if(state.step===0||state.step===3)return `<div class="buttons"><button class="btn primary" id="check">Проверить ответ</button></div>`;if(state.step===5)return `<div class="buttons"><button class="btn primary" id="projectDone" ${state.checks.size<4?'disabled':''}>Я выполнил задание ✓</button></div>`;return ''}
function render(){if(state.step>=6){finish();return}let names=['Найди рычаг','Как поднять тяжёлый груз?','Собери колёса и ось','Что легче передвигать?','Испытай машину-помощник','Создай настоящую машину'];$('#app').innerHTML=progress()+`<section class="paper"><span class="eyebrow">Задание ${state.step+1} из 6</span><h2>${names[state.step]}</h2>${stepContent()}${actionButtons()}${state.feedback?`<div class="feedback ${state.success?'good':'bad'}" role="status">${esc(state.feedback)}</div>`:''}</section>`;bind()}
function succeeded(text){state.success=true;state.feedback=text;state.done.add(state.step);render()}
function notYet(text){state.success=false;state.feedback=text;render()}
function bind(){document.querySelectorAll('[data-choice]').forEach(x=>x.addEventListener('click',()=>{state.selected=x.dataset.choice;state.feedback='';state.success=false;state.done.delete(state.step);render()}));document.querySelectorAll('[data-pivot]').forEach(x=>x.addEventListener('click',()=>{state.pivot=Number(x.dataset.pivot);state.pressed=false;state.feedback='';state.success=false;state.done.delete(state.step);render()}));document.querySelectorAll('[data-part]').forEach(x=>x.addEventListener('click',()=>{let p=x.dataset.part;state.parts[p]=!state.parts[p];state.feedback='';state.success=false;state.done.delete(state.step);render()}));document.querySelectorAll('[data-cargo]').forEach(x=>x.addEventListener('click',()=>{state.cargo=Number(x.dataset.cargo);state.feedback='';state.success=false;state.done.delete(state.step);render()}));document.querySelectorAll('[data-trial]').forEach(x=>x.addEventListener('click',()=>{state.trial[x.dataset.trial]=true;render()}));document.querySelectorAll('[data-check]').forEach(x=>x.addEventListener('change',()=>{let i=Number(x.dataset.check);x.checked?state.checks.add(i):state.checks.delete(i);state.feedback='';state.success=false;state.done.delete(state.step);render()}));let chk=$('#check');if(chk)chk.addEventListener('click',()=>{let correct=state.step===0?'lever':'wheels';if(state.selected===null)return notYet('Сначала выбери один ответ.');if(state.selected===correct)succeeded(state.step===0?'Правильно! Рычаг — это балка, которая поворачивается вокруг опоры.':'Верно! На колёсах груз катится, поэтому его обычно легче передвигать по ровной поверхности.');else notYet(state.step===0?'Присмотрись: у рычага обязательно есть балка и опора под ней.':'Подумай, что легче: скользить по полу или катиться на колёсах.')});let p=$('#pressLever');if(p)p.addEventListener('click',()=>{state.pressed=true;if(state.pivot===0)succeeded('Получилось! Когда опора ближе к грузу, длинным концом балки легче поднять тяжёлый кирпичик.');else notYet('С этим положением опоры груз не поднялся. Попробуй передвинуть жёлтую опору и снова нажать.')});let tc=$('#testCart');if(tc)tc.addEventListener('click',()=>{if(Object.values(state.parts).every(Boolean))succeeded('Машина готова! Два колеса соединены осью — теперь груз можно катить.');else notYet('Машина пока не готова к поездке. Проверь, есть ли ось и оба колеса.')});let rs=$('#resetTrial');if(rs)rs.addEventListener('click',()=>{state.trial={drag:false,roll:false};state.feedback='';state.success=false;state.done.delete(state.step);render()});let lift=$('#liftBarrow');if(lift)lift.addEventListener('click',()=>{if(state.cargo===0)succeeded('Отлично! Когда груз ближе к колесу, приподнимать ручки легче: колесо служит опорой для рычага.');else notYet(state.cargo===1?'Ручки поднять можно, но попробуй переставить груз и найти положение, где ещё легче.':'Здесь поднимать ручки труднее. Попробуй передвинуть груз ближе к колесу.')});let pj=$('#projectDone');if(pj)pj.addEventListener('click',()=>{if(state.checks.size===4)succeeded('Ты выполнил все шаги! Покажи свою машину учителю и объясни, как работают рычаг, колёса и ось.')});let next=$('#next');if(next)next.addEventListener('click',()=>{state.step++;state.feedback='';state.success=false;state.selected=null;render();window.scrollTo({top:0,behavior:'smooth'})})}
function finish(){$('#app').innerHTML=`<div class="complete"><div class="big">🏆</div><div class="kicker">Миссия завершена</div><h2>Отличная работа, LEGO-инженер!</h2><p>Ты проверил, как рычаг помогает поднимать груз, а колёса с осью — перевозить его. Теперь ты можешь придумать собственную машину-помощник!</p><button class="btn primary" id="restart">Пройти урок ещё раз ↻</button></div>`;$('#restart').addEventListener('click',()=>{state.step=0;state.done=new Set();state.feedback='';state.success=false;state.selected=null;state.optionOrder={};state.pivot=1;state.pressed=false;state.parts={axle:false,left:false,right:false};state.trial={drag:false,roll:false};state.cargo=1;state.checks=new Set();render();window.scrollTo({top:0,behavior:'smooth'})})}
render();
</script></body></html>
