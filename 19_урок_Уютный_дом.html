button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1586da;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,5vw,38px);line-height:1.12;margin:5px 0 9px}h2{font-size:clamp(22px,4vw,28px);line-height:1.23;margin:9px 0 12px}h3{font-size:17px;margin:0 0 10px}.wrap{width:min(1020px,calc(100% - 26px));margin:auto}.brand{display:flex;gap:11px;align-items:center;padding:18px 0}.logo{display:grid;grid-template-columns:repeat(2,20px);gap:3px;transform:rotate(-8deg)}.logo span{height:18px;border-radius:5px;background:#f7b73b;box-shadow:inset 0 -5px 0 #bd7823}.logo span:nth-child(2){background:#e85a5b;box-shadow:inset 0 -5px 0 #bb3c42}.logo span:nth-child(3){background:#357ed5;box-shadow:inset 0 -5px 0 #245bb1}.logo span:nth-child(4){background:#28a79b;box-shadow:inset 0 -5px 0 #138276}.caps{font-weight:850;letter-spacing:.11em;font-size:10px;color:#22609e;text-transform:uppercase}.brandname{font-size:19px;line-height:1.2;font-weight:900}.hero{background:linear-gradient(115deg,#195399,#267bb8);border-radius:21px;color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero .caps{color:#cae6ff}.hero p{color:#e7f4ff;font-size:15px;margin:0;max-width:750px}.hero .emoji{font-size:54px}.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0}.progress b{font-size:12px;color:#5e738b;margin-right:5px}.step{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid #cadced;background:white;font-weight:800;font-size:13px;color:#547193}.step.current{color:#1761b0;background:#e7f1ff;border-color:#3380cc}.step.done{color:#116b52;background:#dff6ec;border-color:#95dac0}.panel{background:white;border:1px solid #dce6f2;box-shadow:0 12px 34px #22517b12;border-radius:23px;padding:clamp(17px,4vw,30px);margin-bottom:35px}.badge{display:inline-block;background:#edf5ff;color:#235e9c;padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}
@media(max-width:720px){.hero{padding:18px 19px}.hero .emoji{display:none}.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.builder{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{padding:18px}.scene{padding:6px}.wheelSlot{border-radius:8px}}
@media(max-width:420px){.choicegrid{grid-template-columns:1fr}.answer{min-height:70px}.hero h1{font-size:27px}.progress{gap:6px}.step{width:33px;height:33px}.editpanel{padding:9px}.buildgrid,.wheelrow{gap:3px}.cell{border-radius:5px}.wheelSlot{border-radius:6px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Падение модели при испытании: поворот вокруг нижнего края. */
.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}
.tower-body{transition:transform .8s cubic-bezier(.30,.08,.76,1.16)}
@keyframes toppleTower{from{transform:rotate(0deg)}to{transform:rotate(63deg)}}
.topple-now{animation:toppleTower .85s cubic-bezier(.35,.05,.73,1.1) forwards}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}} .plan{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:500px;margin:18px auto}.tile{aspect-ratio:1;border:2px solid #ccdeed;border-radius:6px;background:#fff;min-width:0;font-size:clamp(12px,3vw,23px);padding:0}.tile.wall{background:#659bd0}.tile.window{background:#b4ecff;border-color:#1889ac}.tile.door{background:#f4cf8a}.tile.bed{background:#d8c6f3}.tile.table{background:#f2b78b}.tile.chair{background:#b1dfca}.tile.route{box-shadow:inset 0 0 0 4px #31ac7c}.sortrow{display:flex;gap:10px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #dce6f2;align-items:center}.sortrow strong{min-width:150px} </style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">19 урок · Городские кварталы</div><h1>Уютный дом</h1><p>Открой Секрет Комфорта: создай прочный дом, впусти свет и обустрой комнату!</p></div><div class="emoji" aria-hidden="true">🏡</div></section>
<div id="app"></div></main><script>
'use strict';
const $=s=>document.querySelector(s), names=['Снаружи и внутри','Фасад дома','План комнаты','Мой LEGO-дом'];
const items=[['Фасад',0],['Крыша',0],['Наружное украшение стены',0],['Кровать в комнате',1],['Стол в комнате',1],['Пол комнаты',1]];
const S={step:0,done:new Set(),sort:Array(6).fill(null),facade:Array(40).fill('wall'),tool:'window',roof:false,bond:false,plan:Array(40).fill('empty'),furn:'bed',path:[],checks:new Set(),note:''};
const labels={wall:'Стена',empty:'Пусто',window:'Окно',door:'Дверь',bed:'Кровать',table:'Стол',chair:'Стул'}, icons={wall:'',empty:'',window:'▦',door:'🚪',bed:'🛏',table:'▤',chair:'▣'};
function msg(t,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=t}
function mark(){S.done.add(S.step);if($('#next'))$('#next').disabled=false}
function resetFrom(n){for(let j=n;j<4;j++)S.done.delete(j)}
function grid(a,kind){return '<div class="plan" role="group" aria-label="'+(kind==='f'?'Фасад, 5 рядов по 8 клеток':'План комнаты сверху, 5 рядов по 8 клеток')+'">'+a.map((v,i)=>`<button class="tile ${v} ${kind==='p'&&S.path.includes(i)?'route':''}" data-${kind}="${i}" aria-label="Ряд ${Math.floor(i/8)+1}, клетка ${i%8+1}: ${labels[v]}">${icons[v]}</button>`).join('')+'</div>'}
function palette(keys,chosen,attr){return '<div class="pills">'+keys.map(k=>`<button class="pill ${chosen===k?'active':''}" data-${attr}="${k}" aria-pressed="${chosen===k}">${labels[k]}</button>`).join('')+'</div>'}
function roof(){return `<svg viewBox="0 0 520 75" role="img" aria-label="${S.roof?'Крыша установлена':'Крыша ещё не установлена'}" style="width:100%;max-width:500px;display:block;margin:auto"><path d="M10 68 L260 8 L510 68 Z" fill="${S.roof?'#dc7860':'#eef3f8'}" stroke="#9d5b4d" stroke-width="3" ${S.roof?'':'stroke-dasharray="6 6"'}/></svg>`}
function render(){let h='';const i=S.step;
if(i===0)h=`<span class="badge">Городские кварталы · Секрет Комфорта</span><h2>Что снаружи, а что внутри?</h2><p class="sub">Главный Архитектор просит создать уютный дом для LEGO-человечка. Сначала распредели элементы: нажми подходящую мастерскую в каждой строке.</p><div class="explain"><b>Экстерьер</b> — внешний вид здания. <b>Интерьер</b> — внутреннее пространство и его обустройство.</div>${items.map(([t],k)=>`<div class="sortrow"><strong>${t}</strong>${['Экстерьер','Интерьер'].map((v,j)=>`<button class="pill ${S.sort[k]===j?'active':''}" data-sort="${k},${j}" aria-pressed="${S.sort[k]===j}">${v}</button>`).join('')}</div>`).join('')}<div class="actions"><button class="btn primary" id="sortCheck">Проверить распределение</button></div>`;
if(i===1)h=`<span class="badge">Конструкторская мастерская</span><h2>Впусти в дом свет</h2><p class="sub">Выбери деталь и нажимай клетки фасада. Сделай два отдельных окна и дверной проём шириной 2 клетки, высотой 3 клетки от нижнего ряда. Добавь крышу и перекрытие швов.</p>${palette(['wall','window','door'],S.tool,'tool')}<div class="scene">${roof()}${grid(S.facade,'f')}</div><p class="small">Вид спереди. Дверь занимает нижние три ряда. Каждое окно — одна клетка, между окнами оставь стену.</p><div class="controls pills"><button class="pill ${S.roof?'active':''}" id="roof" aria-pressed="${S.roof}">✓ Крыша</button><button class="pill ${S.bond?'active':''}" id="bond" aria-pressed="${S.bond}">✓ Перекрытие швов</button></div><div class="explain">Над проёмом нужна перемычка, а рядом — кирпичики, связывающие соседние ряды. На настоящей модели проверь, проходит ли человечек в дверь.</div><button class="btn primary" id="facadeCheck">Проверить фасад</button>`;
if(i===2)h=`<span class="badge">Дизайн интерьера</span><h2>Мебель есть. А пройти можно?</h2><p class="sub">Это вид комнаты сверху. Поставь кровать, стол и стул. Каждая деталь занимает одну условную клетку. Оставь свободный путь от входа к каждому предмету.</p>${palette(['bed','table','chair','empty'],S.furn,'furn')}<div class="scene">${grid(S.plan,'p')}<p class="direction">↑ ВХОД: две средние клетки нижнего ряда ↑</p></div><p class="small">Нажми клетку, чтобы поставить мебель. «Пусто» убирает предмет. Зелёная рамка после проверки показывает доступные клетки пола.</p><div class="explain">Сравни размеры мебели и человечка. На экране мы планируем расположение; размеры настоящих моделей подбери по своим деталям.</div><button class="btn primary" id="planCheck">Проверить свободный проход</button>`;
if(i===3)h=`<span class="badge">Практическая работа</span><h2>Построй настоящий уютный дом</h2><p class="sub">Собери основание, четыре стены, два окна и дверной проём. Перекрывай швы кирпичиков. Сделай съёмную крышу и обустрой комнату. Прозрачные детали можно заменить открытыми оконными проёмами.</p><div class="checklist">${['Стены связаны перекрытием швов, перемычки над проёмами закреплены.','В доме не меньше двух окон; человечек проходит в дверь.','Крыша опирается на стены и снимается для показа интерьера.','Внутри есть 2–3 предмета мебели по размеру человечка и свободный проход.','Я аккуратно проверил стены и улучшил слабое место.'].map((t,k)=>`<label><input type="checkbox" data-check="${k}" ${S.checks.has(k)?'checked':''}>${t}</label>`).join('')}</div><h3 style="margin-top:20px">В чём Секрет Комфорта твоего дома?</h3><label for="note" class="small">Расскажи, что находится снаружи и внутри и что ты улучшил.</label><textarea id="note" placeholder="Снаружи моего дома… Внутри… Я улучшил…"></textarea><div class="actions"><button class="btn primary" id="finish">Завершить урок</button></div><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Этапы урока"><b>Твои шаги</b>${names.map((n,k)=>`<button class="step ${k===i?'current':S.done.has(k)?'done':''}" data-step="${k}" aria-label="${k+1}. ${n}" ${k>0&&!S.done.has(k-1)?'disabled':''}>${S.done.has(k)?'✓':k+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div><p class="small" style="margin-top:20px">Результат этой работы виден на устройстве. После закрытия или обновления страницы задание начинается заново.</p></section>`;
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{let [k,v]=b.dataset.sort.split(',').map(Number);S.sort[k]=v;resetFrom(0);render()});
if($('#sortCheck'))$('#sortCheck').onclick=()=>{const errors=items.filter((v,k)=>S.sort[k]!==v[1]);if(errors.length){msg('Проверь: '+errors.map(v=>v[0]).join(', ')+'. Вспомни, где находятся эти элементы.',false);return}mark();msg('Верно! Теперь спроектируй внешний вид дома.')};
for(const key of ['tool','furn'])document.querySelectorAll('[data-'+key+']').forEach(b=>b.onclick=()=>{S[key]=b.dataset[key];render()});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.facade[+b.dataset.f]=S.tool;resetFrom(1);render()});
for(const k of ['roof','bond'])if($('#'+k))$('#'+k).onclick=()=>{S[k]=!S[k];resetFrom(1);render()};
if($('#facadeCheck'))$('#facadeCheck').onclick=checkFacade;
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.plan[+b.dataset.p]=S.furn;S.path=[];resetFrom(2);render()});
if($('#planCheck'))$('#planCheck').onclick=checkPlan;
if(i===3){$('#note').value=S.note;$('#note').oninput=e=>{S.note=e.target.value;S.done.delete(3);$('#award').innerHTML=''};document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{c.checked?S.checks.add(+c.dataset.check):S.checks.delete(+c.dataset.check);S.done.delete(3);$('#award').innerHTML=''});$('#finish').onclick=()=>{if(S.checks.size<5||!S.note.trim()){msg('Проверь настоящую постройку, отметь выполненные действия и запиши вывод.',false);return}mark();$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Мастер Архитектуры!</h2><p>Ты продумал экстерьер, впустил свет и обустроил интерьер. Секрет Комфорта открыт!</p><button class="btn" id="print">Распечатать итог</button></div>';$('#print').onclick=()=>window.print();msg('Урок завершён! Покажи дом и свой вывод учителю.')}}
}
function neighbors(i){return [i%8>0?i-1:-1,i%8<7?i+1:-1,i>=8?i-8:-1,i<32?i+8:-1].filter(x=>x>=0)}
function checkFacade(){let d=S.facade.flatMap((v,k)=>v==='door'?[k]:[]);let goodDoor=false;for(let c=0;c<7;c++){let a=[16+c,17+c,24+c,25+c,32+c,33+c];if(d.length===6&&a.every(k=>S.facade[k]==='door')&&[8+c,9+c].every(k=>S.facade[k]==='wall'))goodDoor=true}if(!goodDoor){msg('Сделай один дверной проём: 2 соседние клетки в каждом из трёх нижних рядов. Над ним оставь стену-перемычку.',false);return}let w=S.facade.flatMap((v,k)=>v==='window'?[k]:[]);if(w.length<2||w.some(k=>k<8||k>=32||k%8===0||k%8===7||neighbors(k).some(n=>S.facade[n]!=='wall'))){msg('Нужны хотя бы два отдельных окна. Окружи каждое окно стеной сверху, снизу и по бокам.',false);return}if(!S.roof||!S.bond){msg('Добавь крышу и включи кладку с перекрытием швов.',false);return}mark();msg('Фасад готов: есть свет, вход, крыша и прочная кладка. Теперь обустрой комнату.')}
function checkPlan(){if(['bed','table','chair'].some(t=>!S.plan.includes(t))){msg('Добавь кровать, стол и стул.',false);return}if([35,36].some(k=>S.plan[k]!=='empty')){msg('Освободи обе клетки у входа: нижний ряд, клетки 4 и 5.',false);return}const seen=new Set([35,36]),queue=[35,36];while(queue.length){let k=queue.shift();for(const n of neighbors(k))if(S.plan[n]==='empty'&&!seen.has(n)){seen.add(n);queue.push(n)}}const blocked=S.plan.some((v,k)=>v!=='empty'&&!neighbors(k).some(n=>seen.has(n)));S.path=[...seen];if(blocked){render();msg('К одному из предметов нет прохода от входа. Передвинь мебель: рядом с каждым предметом должна быть доступная клетка пола.',false);return}mark();render();msg('К каждому предмету можно подойти от входа! Перенеси свой план в настоящую LEGO-постройку.')}
function go(i){S.step=i;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
