<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 2%,#e0edff 0,transparent 36%),radial-gradient(ellipse at 95% 2%,#fff0d1 0,transparent 36%),var(--bg)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #1769c2;outline-offset:3px}button:disabled{opacity:.5;cursor:default}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,5vw,35px);line-height:1.13;letter-spacing:-.025em;margin:4px 0 10px}h2{font-size:clamp(22px,4vw,28px);line-height:1.2;margin:9px 0 12px}h3{font-size:17px;margin-bottom:9px}.wrap{width:min(970px,calc(100% - 28px));margin:auto}.top{padding:23px 0 15px}.brand{display:flex;align-items:center;gap:12px}.brandIcon{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;width:43px;transform:rotate(-7deg)}.brandIcon i{height:17px;background:#f2ba35;border-radius:5px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.13)}.brandIcon i:nth-child(2){background:#e65252}.brandIcon i:nth-child(3){background:#327acc}.brandIcon i:nth-child(4){background:#27a996}.smallcaps{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:850;color:#2a62a2}.brandName{font-size:19px;font-weight:850;letter-spacing:-.02em}.main{padding-bottom:40px}.hero{background:linear-gradient(115deg,#154e96,#2779b6);color:white;border-radius:21px;padding:21px 24px;display:flex;justify-content:space-between;gap:14px;align-items:center}.hero .smallcaps{color:#d4eaff}.hero p{color:#e5f1ff;font-size:15px;max-width:730px;margin:0}.heroArt{font-size:43px}.progress{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:17px 0}.progress b{font-size:12px;color:var(--muted);margin-right:4px}.dot{width:35px;height:35px;border:1px solid #ceddec;background:white;border-radius:11px;font-size:12px;font-weight:850;color:#58728e;display:grid;place-items:center}.dot.current{background:#e9f3ff;border-color:#2870c2;color:#1c5baa}.dot.done{background:#e2f6ed;border-color:#9cdec0;color:#15734f}.panel{background:#fff;border:1px solid #dce6f0;border-radius:23px;padding:clamp(18px,4vw,30px);box-shadow:var(--shadow)}.badge{display:inline-block;background:#edf6ff;color:#285c96;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:850}.sub{color:var(--muted);max-width:780px;margin-bottom:18px}.tip{background:#f1f7ff;border-left:4px solid #75a3d9;border-radius:10px;padding:12px 14px;margin:13px 0;color:#34516e;font-size:14px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.diagramPanel{background:#f7faff;border:1px solid #e0e9f3;border-radius:17px;padding:14px;text-align:center}.diagramPanel h3{margin-bottom:8px}.model{width:100%;max-width:360px;max-height:240px;display:block;margin:auto}.diagramPanel svg{max-width:100%;height:auto;display:block;margin:auto}.views{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.viewItem{border:1px solid #d8e5f3;background:#fff;border-radius:13px;padding:9px;text-align:center}.viewItem strong{display:block;font-size:13px;margin-bottom:5px}.viewItem small{font-size:11px;color:var(--muted)}.answerGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.answer{background:#fbfdff;border:2px solid #dfe8f2;border-radius:15px;padding:12px;min-height:120px;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-weight:700}.answer:hover{border-color:#83b0e2;background:#f2f7ff}.answer.selected{border-color:#2164b6;background:#eaf3ff}.answer .letter{align-self:flex-start;display:grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#e9f0f8;color:#245586;font-weight:900}.answer svg{width:100%;max-height:132px}.answer.textAns{min-height:108px;align-items:flex-start;text-align:left;font-size:14px}.feedback{padding:13px 15px;border-radius:12px;margin-top:16px;font-weight:650;line-height:1.4}.feedback.good{background:#eaf8f0;border-left:5px solid #189568;color:#126246}.feedback.bad{background:#fff7e9;border-left:5px solid #d99b43;color:#735017}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:19px}.btn{border:2px solid #1b59ae;border-radius:12px;background:#fff;color:#1b59ae;font-weight:850;padding:11px 18px}.btn.primary{background:#1b59ae;color:white}.btn.alt{border-color:#d3e0ed;color:#355d7e}.btn:hover:not(:disabled){filter:brightness(.96)}.controlWrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.buildGrid{width:min(100%,290px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px auto}.stack{border:2px solid #d5e2ed;border-radius:13px;aspect-ratio:1;background:#eef4fa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#335b7e;min-width:0;padding:4px}.stack[data-height="1"]{background:#d7eaff;border-color:#77a8e0}.stack[data-height="2"]{background:#c2dcfc;border-color:#337acb}.stack .shape{font-size:clamp(21px,4vw,31px);font-weight:900}.stack small{font-size:10px}.gridNote{display:flex;justify-content:space-between;gap:8px;text-align:center;color:#526a83;font-size:12px;font-weight:650}.targetCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.targetCards .viewItem{padding:8px}.reference{background:#f6faff;border:1px solid #dfeaf5;border-radius:15px;padding:12px;margin-bottom:15px}.reference .caption{font-size:12px;color:var(--muted);text-align:center}.steps{display:grid;gap:10px}.steps label{border:1px solid #dce6f1;background:#fbfdff;border-radius:12px;padding:12px;display:flex;gap:10px;align-items:start;font-weight:600}.steps input{width:22px;height:22px;flex:0 0 auto;accent-color:#247cbb;margin-top:2px}.complete{background:linear-gradient(125deg,#eafbf1,#f0f9ff);border:1px solid #b5e0ce;border-radius:23px;padding:clamp(22px,5vw,40px)}.complete .award{font-size:44px;margin-bottom:4px}.complete p{max-width:650px;color:#375e6b}.muted{color:var(--muted);font-size:13px}.exampleWrap{display:grid;grid-template-columns:250px 1fr;gap:15px;align-items:center}.legend{font-size:12px;color:#607c91;text-align:center;margin:3px 0 0}.orientation{display:grid;gap:8px;margin-top:10px;text-align:left}.orientation .tipRow{background:#fff;border:1px solid #d8e5f3;border-radius:12px;padding:8px 10px;font-size:13px;color:#35516b}.orientation b{color:#183a61}
@media(max-width:680px){.hero{padding:18px}.heroArt{display:none}.layout,.controlWrap,.exampleWrap{grid-template-columns:1fr}.model{max-height:205px}.views{grid-template-columns:repeat(3,minmax(0,1fr))}.answerGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.answer{padding:10px;min-height:108px}.answer.textAns{min-height:99px}.targetCards{grid-template-columns:repeat(3,minmax(0,1fr))}.viewItem strong{font-size:11px}.targetCards .viewItem{padding:5px}.gridNote{font-size:11px}}
@media(max-width:380px){.answerGrid{grid-template-columns:1fr 1fr;gap:8px}.panel{padding:15px}.targetCards{gap:4px}.hero h1{font-size:25px}}

<body>
<header class="top"><div class="wrap brand"><div class="brandIcon" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><div class="smallcaps">Интерактивный курс · 2 класс</div><div class="brandName">LEGO-Мастерская</div></div></div></header>
<main class="wrap main"><div class="hero"><div><div class="smallcaps">Урок 6 · Штаб архитектора</div><h1>Карта инспектора</h1><p>Ты научишься узнавать, как выглядит модель спереди, справа и сверху, а затем соберёшь её по чертежу.</p></div><div class="heroArt" aria-hidden="true">🏗️</div></div><div id="app" aria-live="off"></div></main>
<script>
'use strict';
// Каждая ячейка — вертикальный столбик из 0, 1 или 2 одинаковых кубиков.
// Первая строка сетки — задний ряд, последняя — передний.
const example=[[1,0,1],[2,1,0]];
const puzzle=[[1,1,0],[0,2,1]];
const S={step:0,selected:null,feedback:'',success:false,order:null,board:[[0,0,0],[0,0,0]],checks:new Set(),done:new Set()};
const $=sel=>document.querySelector(sel);
const taskNames=['Три взгляда','Спереди','Справа','Сверху','Собери по рисункам','Настоящая сборка'];
function rand(n){if(window.crypto&&crypto.getRandomValues){let a=new Uint32Array(1);crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*n)}return Math.floor(Math.random()*n)}
function shuffle(n){let a=Array.from({length:n},(_,i)=>i);for(let k=n-1;k>0;k--){let j=rand(k+1);[a[k],a[j]]=[a[j],a[k]]}return a}
function front(m){return m[0].map((_,x)=>Math.max(...m.map(r=>r[x])))}
function side(m){return [...m].reverse().map(r=>Math.max(...r))}
function topView(m){return m.map(r=>r.map(v=>v>0?1:0))}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function esc(s){return String(s).replace(/[&<>"']/g,v=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[v]))}
function cubeModel(m,look='both'){
 const w=40,d=16,h=31,ox=166,oy=65;
 let out=`<svg class="model" viewBox="0 0 340 248" role="img" aria-label="Объёмная LEGO-модель с указанием стороны, с которой нужно смотреть">`;
 for(let y=0;y<2;y++)for(let x=0;x<3;x++){let X=ox+(x-y)*w,Y=oy+(x+y)*d+38;
 out+=`<polygon points="${X},${Y} ${X+w},${Y+d} ${X},${Y+2*d} ${X-w},${Y+d}" fill="#f1f5fa" stroke="#d5e1eb" stroke-width="1.3"/>`;
 }
 let cubes=[];for(let y=0;y<2;y++)for(let x=0;x<3;x++)for(let z=0;z<m[y][x];z++)cubes.push({x,y,z});
 cubes.sort((a,b)=>(a.x+a.y+a.z)-(b.x+b.y+b.z)||a.z-b.z||a.y-b.y||a.x-b.x);
 for(const {x,y,z} of cubes){let X=ox+(x-y)*w,Y=oy+(x+y)*d-z*h;
 let a=`${X},${Y}`,b=`${X+w},${Y+d}`,c=`${X},${Y+2*d}`,d1=`${X-w},${Y+d}`;
 out+=`<polygon points="${d1} ${c} ${X},${Y+2*d+h} ${X-w},${Y+d+h}" fill="#2369bb" stroke="#1d548a" stroke-width="1.1"/>`;
 out+=`<polygon points="${b} ${c} ${X},${Y+2*d+h} ${X+w},${Y+d+h}" fill="#154d96" stroke="#1d477c" stroke-width="1.1"/>`;
 out+=`<polygon points="${a} ${b} ${c} ${d1}" fill="#66aaef" stroke="#2572bd" stroke-width="1.1"/>`;
 out+=`<ellipse cx="${X}" cy="${Y+d}" rx="8.5" ry="4.4" fill="#9ccbf7" stroke="#4e96dc" stroke-width="1"/>`;
 }
 if(look==='both'||look==='front'){
 out+=`<path d="M75 216 L115 187" stroke="#e69830" stroke-width="4"/><path d="M115 187 l-11 2 m11-2 l-5 10" stroke="#e69830" stroke-width="4" fill="none" stroke-linecap="round"/><text x="12" y="235" fill="#98611c" font-size="17" font-weight="850">СПЕРЕДИ</text>`;
 }
 if(look==='both'||look==='right'){
 out+=`<path d="M258 206 L222 169" stroke="#467d9e" stroke-width="4"/><path d="M222 169 l12 5 m-12-5 l4 12" stroke="#467d9e" stroke-width="4" fill="none" stroke-linecap="round"/><text x="239" y="227" fill="#416a83" font-size="17" font-weight="850">СПРАВА</text>`;
 }
 if(look==='top'){
 out+=`<path d="M165 12 L165 43" stroke="#7f5db9" stroke-width="4"/><path d="M165 43 l-9 -11 m9 11 l9 -11" stroke="#7f5db9" stroke-width="4" fill="none" stroke-linecap="round"/><text x="184" y="29" fill="#67509a" font-size="16" font-weight="850">СВЕРХУ</text>`;
 }
 out+='</svg>';return out;
}
function elevation(v){let max=Math.max(2,...v),cw=44,ch=36,margin=7,W=v.length*cw+2*margin,H=max*ch+2*margin;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Чертёж: высоты столбиков ${v.join(', ')}">`;
 for(let x=0;x<v.length;x++)for(let k=0;k<max;k++){let rx=margin+x*cw,ry=margin+(max-1-k)*ch;s+=`<rect x="${rx}" y="${ry}" width="${cw-3}" height="${ch-3}" rx="3" fill="${k<v[x]?'#3e82ce':'#edf2f8'}" stroke="${k<v[x]?'#2769b1':'#d7e2ed'}" stroke-width="1"/>`}
 return s+'</svg>'}
function plan(m){let r=m.length,c=m[0].length,cw=39,margin=7,W=c*cw+2*margin,H=r*cw+2*margin;let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Вид сверху, где цветные клетки означают занятые места">`;
 for(let y=0;y<r;y++)for(let x=0;x<c;x++){let used=m[y][x]>0;let rx=margin+x*cw,ry=margin+y*cw;s+=`<rect x="${rx}" y="${ry}" width="${cw-3}" height="${cw-3}" rx="4" fill="${used?'#3e82ce':'#edf2f8'}" stroke="${used?'#2769b1':'#d7e2ed'}"/>`;if(used)s+=`<circle cx="${rx+17.5}" cy="${ry+17.5}" r="5.6" fill="#9acaf5"/>`}
 return s+'</svg>'}
function views(m){return `<div class="views"><div class="viewItem"><strong>Спереди</strong>${elevation(front(m))}</div><div class="viewItem"><strong>Справа</strong>${elevation(side(m))}</div><div class="viewItem"><strong>Сверху</strong>${plan(m)}</div></div>`}
const missions=[
{kind:'choice',title:'Одна постройка — три взгляда',ask:'Зачем архитектору рисовать одну постройку с разных сторон?',visual:()=>`<div class="exampleWrap"><div class="diagramPanel"><h3>Наша модель</h3>${cubeModel(example)}<div class="orientation"><div class="tipRow"><b>Спереди</b> — встань у оранжевой стрелки.</div><div class="tipRow"><b>Справа</b> — встань у синей стрелки.</div><div class="tipRow"><b>Сверху</b> — посмотри прямо вниз на постройку.</div></div></div><div><p class="muted">Вот что увидишь, если смотреть на одну постройку с разных сторон:</p>${views(example)}</div></div>`,options:[{text:'Чтобы лучше узнать форму и расположение деталей',correct:true},{text:'Чтобы нарисовать модель тремя цветами',correct:false},{text:'Чтобы не считать кирпичики',correct:false}],hint:'Каждый рисунок помогает увидеть то, что не всегда заметно с другой стороны.',explain:'Правильно! Вместе три рисунка помогают понять, где находятся детали и какой они высоты.'},
{kind:'choice',title:'Что видно спереди?',ask:'Встань у оранжевой стрелки и посмотри на постройку спереди. Какой рисунок получится?',visual:()=>`<div class="diagramPanel"><h3>Модель</h3>${cubeModel(example,'front')}<p class="legend">Представь, что ты стоишь у оранжевой стрелки.</p></div>`,options:[{diagram:()=>elevation(front(example)),correct:true},{diagram:()=>elevation([2,2,1]),correct:false},{diagram:()=>elevation([1,1,2]),correct:false}],hint:'Представь, что стоишь перед постройкой. Сравни высоту трёх столбиков слева направо.',explain:'Верно! Спереди видны три столбика: первый высотой в два кубика, остальные — в один.'},
{kind:'choice',title:'Что видно справа?',ask:'Встань у синей стрелки и посмотри на постройку справа. Какой рисунок получится?',visual:()=>`<div class="diagramPanel"><h3>Модель</h3>${cubeModel(example,'right')}<p class="legend">Представь, что ты стоишь у синей стрелки.</p></div>`,options:[{diagram:()=>elevation(side(example)),correct:true},{diagram:()=>elevation([1,2]),correct:false},{diagram:()=>elevation([1,1]),correct:false}],hint:'Представь, что стоишь у синей стрелки. Ты видишь рядом две части постройки. Сравни их высоту.',explain:'Правильно! Если смотреть справа, слева будет высокая часть в два кубика, а справа — низкая в один кубик.'},
{kind:'choice',title:'Что видно сверху?',ask:'Представь, что смотришь на постройку сверху, как птица. На каком рисунке детали стоят на правильных местах?',visual:()=>`<div class="diagramPanel"><h3>Модель</h3>${cubeModel(example,'top')}<p class="legend">Смотри прямо вниз, будто летишь над постройкой.</p></div>`,options:[{diagram:()=>plan(topView(example)),correct:true},{diagram:()=>plan([[1,1,1],[1,0,0]]),correct:false},{diagram:()=>plan([[0,1,1],[1,1,0]]),correct:false}],hint:'Найди, где стоят кубики, а где пусто. Сверху высота столбиков не видна.',explain:'Молодец! Если смотреть сверху, видно, где стоят кубики, а где остались пустые места.'},
{kind:'builder',title:'Построй по трём рисункам',ask:'Перед тобой рисунки одной постройки: спереди, справа и сверху. Нажимай на клетки, чтобы поставить 1 или 2 кубика. Сделай такую же постройку.',hint:'Сначала посмотри сверху: где должны стоять кубики? Потом проверь, какой высоты они должны быть, если смотреть спереди и справа.'},
{kind:'project',title:'Настоящая сборка',ask:'Теперь возьми настоящие детали конструктора и бумагу в клетку. Построй модель по Карте инспектора и нарисуй её три вида.',steps:['Я рассмотрел три чертежа Карты инспектора.','Я собрал модель из настоящих деталей.','Я нарисовал постройку спереди, справа и сверху.','Я сравнил готовую модель с тремя чертежами и показал её учителю.']}
];
function progress(){return `<div class="progress"><b>Твои шаги</b>${missions.map((_,i)=>`<span class="dot ${i===S.step?'current':S.done.has(i)?'done':''}">${S.done.has(i)?'✓':i+1}</span>`).join('')}</div>`}
function taskContent(t){if(t.kind==='choice'){
 if(!S.order)S.order=shuffle(t.options.length);
 return `${t.visual()}<div style="height:16px"></div><div class="answerGrid">${S.order.map((ix,p)=>{const o=t.options[ix];return `<button type="button" class="answer ${S.selected===ix?'selected':''} ${o.text?'textAns':''}" data-choice="${ix}" aria-pressed="${S.selected===ix}"><span class="letter">${'АБВГ'[p]}</span>${o.text?`<span>${esc(o.text)}</span>`:o.diagram()}</button>`}).join('')}</div>`;
 }if(t.kind==='builder')return builderContent();if(t.kind==='project')return projectContent();return ''}
function builderContent(){const m=S.board;return `<div class="reference"><h3>Карта инспектора</h3><p class="muted">Это три рисунка одной постройки. Сначала посмотри сверху: где стоят кубики? Потом сравни их высоту спереди и справа. Один синий квадрат — один кубик.</p>${views(puzzle)}</div><div class="controlWrap"><div class="diagramPanel"><h3>Твоя площадка</h3><div class="gridNote"><span></span><span>ЗАДНИЙ РЯД</span><span></span></div><div class="buildGrid">${m.flatMap((row,y)=>row.map((v,x)=>`<button type="button" class="stack" data-y="${y}" data-x="${x}" data-height="${v}" aria-label="${y?'Передний':'Задний'} ряд, место ${x+1}, ${v} кубиков"><span class="shape">${v||'＋'}</span><small>${v===0?'Пусто':v===1?'1 кубик':'2 кубика'}</small></button>`)).join('')}</div><div class="gridNote"><span></span><span>ПЕРЕДНИЙ РЯД</span><span></span></div><p class="legend">Нажимай на клетку, чтобы изменить высоту.</p><button class="btn alt" type="button" id="clearGrid" style="margin-top:12px">Очистить площадку</button></div><div class="diagramPanel"><h3>Твоя модель</h3>${cubeModel(m)}<div class="targetCards"><div class="viewItem"><strong>Спереди</strong>${elevation(front(m))}</div><div class="viewItem"><strong>Справа</strong>${elevation(side(m))}</div><div class="viewItem"><strong>Сверху</strong>${plan(m)}</div></div><p class="legend">Сравни чертежи своей модели с Картой инспектора.</p></div></div>`}
function projectContent(){return `<div class="reference"><h3>Карта для настоящей сборки</h3>${views(puzzle)}</div><div class="layout"><div class="diagramPanel"><h3>Как действовать</h3><p style="text-align:left">1. Сначала посмотри сверху и найди места для деталей.</p><p style="text-align:left">2. Затем посмотри на рисунки спереди и справа и подбери высоту.</p><p style="text-align:left">3. Нарисуй свою постройку спереди, справа и сверху.</p><p style="text-align:left;margin-bottom:0">4. Покажи свою конструкцию учителю.</p></div><div><h3>Моя проверка</h3><div class="steps">${missions[5].steps.map((s,i)=>`<label><input type="checkbox" data-checked="${i}" ${S.checks.has(i)?'checked':''}><span>${esc(s)}</span></label>`).join('')}</div><p class="muted" style="margin:12px 0 0">Отмечай только то, что действительно выполнил.</p></div></div>`}
function actionButtons(){if(S.success)return `<div class="actions"><button class="btn primary" id="next">${S.step===5?'Завершить урок →':'Следующее задание →'}</button></div>`;if(S.step===5)return `<div class="actions"><button class="btn primary" id="checkProject" ${S.checks.size===4?'':'disabled'}>Я выполнил практику ✓</button></div>`;return `<div class="actions"><button class="btn primary" id="check">Проверить ответ</button>${S.step===4?'<button class="btn alt" id="hint">Подсказка</button>':''}</div>`}
function render(){const t=missions[S.step];$('#app').innerHTML=`${progress()}<section class="panel"><span class="badge">Испытание ${S.step+1} из ${missions.length}</span><h2>${esc(t.title)}</h2><p class="sub">${esc(t.ask)}</p>${taskContent(t)}${actionButtons()}${S.feedback?`<div class="feedback ${S.success?'good':'bad'}" role="status">${esc(S.feedback)}</div>`:''}</section>`;
 document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{S.selected=Number(el.dataset.choice);S.feedback='';S.success=false;S.done.delete(S.step);render()}));
 document.querySelectorAll('[data-y]').forEach(el=>el.addEventListener('click',()=>{const y=Number(el.dataset.y),x=Number(el.dataset.x);S.board[y][x]=(S.board[y][x]+1)%3;S.feedback='';S.success=false;S.done.delete(S.step);render()}));
 document.querySelectorAll('[data-checked]').forEach(el=>el.addEventListener('change',()=>{const i=Number(el.dataset.checked);el.checked?S.checks.add(i):S.checks.delete(i);S.feedback='';S.success=false;S.done.delete(S.step);render()}));
 const chk=$('#check');if(chk)chk.addEventListener('click',validate);
 const pr=$('#checkProject');if(pr)pr.addEventListener('click',()=>{if(S.checks.size===4){S.success=true;S.done.add(S.step);S.feedback='Ты отметил все шаги. Покажи учителю настоящую модель и свои рисунки.';render()}});
 const nx=$('#next');if(nx)nx.addEventListener('click',next);
 const clear=$('#clearGrid');if(clear)clear.addEventListener('click',()=>{S.board=[[0,0,0],[0,0,0]];S.feedback='';S.success=false;S.done.delete(S.step);render()});
 const hint=$('#hint');if(hint)hint.addEventListener('click',()=>{S.feedback=t.hint;render()});
}
function validate(){const t=missions[S.step];let correct=false,message='';if(t.kind==='choice'){
 correct=S.selected!==null&&t.options[S.selected].correct;
 message=correct?t.explain:S.selected===null?'Сначала выбери один рисунок или вариант ответа.':t.hint;
 }else if(t.kind==='builder'){
 const topOK=same(topView(S.board),topView(puzzle)),frontOK=same(front(S.board),front(puzzle)),sideOK=same(side(S.board),side(puzzle));
 correct=topOK&&frontOK&&sideOK;
 if(correct)message='Ты прочитал Карту инспектора! Все три рисунка совпадают. У такой конструкции может быть несколько правильных вариантов сборки.';
 else{let parts=[];if(!topOK)parts.push('расположение деталей сверху');if(!frontOK)parts.push('высоты спереди');if(!sideOK)parts.push('высоты справа');message='Проверь '+parts.join(', ')+'. Попробуй исправить модель.'}
 }
 S.success=correct;S.feedback=message;if(correct)S.done.add(S.step);render();
}
function next(){if(S.step===missions.length-1){complete();return}S.step++;S.selected=null;S.order=null;S.success=false;S.feedback='';render();window.scrollTo({top:0,behavior:'smooth'})}
function complete(){$('#app').innerHTML=`<div class="complete" style="margin-top:23px"><div class="award">🏆</div><div class="smallcaps">Миссия завершена</div><h2>Отличная работа, LEGO-архитектор!</h2><p>Ты научился рассматривать постройку с разных сторон и понимать чертежи. Покажи свою модель и чертежи учителю!</p><div class="actions"><button class="btn primary" id="again">Пройти урок ещё раз ↻</button></div></div>`;$('#again').addEventListener('click',()=>{S.step=0;S.selected=null;S.order=null;S.success=false;S.feedback='';S.board=[[0,0,0],[0,0,0]];S.checks=new Set();S.done=new Set();render();window.scrollTo({top:0,behavior:'smooth'})})}
render();
</script>
</body>
</html>
