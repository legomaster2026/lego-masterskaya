<style>
:root{--ink:#162b43;--navy:#11335d;--blue:#1b59b1;--blue2:#2b79c9;--light:#eaf3ff;--muted:#5b718a;--line:#dce7f2;--green:#0a876c;--orange:#f0a83d;--bg:#f4f7fc;--shadow:0 15px 30px rgba(38,76,122,.065)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{font:16px/1.48 system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:radial-gradient(ellipse at 2% 4%,#e1efff 0,transparent 37%),radial-gradient(ellipse at 98% 5%,#fff1d6 0,transparent 40%),var(--bg);color:var(--ink);margin:0;min-height:100vh}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible{outline:3px solid #f2a83d;outline-offset:3px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(25px,5vw,34px);line-height:1.17;margin:5px 0 10px;letter-spacing:-.025em}h2{font-size:clamp(21px,4.5vw,28px);line-height:1.2;margin:8px 0 9px;letter-spacing:-.015em}h3{font-size:16px;margin:0 0 10px}.container{width:min(980px,calc(100% - 28px));margin:auto}.top{padding:20px 0}.brand{display:flex;align-items:center;gap:12px}.logo{width:43px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;transform:rotate(-7deg)}.logo i{height:17px;border-radius:5px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.13);background:#e8b12f}.logo i:nth-child(2){background:#e45055}.logo i:nth-child(3){background:#3178c5}.logo i:nth-child(4){background:#2aa393}.smallcap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:850;color:#2a61a0}.brandtitle{font-size:19px;line-height:1.1;font-weight:850}.hero{background:linear-gradient(112deg,#164c93 5%,#287ebc 95%);border-radius:21px;padding:21px 24px;display:flex;justify-content:space-between;gap:10px;color:white}.hero .smallcap{color:#d5eaff}.hero p{margin:0;color:#e9f2ff;max-width:720px}.heroArt{font-size:47px;align-self:center}.stepper{display:flex;gap:7px;align-items:center;margin:16px 0;flex-wrap:wrap}.stepper span{font-size:12px;font-weight:800;color:#57718d;margin-right:4px}.stepCircle{display:grid;place-items:center;border:1px solid #d1e1ef;background:#fff;border-radius:10px;color:#67809c;font-size:12px;font-weight:850;width:33px;height:33px}.stepCircle.current{border-color:#2778c4;background:#e6f2ff;color:#1b5eaf}.stepCircle.done{border-color:#9fd6c5;background:#e6f7ec;color:#0b7657}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:clamp(17px,4vw,29px);box-shadow:var(--shadow);margin-bottom:26px}.pill{display:inline-block;padding:5px 11px;background:#eef6ff;color:#245b98;font-size:12px;font-weight:850;border-radius:99px}.sub{color:var(--muted);font-size:15px;max-width:810px;margin-bottom:18px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.box{border:1px solid #e0e9f3;background:#f8fbff;border-radius:17px;padding:clamp(12px,3vw,18px)}.box.white{background:white}.box h3{text-align:center}.center{text-align:center}.muted{color:var(--muted);font-size:13px}.bold{font-weight:800}.visual{width:100%;max-width:370px;display:block;margin:0 auto}.legend{color:#51718b;font-size:12px;margin:9px 0 0;text-align:center}.miniInfo{font-weight:750;font-size:14px;text-align:center;color:#23548a;margin:10px 0 2px}.controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:10px}.counter{min-width:61px;text-align:center;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:#194e8b}.squareBtn{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #bfcee3;background:#fff;color:#174d90;font-size:24px;font-weight:850;display:grid;place-items:center}.squareBtn:hover{background:#eaf4ff}.btn{border:2px solid #d4e2f0;background:#fff;border-radius:12px;padding:11px 18px;font-weight:850;color:#315f8f;min-height:47px}.btn.primary{background:#1a58ae;color:#fff;border-color:#1a58ae}.btn:hover:not(:disabled){filter:brightness(.96)}.btn.small{padding:8px 12px;min-height:42px;font-size:14px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.answerGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}.ans{border:2px solid #dce6f1;border-radius:15px;background:#fbfdff;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:11px}.ans:hover{border-color:#96b8e5}.ans.selected{border-color:#2469bd;background:#e7f2ff}.ans .letter{align-self:flex-start;background:#e9f1f9;color:#245689;padding:5px 10px;border-radius:9px;font-size:13px;font-weight:850}.ans svg{width:100%;max-height:155px}.ans .optionText{font-weight:850;font-size:14px}.feedback{margin-top:16px;padding:13px 15px;border-left:5px solid #dca350;border-radius:12px;background:#fff7e9;color:#72501d;font-weight:700}.feedback.good{background:#eaf9f0;border-left-color:#18a071;color:#166448}.bar{display:flex;gap:3px;margin:15px auto;width:min(100%,600px)}.barpart{flex:1;min-width:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;border-radius:9px;padding:5px;border:2px dashed #b9c8d9;background:#eef3f9;transition:.2s}.barpart.active{border:2px solid #2d79c3;background:#d7eaff}.stud{width:100%;aspect-ratio:1;border-radius:50%;background:#c9d7e6;box-shadow:inset 0 -2px 0 rgba(0,0,0,.07)}.barpart.active .stud{background:#3c86d5;box-shadow:inset 0 -2px 0 #2468b5}.bridgeCanvas{display:flex;align-items:center;justify-content:flex-start;gap:3px;min-height:64px;padding:9px 3px 11px;margin:15px auto 0;border-bottom:4px solid #c7d6e6;border-radius:10px;width:100%;}.bridgeCanvas .barpart{flex:1 1 0;min-width:0;}.bridgeCanvas.empty{justify-content:center;background:#eef3f9;border:1px solid #dee8f2;border-bottom:4px solid #c7d6e6;}.bridgeCanvas .emptyText{font-size:13px;color:#58708b;text-align:center;padding:8px;}.bridgeCanvas .barpart .stud{min-width:0;}.measureBtns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0}.countChoices{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:13px}.countChoice{border:2px solid #d7e4f2;border-radius:12px;background:#fff;color:#1b558c;padding:12px 20px;font-weight:850}.countChoice.selected{background:#e6f3ff;border-color:#2677c8}.codeTip{background:#ecf7ff;border-radius:12px;padding:12px 13px;color:#275e89;margin:15px 0;font-size:14px;font-weight:650}.compare{display:flex;gap:13px;align-items:center;justify-content:center;flex-wrap:wrap}.compare .box{flex:1 1 190px;max-width:380px}.compareArrow{font-size:30px;color:#346fa9;font-weight:900}.progressLine{display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;font-weight:750;color:#2a668f;margin:9px 0}.builders{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1.2fr);gap:15px;align-items:start}.studBoard{margin:12px auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,320px);gap:7px}.buildTile{border:2px solid #d1e1ef;background:#ecf2f8;border-radius:12px;aspect-ratio:1;padding:6px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px;align-content:center;justify-content:center;touch-action:manipulation}.buildTile.active{background:#c5e1ff;border-color:#2e73bb}.buildTile .stud{background:#d1dce7}.buildTile.active .stud{background:#387eca}.buildTile.hint{border-color:#eba334;box-shadow:0 0 0 3px #fdf1d2}.buildTile.different{border-color:#d36452;box-shadow:0 0 0 2px #ffe1dc}.originalGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,215px);gap:7px;margin:14px auto}.originalTile{aspect-ratio:1;background:#eaf0f5;border-radius:11px;display:grid;place-items:center;border:2px solid #dae5ee}.originalTile.active{background:#3480d0;border-color:#2666a8}.originalTile span{border-radius:50%;background:#bed0e0;width:43%;aspect-ratio:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.1)}.originalTile.active span{background:#80b5f0}.steps{display:grid;gap:10px;margin-top:14px}.stepCheck{border:1px solid #dde8f2;background:#fafdff;border-radius:12px;padding:13px;display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:650}.stepCheck input{width:22px;height:22px;accent-color:#2671b9;flex:none;margin-top:1px}.end{background:linear-gradient(120deg,#e9faf1,#eff7ff);border:1px solid #b8dcca;padding:clamp(20px,5vw,38px);border-radius:23px;margin-top:19px}.award{font-size:43px}.bottom{padding-bottom:30px}.finishNote{font-size:13px;color:#4c6b7f}svg text{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
@media(max-width:700px){.hero{padding:18px}.heroArt{display:none}.two,.builders{grid-template-columns:1fr}.answerGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.compareArrow{transform:rotate(90deg)}.barpart{gap:2px;padding:4px}.studBoard{width:min(100%,310px)}.stepCircle{height:31px;width:31px}.box{padding:13px}.visual{max-width:330px}}
@media(max-width:380px){.container{width:calc(100% - 20px)}.card{padding:15px}.answerGrid{gap:8px}.ans{padding:8px}.stepper{gap:4px}.stepCircle{height:29px;width:29px}.studBoard{gap:5px}.buildTile{padding:4px;gap:3px}.buttons .btn{flex:1 1 180px}}
</style>
</head>
<body>
<header class="top"><div class="container brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><div class="smallcap">Интерактивный курс · 2 класс</div><div class="brandtitle">LEGO-Мастерская</div></div></div></header>
<main class="container bottom"><section class="hero"><div><div class="smallcap">Урок 7 · В гостях у Гигантского скульптора</div><h1>Секретный код масштаба</h1><p>Ты будешь измерять постройки LEGO-линейкой, увеличивать модели и создавать их точные копии.</p></div><div class="heroArt" aria-hidden="true">📏</div></section><div id="app" aria-live="polite"></div></main>
<script>
'use strict';
const missions=[
 {title:'Измерь с помощью LEGO-линейки',subtitle:'Длина синей дорожки — 12 шипов. Наша LEGO-линейка имеет длину 4 шипа. Сколько таких линеек поместится вдоль дорожки?'},
 {title:'Увеличь модель вдвое',subtitle:'Главный скульптор показывает рисунок размером 3 клетки в длину и 2 клетки в высоту. Измени оба размера, чтобы получился рисунок в 2 раза больше.'},
 {title:'Найди точную увеличенную копию',subtitle:'Оригинал — 2 клетки в ширину и 3 клетки в высоту. Какая из трёх моделей увеличена в 2 раза без изменения формы?'},
 {title:'Построй длинный мост',subtitle:'Маленький мост состоит из 2 деталей. Сделай мост в 2 раза длиннее. Добавляй детали по одной и проверь свою постройку.'},
 {title:'Построй большую букву Г',subtitle:'Это твоя виртуальная строительная площадка. Слева — маленькая модель. Справа построй её увеличенную копию. Каждый квадратик маленькой модели превратится в квадрат 2 × 2.'},
 {title:'Мастерская настоящих построек',subtitle:'Теперь возьми LEGO и попробуй построить увеличенную модель своими руками. Проверь себя по шагам.'}
];
function rand(n){if(window.crypto&&window.crypto.getRandomValues){const a=new Uint32Array(1);window.crypto.getRandomValues(a);return Math.floor(a[0]/4294967296*n)}return Math.floor(Math.random()*n)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const targetPattern=[1,0,0,1,0,0,1,1,1];
const cards=shuffle([{w:4,h:6,correct:true},{w:4,h:3,correct:false},{w:2,h:6,correct:false}]);
const measureOptions=shuffle([2,3,4]);
const state={step:0,measures:0,measureAnswer:null,length:3,height:2,card:null,bridge:0,pattern:Array(9).fill(false),checks:new Set(),success:false,feedback:'',hint:false,done:new Set()};
const $=s=>document.querySelector(s);
function rectSvg(w,h,color='#347ed0',maxWidth=240,maxHeight=175){const unit=Math.min(31,(maxWidth-34)/w,(maxHeight-34)/h),W=Math.ceil(w*unit+25),H=Math.ceil(h*unit+25);let t=`<svg class="visual" viewBox="0 0 ${W} ${H}" role="img" aria-label="Прямоугольник шириной ${w} и высотой ${h} клеток">`;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let X=13+x*unit,Y=13+y*unit;t+=`<rect x="${X}" y="${Y}" width="${unit-1.5}" height="${unit-1.5}" rx="${Math.min(5,unit/5)}" fill="${color}" stroke="#2563a2" stroke-width=".8"/><circle cx="${X+unit/2-1}" cy="${Y+unit/2-1}" r="${Math.max(2.8,unit*.18)}" fill="#83b8f1"/>`}return t+'</svg>'}
function scaledPatternSvg(pattern,scale){const rows=3,cols=3,cell=scale===1?34:17;let out=`<svg class="visual" viewBox="0 0 ${cols*scale*cell+14} ${rows*scale*cell+14}" role="img" aria-label="Схема постройки">`;for(let y=0;y<3*scale;y++)for(let x=0;x<3*scale;x++){let on=pattern[Math.floor(y/scale)*3+Math.floor(x/scale)];const X=x*cell+7,Y=y*cell+7;out+=`<rect x="${X}" y="${Y}" width="${cell-2}" height="${cell-2}" rx="${scale===1?5:3}" fill="${on?'#387fcd':'#e6edf5'}" stroke="${on?'#2766a8':'#d3e1ee'}"/>`;if(on)out+=`<circle cx="${X+(cell-2)/2}" cy="${Y+(cell-2)/2}" r="${cell*.16}" fill="#82b6ee"/>`}return out+'</svg>'}
function progress(){return `<div class="stepper"><span>Твои шаги</span>${missions.map((_,i)=>`<span class="stepCircle ${i===state.step?'current':state.done.has(i)?'done':''}" aria-label="Задание ${i+1}">${state.done.has(i)?'✓':i+1}</span>`).join('')}</div>`}
function measureView(){return `<div class="box"><h3>Синяя дорожка</h3><div class="miniInfo">12 шипов</div><div class="bar">${Array.from({length:3},(_,i)=>`<div class="barpart ${i<state.measures?'active':''}">${'<i class="stud"></i>'.repeat(4)}</div>`).join('')}</div><div class="center muted">Цветные группы показывают, сколько LEGO-линеек уже приложено.</div><div class="measureBtns"><button type="button" class="btn small" data-act="add-measure" ${state.measures===3?'disabled':''}>Приложить линейку +</button><button type="button" class="btn small" data-act="remove-measure" ${state.measures===0?'disabled':''}>Убрать одну −</button></div><p class="miniInfo">Приложено линеек: ${state.measures}</p><div class="countChoices">${measureOptions.map(n=>`<button type="button" data-act="choose-measure" data-n="${n}" class="countChoice ${state.measureAnswer===n?'selected':''}">${n}</button>`).join('')}</div><p class="legend">Можешь приложить линейку к дорожке, чтобы проверить себя. Затем выбери ответ.</p></div>`}
function dimensionView(){return `<div class="two"><div class="box"><h3>Маленькая модель</h3>${rectSvg(3,2)}<p class="miniInfo">Длина 3 · Высота 2</p></div><div class="box"><h3>Твоя большая модель</h3>${rectSvg(state.length,state.height,'#28a3a0',250,180)}<div class="two" style="gap:9px;margin-top:8px"><div><p class="miniInfo">Длина</p><div class="controls"><button class="squareBtn" data-act="dec-length" aria-label="Уменьшить длину">−</button><span class="counter">${state.length}</span><button class="squareBtn" data-act="inc-length" aria-label="Увеличить длину">+</button></div></div><div><p class="miniInfo">Высота</p><div class="controls"><button class="squareBtn" data-act="dec-height" aria-label="Уменьшить высоту">−</button><span class="counter">${state.height}</span><button class="squareBtn" data-act="inc-height" aria-label="Увеличить высоту">+</button></div></div></div></div></div><p class="codeTip">Секрет кода ×2: умножь на 2 и длину, и высоту. Только так форма останется прежней.</p>`}
function choiceView(){return `<div class="compare"><div class="box" style="max-width:230px"><h3>Маленькая модель</h3>${rectSvg(2,3,'#e6a037',145,154)}</div><span class="compareArrow">→</span><div class="box" style="max-width:230px"><h3>Во сколько раз?</h3><p class="center" style="font-size:28px;font-weight:900;color:#215ca2;margin:8px">×2</p><p class="muted center">Обе стороны становятся в 2 раза больше.</p></div></div><div class="answerGrid">${cards.map((o,i)=>`<button class="ans ${state.card===i?'selected':''}" data-act="choose-card" data-n="${i}" aria-pressed="${state.card===i}"><span class="letter">${'АБВ'[i]}</span>${rectSvg(o.w,o.h,'#308b8a',170,144)}<span class="optionText">${o.w} × ${o.h}</span></button>`).join('')}</div>`}
function bridgeView(){
 const units=state.bridge;
 const bricks=Array.from({length:units},()=>`<div class="barpart active" aria-hidden="true">${'<i class="stud"></i>'.repeat(4)}</div>`).join('');
 const countWord=units===1?'деталь':units>=2&&units<=4?'детали':'деталей';
 return `<div class="two">
 <div class="box"><h3>Маленький мост</h3>
 <div class="bar">${Array.from({length:2},()=>'<div class="barpart active">'+'<i class="stud"></i>'.repeat(4)+'</div>').join('')}</div>
 <p class="miniInfo">2 детали</p><p class="legend">Каждая деталь — длиной 4 шипа.</p></div>
 <div class="box"><h3>Твой новый мост</h3>
 <div class="bridgeCanvas ${units===0?'empty':''}" aria-label="Построено деталей: ${units}">${units===0?'<span class="emptyText">Здесь появится твой мост</span>':bricks}</div>
 <p class="miniInfo">${units===0?'Пока нет деталей':`Построено: ${units} ${countWord}`}</p>
 <div class="measureBtns"><button class="btn small" data-act="bridge-add" ${units>=6?'disabled':''}>Добавить деталь +</button><button class="btn small" data-act="bridge-remove" ${units<=0?'disabled':''}>Убрать деталь −</button></div></div></div>
 <p class="codeTip center">Построй мост, который будет в 2 раза длиннее маленького. Когда закончишь, нажми «Проверить».</p>`;
}
function originalGrid(){return `<div class="originalGrid">${targetPattern.map(t=>`<span class="originalTile ${t?'active':''}"><span></span></span>`).join('')}</div>`}
function builderView(){return `<div class="builders"><div class="box"><h3>Маленькая буква Г</h3>${originalGrid()}<p class="miniInfo">3 × 3 клетки</p><p class="legend">Синие клетки показывают форму.</p></div><div class="box"><h3>Твоя большая буква Г</h3><div class="studBoard">${state.pattern.map((t,i)=>`<button type="button" class="buildTile ${t?'active':''} ${state.hint&&!state.success&&targetPattern[i]!==Number(t)?'different':''}" data-act="tile" data-n="${i}" aria-pressed="${t}" aria-label="Место ${i+1}, ${t?'заполнено':'пусто'}">${'<span class="stud"></span>'.repeat(4)}</button>`).join('')}</div><p class="miniInfo">6 × 6 маленьких клеток</p><p class="legend">Нажимай на квадраты, чтобы ставить или убирать детали.</p><div class="measureBtns"><button type="button" class="btn small" data-act="reset-tiles">Очистить модель</button><button type="button" class="btn small" data-act="hint-tiles">${state.hint?'Скрыть подсказку':'Подсказка'}</button></div></div></div><div class="codeTip">Каждая клетка маленькой модели превращается в квадрат из четырёх клеток. Цветная форма должна остаться такой же.</div>`}
function projectView(){const items=['Я выбрал небольшую модель из настоящих деталей LEGO.','Я измерил её длину и ширину, считая шипы.','Я рассчитал: сколько шипов будет в 2 раза большей модели.','Я собрал большую копию и сравнил её с маленькой.','Я показал свою постройку и объяснил её размеры учителю.'];return `<div class="two"><div class="box"><h3>План скульптора</h3><p><strong>1.</strong> Измерь маленькую модель.</p><p><strong>2.</strong> Увеличь длину и ширину в 2 раза.</p><p><strong>3.</strong> Построй копию из настоящих деталей.</p><p style="margin:0"><strong>4.</strong> Проверь, сохранилась ли форма.</p><div class="codeTip">Например, основание 2 × 4 шипа превратится в основание 4 × 8 шипов.</div></div><div class="box"><h3>Проверь свои действия</h3><div class="steps">${items.map((s,i)=>`<label class="stepCheck"><input type="checkbox" data-act="check-step" data-n="${i}" ${state.checks.has(i)?'checked':''}><span>${s}</span></label>`).join('')}</div></div></div><p class="finishNote">У настоящей постройки устойчивость и точность проверяйте вместе с учителем.</p>`}
function taskHtml(){switch(state.step){case 0:return measureView();case 1:return dimensionView();case 2:return choiceView();case 3:return bridgeView();case 4:return builderView();default:return projectView()}}
function buttons(){if(state.success)return `<div class="buttons"><button class="btn primary" data-act="next">${state.step===5?'Завершить урок':'Следующее задание →'}</button></div>`;return `<div class="buttons"><button type="button" class="btn primary" data-act="check">${state.step===5?'Я выполнил работу ✓':'Проверить'}</button></div>`}
function render(){let t=missions[state.step];$('#app').innerHTML=progress()+`<section class="card"><span class="pill">Задание ${state.step+1} из ${missions.length}</span><h2>${t.title}</h2><p class="sub">${t.subtitle}</p>${taskHtml()}${buttons()}${state.feedback?`<div class="feedback ${state.success?'good':''}" role="status">${state.feedback}</div>`:''}</section>`}
function change(fn){fn();state.feedback='';state.success=false;state.hint=false;state.done.delete(state.step);render()}
function check(){let ok=false,m='';switch(state.step){case 0:ok=state.measureAnswer===3;if(ok)state.measures=3;m=state.measureAnswer===null?'Выбери, сколько LEGO-линеек поместится вдоль дорожки.':ok?'Верно! 12 шипов — это 3 линейки по 4 шипа.':'Попробуй разделить 12 шипов на группы по 4. Сколько групп получилось?';break;case 1:ok=state.length===6&&state.height===4;m=ok?'Точно! 3 × 2 = 6, а 2 × 2 = 4. Обе стороны выросли вдвое.':'Проверь обе стороны: длина 3 должна стать вдвое больше, и высота 2 тоже.';break;case 2:ok=state.card!==null&&cards[state.card].correct;m=state.card===null?'Выбери один рисунок.':ok?'Верно! 2 клетки превратились в 4, а 3 — в 6. Форма сохранилась.':'Посмотри, увеличились ли вдвое и ширина, и высота. Одной стороны недостаточно.';break;case 3:ok=state.bridge===4;m=ok?'Мост построен! Было 2 детали, стало 4. Новый мост вдвое длиннее.':'Сравни длину маленького моста и своего. Твой должен быть ровно вдвое длиннее.';break;case 4:ok=state.pattern.every((v,i)=>Number(v)===targetPattern[i]);m=ok?'Получилось! Ты увеличил букву Г в 2 раза и сохранил её форму.':'Пока не совпало. Сравни синие части маленькой модели и своей большой. Подсказка покажет места для проверки.';state.hint=!ok;break;case 5:ok=state.checks.size===5;m=ok?'Прекрасно! Ты прошёл все шаги. Покажи учителю обе модели и расскажи, как проверял размеры.':'Отмечай только те шаги, которые ты уже выполнил.';break}
state.success=ok;state.feedback=m;if(ok)state.done.add(state.step);render()}
function finish(){$('#app').innerHTML=`<section class="end"><div class="award">🏆</div><div class="smallcap">Миссия завершена</div><h2>Отличная работа, LEGO-скульптор!</h2><p>Ты научился измерять постройки и делать их больше, сохраняя форму. Расскажи, какую модель тебе было интереснее всего увеличивать!</p><div class="buttons"><button class="btn primary" data-act="again">Пройти урок ещё раз ↻</button></div></section>`;window.scrollTo({top:0,behavior:'smooth'})}
function next(){if(state.step===5){finish();return}state.step++;state.success=false;state.feedback='';state.hint=false;render();window.scrollTo({top:0,behavior:'smooth'})}
function reset(){state.step=0;state.measures=0;state.measureAnswer=null;state.length=3;state.height=2;state.card=null;state.bridge=0;state.pattern=Array(9).fill(false);state.checks=new Set();state.success=false;state.feedback='';state.hint=false;state.done=new Set();render();window.scrollTo({top:0,behavior:'smooth'})}
$('#app').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,n=Number(el.dataset.n);if(act==='next')return next();if(act==='again')return reset();if(act==='check')return check();if(act==='hint-tiles'){state.hint=!state.hint;state.feedback='';render();return}if(act==='reset-tiles')return change(()=>{state.pattern=Array(9).fill(false)});if(act==='check-step')return;const actions={'add-measure':()=>state.measures=Math.min(3,state.measures+1),'remove-measure':()=>state.measures=Math.max(0,state.measures-1),'choose-measure':()=>state.measureAnswer=n,'inc-length':()=>state.length=Math.min(9,state.length+1),'dec-length':()=>state.length=Math.max(1,state.length-1),'inc-height':()=>state.height=Math.min(7,state.height+1),'dec-height':()=>state.height=Math.max(1,state.height-1),'choose-card':()=>state.card=n,'bridge-add':()=>state.bridge=Math.min(6,state.bridge+1),'bridge-remove':()=>state.bridge=Math.max(0,state.bridge-1),'tile':()=>state.pattern[n]=!state.pattern[n]};if(actions[act])change(actions[act]);});
$('#app').addEventListener('change',e=>{const el=e.target.closest('[data-act="check-step"]');if(!el)return;const n=Number(el.dataset.n);el.checked?state.checks.add(n):state.checks.delete(n);state.feedback='';state.success=false;state.done.delete(state.step);render()});
render();
</script>
</body></html>
