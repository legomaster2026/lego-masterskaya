
name: Автоматическое обновление уроков

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/workflows/auto-lessons.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lessons:
    runs-on: ubuntu-latest

    steps:
      - name: Получить файлы сайта
        uses: actions/checkout@v4

      - name: Создать список уроков
        shell: python
        run: |
          import json
          import pathlib
          import re

          root = pathlib.Path(".")
          lessons = []

          for file in root.glob("*.html"):
              if file.name == "index.html":
                  continue

              match = re.match(
                  r"^(\d+)(?:\s*-\s*(\d+))?\s+урок",
                  file.name,
                  re.IGNORECASE
              )

              if not match:
                  continue

              start = int(match.group(1))
              end = int(match.group(2) or start)

              lessons.append({
                  "start": start,
                  "end": end,
                  "file": file.name
              })

          lessons.sort(key=lambda x: x["start"])

          pathlib.Path("lessons.json").write_text(
              json.dumps(lessons, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

      - name: Сохранить список
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lessons.json
          if ! git diff --cached --quiet; then
            git commit -m "Обновить список уроков"
            git push
          fi
