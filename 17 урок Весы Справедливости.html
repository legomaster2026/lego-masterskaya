*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top left,#dfedff 0,transparent 38%),radial-gradient(ellipse at top right,#fff0d5 0,transparent 40%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1586da;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,5vw,38px);line-height:1.12;margin:5px 0 9px}h2{font-size:clamp(22px,4vw,28px);line-height:1.23;margin:9px 0 12px}h3{font-size:17px;margin:0 0 10px}.wrap{width:min(1020px,calc(100% - 26px));margin:auto}.brand{display:flex;gap:11px;align-items:center;padding:18px 0}.logo{display:grid;grid-template-columns:repeat(2,20px);gap:3px;transform:rotate(-8deg)}.logo span{height:18px;border-radius:5px;background:#f7b73b;box-shadow:inset 0 -5px 0 #bd7823}.logo span:nth-child(2){background:#e85a5b;box-shadow:inset 0 -5px 0 #bb3c42}.logo span:nth-child(3){background:#357ed5;box-shadow:inset 0 -5px 0 #245bb1}.logo span:nth-child(4){background:#28a79b;box-shadow:inset 0 -5px 0 #138276}.caps{font-weight:850;letter-spacing:.11em;font-size:10px;color:#22609e;text-transform:uppercase}.brandname{font-size:19px;line-height:1.2;font-weight:900}.hero{background:linear-gradient(115deg,#195399,#267bb8);border-radius:21px;color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero .caps{color:#cae6ff}.hero p{color:#e7f4ff;font-size:15px;margin:0;max-width:750px}.hero .emoji{font-size:54px}.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0}.progress b{font-size:12px;color:#5e738b;margin-right:5px}.step{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid #cadced;background:white;font-weight:800;font-size:13px;color:#547193}.step.current{color:#1761b0;background:#e7f1ff;border-color:#3380cc}.step.done{color:#116b52;background:#dff6ec;border-color:#95dac0}.panel{background:white;border:1px solid #dce6f2;box-shadow:0 12px 34px #22517b12;border-radius:23px;padding:clamp(17px,4vw,30px);margin-bottom:35px}.badge{display:inline-block;background:#edf5ff;color:#235e9c;padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}
@media(max-width:720px){.hero{padding:18px 19px}.hero .emoji{display:none}.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.builder{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{padding:18px}.scene{padding:6px}.wheelSlot{border-radius:8px}}
@media(max-width:420px){.choicegrid{grid-template-columns:1fr}.answer{min-height:70px}.hero h1{font-size:27px}.progress{gap:6px}.step{width:33px;height:33px}.editpanel{padding:9px}.buildgrid,.wheelrow{gap:3px}.cell{border-radius:5px}.wheelSlot{border-radius:6px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Падение модели при испытании: поворот вокруг нижнего края. */
.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}
.tower-body{transition:transform .8s cubic-bezier(.30,.08,.76,1.16)}
@keyframes toppleTower{from{transform:rotate(0deg)}to{transform:rotate(63deg)}}
.topple-now{animation:toppleTower .85s cubic-bezier(.35,.05,.73,1.1) forwards}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}}</style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">17 урок · Торговая площадь</div><h1>Весы Справедливости</h1><p>Открой Секрет Равновесия: сравни грузы и измерь их в LEGO-кирпичиках!</p></div><div class="emoji" aria-hidden="true">⚖️</div></section><div id="app"></div></main><script>
'use strict';
const S={step:0,done:new Set(),support:'left',cups:'different',left:0,right:0,seen:new Set(),item:0,measured:new Map(),checks:new Set(),note:''};
const items=[{name:'Ластик',mass:3,color:'#ed9d80'},{name:'LEGO-человечек',mass:2,color:'#efc352'},{name:'Мини-модель',mass:5,color:'#69a6dc'}];
const $=s=>document.querySelector(s);const titles=['Настрой весы','Сравни грузы','Измерь массу','Мои весы'];
function msg(t,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=t}function mark(){S.done.add(S.step);if($('#next'))$('#next').disabled=false}
function counts(){return S.step===0?[0,0]:S.step===2?[items[S.item].mass,S.right]:[S.left,S.right]}
function balance(){const [l,r]=counts(),pivot=S.step===0?{left:250,center:330,right:410}[S.support]:330,extra=S.step===0&&S.cups==='different'?1:0;const torque=(r+.5+extra)*(560-pivot)-(l+.5)*(pivot-100)+(330-pivot);return {l,r,pivot,torque,angle:Math.abs(torque)<.001?0:Math.sign(torque)*Math.min(13,4+Math.abs(torque)/65)}}
function brick(x,y){return `<rect x="${x}" y="${y}" width="28" height="15" rx="3" fill="#3b88ce" stroke="#24598a"/><path d="M${x+4} ${y} v-3 h6 v3 M${x+18} ${y} v-3 h6 v3" fill="#8bc2ef"/>`}
function scale(){const z=balance(),rad=z.angle*Math.PI/180,point=x=>[z.pivot+(x-z.pivot)*Math.cos(rad),155+(x-z.pivot)*Math.sin(rad)];let a=`<svg viewBox="0 0 660 460" role="img" aria-label="Чашечные весы. ${z.angle===0?'Равновесие':z.angle>0?'Правая чаша ниже':'Левая чаша ниже'}."><path d="M45 445 H615" stroke="#c2d5e6" stroke-width="6"/><path d="M${z.pivot-62} 382 L${z.pivot} 155 L${z.pivot+62} 382 Z" fill="#9ec1e2" stroke="#487ba9" stroke-width="3"/><g transform="rotate(${z.angle},${z.pivot},155)"><rect x="85" y="146" width="490" height="18" rx="7" fill="#3478bb"/><circle cx="330" cy="155" r="5" fill="#f4c257"/></g><circle cx="${z.pivot}" cy="155" r="12" fill="#edb447" stroke="#a97522" stroke-width="3"/>`;
for(const [side,x,n] of [['left',100,z.l],['right',560,z.r]]){const [px,py]=point(x),by=py+145;a+=`<path d="M${px} ${py} L${px-61} ${by} M${px} ${py} L${px+61} ${by}" stroke="#577b99" stroke-width="2.5"/><path d="M${px-65} ${by} Q${px} ${by+44} ${px+65} ${by} Z" fill="${side==='right'&&S.step===0&&S.cups==='different'?'#e6a171':'#b8d8ef'}" stroke="#3b6c93" stroke-width="2"/>`;
if(S.step===2&&side==='left'){a+=`<rect x="${px-38}" y="${by-43}" width="76" height="36" rx="7" fill="${items[S.item].color}" stroke="#416780"/><text x="${px}" y="${by-20}" text-anchor="middle" font-size="13" fill="#233f59">Предмет</text>`;}else for(let j=0;j<n;j++)a+=brick(px-31+(j%2)*33,by-18-Math.floor(j/2)*20);
a+=`<text x="${px}" y="${by+67}" text-anchor="middle" font-size="14" font-weight="750" fill="#315b80">${S.step===2&&side==='left'?items[S.item].name:n+' кирп. 2×4'}</text>`;}
return a+'<text x="330" y="36" text-anchor="middle" font-size="15" fill="#526e88">Жёлтая точка на балке — её середина</text></svg>'}
function scene(){return `<div class="scene" id="scene">${scale()}</div><p class="explain" id="status" role="status">${status()}</p>`}
function status(){const z=balance();if(S.step===0)return z.angle===0?'Пустые чаши на одном уровне. Весы готовы к измерению.':'Пустые весы наклонены. Проверь положение опоры и одинаковость чаш.';return z.angle===0?'Равновесие: масса слева и справа одинакова.':z.angle>0?'Правая чаша ниже: справа тяжелее.':'Левая чаша ниже: слева тяжелее.'}
function controls(side,label){return `<div class="slot"><h3>${label}</h3><div class="row"><button class="btn" data-change="${side}:-1" aria-label="Убрать кирпичик ${side==='left'?'слева':'справа'}" ${S[side]===0?'disabled':''}>−1</button><b>${S[side]}</b><button class="btn" data-change="${side}:1" aria-label="Добавить кирпичик ${side==='left'?'слева':'справа'}" ${S[side]>=8?'disabled':''}>+1</button></div></div>`}
function render(){const i=S.step;let h='';
if(i===0)h=`<span class="badge">Мастерская 1</span><h2>Настрой честные весы</h2><p class="sub">Сначала проверь пустые весы. Передвигай опору и подбери одинаковые чаши так, чтобы балка стала горизонтальной.</p><div class="two controls"><label for="support">Точка опоры <select id="support">${[['left','Левее середины'],['center','Точно посередине'],['right','Правее середины']].map(([v,t])=>`<option value="${v}" ${S.support===v?'selected':''}>${t}</option>`).join('')}</select></label><label for="cups">Чаши <select id="cups"><option value="different" ${S.cups==='different'?'selected':''}>Правая чаша тяжелее</option><option value="same" ${S.cups==='same'?'selected':''}>Одинаковые чаши</option></select></label></div>${scene()}<button class="btn primary" id="calibrate">Проверить пустые весы</button><p class="small">Сравнивать массы по наклону можно, когда плечи равны, одинаковые пустые чаши уравновешены, а ось движется свободно.</p>`;
if(i===1)h=`<span class="badge">Исследование 2</span><h2>Создай три состояния</h2><p class="sub">Добавляй и убирай одинаковые кирпичики 2×4. Добейся трёх состояний: слева тяжелее, справа тяжелее, равновесие с грузом. Нажимай «Записать наблюдение» для каждого.</p><div class="two">${controls('left','Левая чаша')}${controls('right','Правая чаша')}</div>${scene()}<button class="btn primary" id="observe">Записать наблюдение</button><p class="small">Записано: ${[['left','слева тяжелее'],['right','справа тяжелее'],['equal','равновесие с грузом']].map(([k,t])=>(S.seen.has(k)?'✓ ':'○ ')+t).join(' · ')}</p>`;
if(i===2)h=`<span class="badge">Исследование 3</span><h2>Измерь массу в кирпичиках</h2><p class="sub">На левой чаше — предмет. Добавляй одинаковые кирпичики 2×4 справа до равновесия. Запиши результат для каждого из трёх предметов.</p><div class="pills">${items.map((x,k)=>`<button class="pill ${S.item===k?'active':''}" data-item="${k}" aria-pressed="${S.item===k}">${S.measured.has(k)?'✓ ':''}${x.name}</button>`).join('')}</div>${controls('right','Гирьки — кирпичики 2×4')}${scene()}<button class="btn primary" id="record">Записать измерение</button><h3 style="margin-top:18px">Мои измерения</h3><div style="overflow-x:auto"><table style="width:100%;text-align:left"><thead><tr><th>Предмет</th><th>Масса в кирпичиках 2×4</th></tr></thead><tbody>${items.map((x,k)=>`<tr><td>${x.name}</td><td>${S.measured.has(k)?S.measured.get(k):'Пока не измерено'}</td></tr>`).join('')}</tbody></table></div><p class="small">Предметы на экране условные. Масса настоящего ластика или LEGO-человечка может быть другой. Для всех опытов используем одну и ту же мерку.</p>`;
if(i===3)h=`<span class="badge">Практическая работа</span><h2>Построй Весы Справедливости</h2><p class="sub">Установи ровную балку на свободной оси точно посередине. На равных расстояниях от опоры подвесь одинаковые чаши. Проверь равновесие пустых весов, затем взвесь предмет одинаковыми кирпичиками 2×4.</p><div class="checklist">${['Я проверил одинаковость чаш и равенство плеч; пустые весы стоят ровно.','Я сравнил два груза: более тяжёлая чаша опустилась.','Я измерил массу предмета с помощью одинаковых кирпичиков 2×4.'].map((t,k)=>`<label><input type="checkbox" data-check="${k}" ${S.checks.has(k)?'checked':''}>${t}</label>`).join('')}</div><p class="explain">Если точного равновесия не получается, запиши промежуток: например, предмет тяжелее 3, но легче 4 кирпичиков. Не все массы выражаются целым числом мерок.</p><p class="small">Выполни этот этап после сборки настоящих весов.</p><label for="note"><h3 style="margin-top:18px">Запиши результат и объясни свой вывод</h3></label><textarea id="note" placeholder="Масса моего предмета — … кирпичиков. Весы честные, потому что…"></textarea><button class="btn primary" id="finish">Завершить работу</button><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Этапы задания"><b>Твои шаги</b>${titles.map((t,k)=>`<button class="step ${k===i?'current':S.done.has(k)?'done':''}" data-step="${k}" aria-label="${k+1}. ${t}" ${k>0&&!S.done.has(k-1)?'disabled':''}>${S.done.has(k)?'✓':k+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div></section>`;
for(const k of ['support','cups'])if($('#'+k))$('#'+k).onchange=e=>{S[k]=e.target.value;S.done.delete(0);render()};
if($('#calibrate'))$('#calibrate').onclick=calibrate;
document.querySelectorAll('[data-change]').forEach(b=>b.onclick=()=>{const [side,delta]=b.dataset.change.split(':');S[side]=Math.max(0,Math.min(8,S[side]+Number(delta)));render()});
if($('#observe'))$('#observe').onclick=observe;
document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{S.item=Number(b.dataset.item);S.right=0;render()});if($('#record'))$('#record').onclick=record;
if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));
if(i===3){$('#note').value=S.note;$('#note').oninput=e=>S.note=e.target.value;document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let k=Number(c.dataset.check);c.checked?S.checks.add(k):S.checks.delete(k)});$('#finish').onclick=()=>{if(S.checks.size<3||!S.note.trim()){msg('Отметь выполненные действия и запиши результат измерения.',false);return}mark();$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Мастер Веса!</h2><p>Ты настроил весы, сравнил грузы и научился измерять массу с помощью одинаковых мерок.</p><button class="btn" id="again">Начать заново</button></div>';$('#again').onclick=()=>{S.done.clear();S.seen.clear();S.measured.clear();S.checks.clear();S.note='';S.support='left';S.cups='different';S.item=0;S.left=0;S.right=0;go(0)}};}}
function calibrate(){if(S.support==='center'&&S.cups==='same'){mark();msg('Весы настроены! Опора посередине, плечи равны, пустые чаши уравновешены.')}else msg('Проверь оба условия: опора точно посередине и одинаковые чаши.',false)}
function observe(){const {l,r}=balance();if(l===0&&r===0){msg('Пустые весы уже проверены. Для этого наблюдения добавь груз.',false);return}const k=l===r?'equal':l>r?'left':'right';S.seen.add(k);if(S.seen.size===3)mark();render();msg(S.seen.size===3?'Три состояния исследованы! При равных плечах более тяжёлый груз опускает свою чашу.':'Наблюдение записано. Создай другое состояние весов.')}
function record(){if(S.right!==items[S.item].mass){msg('Пока нет равновесия. Добавь или убери кирпичики справа.',false);return}S.measured.set(S.item,S.right);if(S.measured.size===3)mark();render();msg(S.measured.size===3?'Все массы измерены! LEGO-кирпичик 2×4 стал твоей условной единицей массы.':'Записано: '+items[S.item].name+' — '+S.right+' кирп. 2×4. Теперь измерь другой предмет.')}
function go(i){S.step=i;S.left=0;S.right=0;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
