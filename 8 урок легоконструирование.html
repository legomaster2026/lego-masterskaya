da9d6;background:#a6cff2;touch-action:manipulation;overflow:hidden;box-shadow:inset 0 3px 3px rgba(0,0,0,.09)}.studGrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr)}.stud{border:0;padding:0;display:grid;place-items:center;background:transparent}.stud:before{content:"";width:54%;aspect-ratio:1;border-radius:50%;background:#c8e3fb;border:2px solid #82b4de;box-shadow:0 2px 0 #619ccc}.placedBrick{position:absolute;border-radius:8px;background:#2876c9;border:2px solid #175aa5;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);padding:6px;box-shadow:0 3px 0 #124a8a;z-index:3}.placedBrick i{background:#66afea;border:2px solid #3d93df;border-radius:50%;width:56%;aspect-ratio:1;place-self:center;box-shadow:0 1px 0 #1b64a8}.placedBrick:hover{background:#3b8ed9}.countLine{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;align-items:center;margin:13px 0}.bigCount{font-size:24px;font-weight:900;color:#1f61ab}.shapeStuds{display:grid;gap:3px;justify-content:center;margin:14px auto;max-width:100%}.shapeStuds i{display:block;border-radius:50%;background:#6da7dd;border:1.5px solid #2b6daa;box-shadow:inset 0 2px 1px #9cc9ee;aspect-ratio:1;min-width:0}.shapeTile{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;background:#3a83d0;border:2px solid #1e64ad;padding:5px;width:66px;height:66px;border-radius:9px}.shapeTile i{border-radius:50%;background:#8cbeef;box-shadow:0 1px 0 #225fa8}.layers{display:flex;justify-content:center;gap:9px;align-items:flex-end;min-height:174px;padding:8px;overflow-x:auto}.layerColumn{width:min(33%,130px);display:grid;gap:5px}.layerRow{height:34px;background:#4d97de;border-radius:8px;border:2px solid #2672c5;display:flex;align-items:center;justify-content:space-evenly;padding:2px 5px;gap:4px;box-shadow:0 3px 0 #18529a}.layerRow i{height:14px;width:14px;border-radius:50%;background:#b5d9f5;border:2px solid #84bdec}.layerRow.off{background:#edf3f9;border:2px dashed #cbdaea;box-shadow:none}.layerRow.off i{display:none}.tally{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:12px 0}.tally label{border:1px solid var(--border);border-radius:14px;padding:12px;display:grid;gap:7px;background:#f8fbff;font-size:13px;font-weight:700}.numeric{border:2px solid #cbdcec;border-radius:11px;background:white;min-height:46px;padding:8px 12px;text-align:center;font-size:22px;font-weight:850;color:#184b7f;width:100%;max-width:150px;justify-self:center}.gridExample{display:grid;grid-template-columns:repeat(var(--ncols),minmax(0,1fr));gap:3px;width:100%;max-width:230px;margin:10px auto}.gridExample span{aspect-ratio:1;border:1px solid #b9d2e8;background:#ddeefc;border-radius:5px;display:grid;place-items:center}.gridExample span i{display:block;width:58%;aspect-ratio:1;border-radius:50%;background:#8cbde8;border:1px solid #5a9ad2}.explainBands{display:flex;gap:8px;justify-content:center;margin:13px 0;flex-wrap:wrap}.band{padding:7px 10px;border-radius:8px;background:#e9f4ff;font-size:13px;font-weight:800;color:#315d8b}.answerGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{background:#f9fcff;border:2px solid #dfe8f2;border-radius:14px;padding:12px 10px;min-height:110px;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;font-size:14px;font-weight:750;color:#163251}.answer.selected{border-color:#2171c5;background:#edf6ff}.letter{background:#e7eff9;color:#2a649d;border-radius:9px;padding:5px 9px;font-weight:900}.designBoard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;width:min(100%,280px);margin:10px auto}.cell{aspect-ratio:1;border:2px solid #c9dced;border-radius:11px;background:#eef5fc;color:#355b7d;font-weight:900;font-size:22px;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(38,90,135,.04);padding:0}.cell.level1{background:#b2daf5;border-color:#5aabe3;color:#195e9c}.cell.level2{background:#4e9 @media(max-width:700px){.cols{grid-template-columns:1fr}.hero{padding:19px}.heroArt{display:none}.answerGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.answer{min-height:100px}.tally{grid-template-columns:1fr}.numeric{max-width:none}.panel{padding:18px}.modelBox{min-height:165px}}

<body>
<header class="top"><div class="wrap brand"><div class="brandIcon" aria-hidden="true"><i></i><i></i><i></i><i></i></div><div><div class="brandCaps">Интерактивный курс · 2 класс</div><div class="brandText">LEGO-Мастерская</div></div></div></header>
<main class="wrap main"><section class="hero"><div><div class="brandCaps">Урок 8 · Строительная мастерская</div><h1>Сколько кирпичиков нужно?</h1><p>Ты научишься узнавать, сколько места занимает постройка и сколько одинаковых кирпичиков нужно для её строительства.</p></div><div class="heroArt" aria-hidden="true">🏗️</div></section><div id="app"></div></main>
<script>
'use strict';
// Все виртуальные кирпичики одинаковые: основание 2 × 2 шипа и одна высота.
const S={step:0,done:new Set(),success:false,feedback:'',bricks:[],layerCount:0,numA:'',numB:'',selected:null,order:[],model:[[0,0,0],[0,0,0],[0,0,0]],practice:'',checks:new Set()};
const $=(s)=>document.querySelector(s);
const tasks=[
 {name:'Первый слой',title:'Заложи фундамент',desc:'Строителям нужна площадка длиной 6 шипов и шириной 4 шипа. Закрой все шипы одинаковыми кирпичиками 2 × 2. Нажимай на свободные шипы, чтобы класть детали.'},
 {name:'Слои',title:'Подними стены',desc:'На одном уровне стены лежат 4 одинаковых кирпичика. Строителю нужны 3 уровня. Сколько кирпичиков потребуется всего?'},
 {name:'Считаем детали',title:'Сколько кирпичиков понадобится?',desc:'Основание постройки — 6 шипов в длину и 4 шипа в ширину. Кирпичик занимает место 2 × 2 шипа. Нужно построить 2 одинаковых слоя. Сколько кирпичиков понадобится?'},
 {name:'Ошибка',title:'Где ошибся строитель?',desc:'Строитель хочет сделать 2 одинаковых слоя на площадке 4 × 4 шипа. Каждый кирпичик занимает место 2 × 2 шипа. Он решил, что нужно всего 4 кирпичика. Что он забыл?'},
 {name:'Конструктор',title:'Построй по плану',desc:'Перед тобой план башни. Число в клетке показывает, сколько кирпичиков стоят друг на друге. Нажимай на клетки своей площадки и строй такую же объёмную модель.'},
 {name:'Практика',title:'Построй настоящую LEGO-башню',desc:'Возьми одинаковые кирпичики 2 × 2. Построй основание размером 4 × 4 шипа и подними постройку на 3 слоя. Сколько кирпичиков тебе понадобится?'}
];
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function getRandom(n){if(window.crypto&&crypto.getRandomValues){let x=new Uint32Array(1);crypto.getRandomValues(x);return Math.floor(x[0]/4294967296*n)}return Math.floor(Math.random()*n)}
function shuffled(n){let a=Array.from({length:n},(_,i)=>i);for(let i=a.length-1;i>0;i--){let j=getRandom(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function progress(){return `<nav class="progress" aria-label="Этапы урока"><span class="progressLabel">Твои шаги</span>${tasks.map((t,i)=>`<span class="bubble ${i===S.step?'on':S.done.has(i)?'ok':''}" title="${escapeHTML(t.name)}">${S.done.has(i)?'✓':i+1}</span>`).join('')}</nav>`}
function countAll(){return S.model.flat().reduce((a,n)=>a+n,0)}
function studExample(cols,rows){return `<div class="gridExample" style="--ncols:${cols}" aria-label="Основание ${cols} на ${rows} шипов">${Array.from({length:cols*rows},()=>'<span><i></i></span>').join('')}</div>`}
function brickPlan(){const n=6,m=4;let occupied=Array.from({length:m},()=>Array(n).fill(false));S.bricks.forEach(({x,y})=>{for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)occupied[y+dy][x+dx]=true});let studs=[];for(let y=0;y<m;y++)for(let x=0;x<n;x++)studs.push(`<button type="button" class="stud" data-place="${x},${y}" aria-label="Шип: столбец ${x+1}, ряд ${y+1}${occupied[y][x]?', занят':''}"></button>`);
return `<div class="cols"><div class="card"><h3>Площадка строителя</h3><div class="legend"><span class="chip">6 шипов в длину</span><span class="chip">4 шипа в ширину</span></div><div class="studBoard"><div class="studGrid">${studs.join('')}</div>${S.bricks.map((b,i)=>`<button type="button" class="placedBrick" data-remove="${i}" aria-label="Убрать кирпичик" style="left:${100*b.x/6}%;top:${100*b.y/4}%;width:${200/6}%;height:${200/4}%"><i></i><i></i><i></i><i></i></button>`).join('')}</div><div class="countLine"><span>Ты положил кирпичиков:</span><span class="bigCount">${S.bricks.length}</span></div><p class="secondary">Нажми на кирпичик, чтобы убрать его.</p></div><div class="card"><h3>Наш мерный кирпичик</h3><div class="shapeTile" style="margin:18px auto"><i></i><i></i><i></i><i></i></div><p>Длина — <b>2 шипа</b><br>Ширина — <b>2 шипа</b></p><div class="note" style="text-align:left">Сколько места займут кирпичики в первом слое? Все детали должны поместиться на площадке и закрыть её без промежутков.</div></div></div>`}
function layersPicture(k){let out='<div class="layers" aria-label="Слои стены">';for(let col=0;col<4;col++){out+='<div class="layerColumn">';for(let l=3;l>=1;l--)out+=`<div class="layerRow ${k>=l?'':'off'}">${k>=l?'<i></i><i></i>':''}</div>`;out+='</div>'}return out+'</div>'}
function layerTask(){return `<div class="cols"><div class="card"><h3>Исследуй слои</h3>${layersPicture(S.layerCount)}<div class="countLine"><button class="btn neutral" id="removeLayer" ${S.layerCount===0?'disabled':''}>Убрать слой −</button><button class="btn neutral" id="addLayer" ${S.layerCount===3?'disabled':''}>Добавить слой +</button></div><p class="secondary">Построй стену высотой в 3 слоя. Эта модель поможет тебе проверить расчёт.</p></div><div class="card"><h3>Реши задачу</h3><p>В одном слое <b>4 кирпичика</b>.</p><p style="margin:12px 0">Нужно построить <b>3 слоя</b>.</p><label for="layerAnswer" class="subheading" style="display:block;margin-top:14px">Сколько всего кирпичиков?</label><input id="layerAnswer" class="numeric" inputmode="numeric" type="number" min="0" max="99" autocomplete="off" placeholder="?" value="${escapeHTML(S.numA)}"><p class="secondary" style="margin-top:12px">Сначала подумай, потом проверь ответ.</p></div></div>`}
function estimateTask(){return `<div class="cols"><div class="card"><h3>Основание постройки</h3><div class="legend"><span class="chip">6 шипов в длину</span><span class="chip">4 шипа в ширину</span></div>${studExample(6,4)}<p class="secondary">Каждый кирпичик закрывает 2 шипа в длину и 2 в ширину.</p><p class="note">Раздели площадку на кирпичики 2 × 2, чтобы узнать, сколько нужно для одного слоя.</p></div><div class="card white"><h3>Посчитай кирпичики</h3><div class="tally"><label>1. Сколько кирпичиков нужно на один слой?<input class="numeric" id="estimateBase" type="number" inputmode="numeric" min="0" max="200" autocomplete="off" placeholder="?" value="${escapeHTML(S.numA)}"></label><label>2. Сколько кирпичиков понадобится для двух слоёв?<input class="numeric" id="estimateTotal" type="number" inputmode="numeric" min="0" max="200" autocomplete="off" placeholder="?" value="${escapeHTML(S.numB)}"></label></div><p class="secondary">Сначала найди, сколько кирпичиков поместится в одном слое. Затем посчитай второй такой же слой.</p></div></div>`}
const reasoning=[
 'Он посчитал только первый слой, а второй забыл.',
 'Он не выбрал цвет второго слоя.',
 'Он посчитал кирпичики дважды.'
];
function reasonTask(){if(S.order.length!==3)S.order=shuffled(3);return `<div class="cols"><div class="card"><h3>План и ответ строителя</h3><div class="legend"><span class="chip">4 × 4 шипа</span><span class="chip">2 слоя</span></div>${studExample(4,4)}<p class="secondary">Кирпичики одинаковые: каждый закрывает 2 × 2 шипа.</p><div class="note">Строитель решил, что нужно:<br><strong style="font-size:22px;color:#185a9c">4 кирпичика</strong></div></div><div class="card white"><h3>В чём ошибка?</h3><div class="answerGrid" style="grid-template-columns:1fr">${S.order.map((ix,pos)=>`<button type="button" class="answer ${S.selected===ix?'selected':''}" data-choice="${ix}" aria-pressed="${S.selected===ix}"><span class="letter">${'АБВ'[pos]}</span><span>${escapeHTML(reasoning[ix])}</span></button>`).join('')}</div></div></div>`}
const target=[[1,2,0],[2,1,1],[0,2,1]];
function isoModel(matrix){const W=42,D=17,H=31,OX=191,OY=72;
 let s=`<svg class="modelSvg" viewBox="0 0 390 278" role="img" aria-label="Объёмная модель. Синие кирпичики поставлены друг на друга по высоте каждой клетки">`;
 // Ground tiles
 for(let y=0;y<3;y++)for(let x=0;x<3;x++){let X=OX+(x-y)*W,Y=OY+(x+y)*D+36;s+=`<polygon points="${X},${Y} ${X+W},${Y+D} ${X},${Y+2*D} ${X-W},${Y+D}" fill="${(x+y)%2?'#f0f5fb':'#e9f1f9'}" stroke="#c8d9e9" stroke-width="1.2"/>`}
 let cubes=[];for(let y=0;y<3;y++)for(let x=0;x<3;x++)for(let z=0;z<matrix[y][x];z++)cubes.push({x,y,z});
 cubes.sort((a,b)=>(a.x+a.y+a.z)-(b.x+b.y+b.z)||a.z-b.z||a.y-b.y||a.x-b.x);
 for(const {x,y,z} of cubes){const X=OX+(x-y)*W,Y=OY+(x+y)*D-z*H,light=z===0;const left=light?'#2d7cca':'#e5a340',right=light?'#185da8':'#c27a25',top=light?'#75bafa':'#ffd36f',outline=light?'#1f62a9':'#bf822b';
 s+=`<polygon points="${X-W},${Y+D} ${X},${Y+2*D} ${X},${Y+2*D+H} ${X-W},${Y+D+H}" fill="${left}" stroke="${outline}" stroke-width="1.1"/>`;
 s+=`<polygon points="${X+W},${Y+D} ${X},${Y+2*D} ${X},${Y+2*D+H} ${X+W},${Y+D+H}" fill="${right}" stroke="${outline}" stroke-width="1.1"/>`;
 s+=`<polygon points="${X},${Y} ${X+W},${Y+D} ${X},${Y+2*D} ${X-W},${Y+D}" fill="${top}" stroke="${outline}" stroke-width="1.1"/>`;
 // Four studs per visible top
 for(const [dx,dy] of [[0.25,0.25],[0.75,0.25],[0.25,0.75],[0.75,0.75]]){let sx=X+(dx-dy)*W,sy=Y+(dx+dy)*D;s+=`<ellipse cx="${sx}" cy="${sy}" rx="6.1" ry="3.4" fill="${light?'#acd9ff':'#ffe2a0'}" stroke="${outline}" stroke-width=".9"/>`}
 }
 s+='</svg>';return s;
}
function heightGrid(matrix,isTarget){return `<div class="designBoard">${matrix.flatMap((row,y)=>row.map((v,x)=>isTarget?`<div class="cell target ${v===0?'zero':''}" aria-label="Ряд ${y+1}, место ${x+1}, ${v} кирпичиков">${v===0?'·':v}</div>`:`<button type="button" class="cell ${v===0?'zero':v===1?'level1':'level2'}" data-build="${x},${y}" aria-label="Ряд ${y+1}, место ${x+1}, высота ${v} кирпичиков">${v===0?'+':v}</button>`)).join('')}</div>`}
function builderTask(){return `<div class="cols"><div class="card"><h3>План строителя</h3><p class="secondary">Число показывает высоту столбика. Точка — пустое место.</p>${heightGrid(target,true)}<div class="legend"><span class="chip">1 — один кирпичик</span><span class="chip">2 — два кирпичика</span></div><p class="secondary" style="margin-top:9px">Это план, по которому нужно строить.</p></div><div class="card"><h3>Твоя строительная площадка</h3><p class="secondary">Нажимай на клетки: пусто → 1 → 2 → пусто.</p>${heightGrid(S.model,false)}<p class="secondary">Трёхмерная модель меняется сразу.</p></div></div><div class="card" style="margin-top:14px"><h3>Твоя объёмная постройка</h3><div class="modelBox">${isoModel(S.model)}</div><div class="legend"><span class="chip"><i></i> Нижние кирпичики</span><span class="chip" style="background:#fff4de;color:#a06824"><i style="background:#ecc06c"></i> Верхние кирпичики</span></div><div class="countLine"><span>Всего в постройке:</span><span class="bigCount">${countAll()}</span><span>кирпичиков</span></div><button id="clearBuild" type="button" class="btn neutral">Очистить постройку</button></div>`}
function practicalTask(){return `<div class="cols"><div class="card"><h3>Проект для настоящих деталей</h3><div class="legend"><span class="chip">Основание 4 × 4 шипа</span><span class="chip">Высота 3 слоя</span></div>${studExample(4,4)}<p class="secondary">Используй только одинаковые кирпичики 2 × 2 шипа. Построй три одинаковых слоя.</p></div><div class="card white"><h3>Моя мастерская</h3>${[
'Я приготовил одинаковые кирпичики и освободил рабочее место.',
'Я собрал первый слой размером 4 × 4 шипа.',
'Я добавил ещё два таких же слоя.',
'Я проверил, что постройка получилась устойчивой.'
].map((t,i)=>`<div class="stepBox"><label><input type="checkbox" data-practice="${i}" ${S.checks.has(i)?'checked':''}><span>${escapeHTML(t)}</span></label></div>`).join('')}<label class="subheading" for="practiceAnswer">Сколько кирпичиков понадобилось всего?</label><input class="numeric" type="number" min="0" max="99" inputmode="numeric" autocomplete="off" id="practiceAnswer" placeholder="?" value="${escapeHTML(S.practice)}"><p class="hintText" style="margin-top:12px">Покажи готовую постройку учителю.</p></div></div>`}
function taskHTML(){return [brickPlan,layerTask,estimateTask,reasonTask,builderTask,practicalTask][S.step]()}
function actionButtons(){return `<div class="actions">${S.success?`<button type="button" id="next" class="btn primary">${S.step===5?'Завершить урок':'Следующее задание →'}</button>`:`<button type="button" id="check" class="btn primary">Проверить</button>`}${S.step===4&&!S.success?'<button type="button" id="builderHint" class="btn neutral">Подсказка</button>':''}</div>`}
function render(){const t=tasks[S.step];$('#app').innerHTML=`${progress()}<section class="panel"><span class="badge">Задание ${S.step+1} из ${tasks.length}</span><h2>${escapeHTML(t.title)}</h2><p class="intro">${escapeHTML(t.desc)}</p>${taskHTML()}${actionButtons()}${S.feedback?`<div class="feedback ${S.success?'good':'bad'}" role="status">${escapeHTML(S.feedback)}</div>`:''}</section>`;wire()}
function resetFeedback(){S.feedback='';S.success=false;S.done.delete(S.step)}
function rerenderKeepingFocus(){render()}
function wire(){
 document.querySelectorAll('[data-place]').forEach(el=>el.addEventListener('click',()=>{
  const [x,y]=el.dataset.place.split(',').map(Number);
  let occupied=new Set();S.bricks.forEach(b=>{for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)occupied.add(`${b.x+dx},${b.y+dy}`)});
  let spot=null;
  for(const dy of [0,-1])for(const dx of [0,-1]){
    const xx=x+dx,yy=y+dy;
    if(xx<0||yy<0||xx>4||yy>2)continue;
    let free=true;for(let a=0;a<2;a++)for(let c=0;c<2;c++)if(occupied.has(`${xx+a},${yy+c}`))free=false;
    if(free&&spot===null)spot={x:xx,y:yy};
  }
  if(spot===null){S.feedback='Здесь кирпичик не поместится. Попробуй другое свободное место или убери одну из деталей.';S.success=false;render();return}
  S.bricks.push(spot);resetFeedback();render()
 }));
 document.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{S.bricks.splice(+el.dataset.remove,1);resetFeedback();render()}));
 const add=$('#addLayer'),remove=$('#removeLayer');if(add)add.addEventListener('click',()=>{S.layerCount=Math.min(3,S.layerCount+1);resetFeedback();render()});if(remove)remove.addEventListener('click',()=>{S.layerCount=Math.max(0,S.layerCount-1);resetFeedback();render()});
 const layerAnswer=$('#layerAnswer');if(layerAnswer)layerAnswer.addEventListener('input',()=>{S.numA=layerAnswer.value;resetFeedback();});
 const base=$('#estimateBase');if(base)base.addEventListener('input',()=>{S.numA=base.value;resetFeedback()});const tot=$('#estimateTotal');if(tot)tot.addEventListener('input',()=>{S.numB=tot.value;resetFeedback()});
 document.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{S.selected=+el.dataset.choice;resetFeedback();render()}));
 document.querySelectorAll('[data-build]').forEach(el=>el.addEventListener('click',()=>{const [x,y]=el.dataset.build.split(',').map(Number);S.model[y][x]=(S.model[y][x]+1)%3;resetFeedback();render()}));const clear=$('#clearBuild');if(clear)clear.addEventListener('click',()=>{S.model=Array.from({length:3},()=>[0,0,0]);resetFeedback();render()});
 document.querySelectorAll('[data-practice]').forEach(el=>el.addEventListener('change',()=>{const i=+el.dataset.practice;el.checked?S.checks.add(i):S.checks.delete(i);resetFeedback()}));const practice=$('#practiceAnswer');if(practice)practice.addEventListener('input',()=>{S.practice=practice.value;resetFeedback()});
 const check=$('#check');if(check)check.addEventListener('click',validate);const next=$('#next');if(next)next.addEventListener('click',advance);const hint=$('#builderHint');if(hint)hint.addEventListener('click',()=>{S.feedback='Сравни каждую клетку своей площадки с планом слева. Сначала поставь нижние кирпичики, затем добавь верхние там, где стоит число 2.';render()});
}
function validate(){let correct=false,message='';switch(S.step){
 case 0:{let covered=Array.from({length:4},()=>Array(6).fill(false));S.bricks.forEach(b=>{for(let dy=0;dy<2;dy++)for(let dx=0;dx<2;dx++)covered[b.y+dy][b.x+dx]=true});correct=covered.every(row=>row.every(Boolean));message=correct?'Отлично! Ты закрыл всю площадку. Для первого слоя понадобилось 6 кирпичиков 2 × 2.':`Пока на площадке есть свободные шипы. Попробуй закрыть все места без промежутков.`;break}
 case 1: correct=S.numA!==''&&Number(S.numA)===12;message=correct?'Верно! 4 кирпичика в каждом из 3 слоёв: 4 + 4 + 4 = 12. Так мы посчитали, сколько одинаковых кирпичиков занимает объём всей постройки.':S.numA===''?'Введи количество кирпичиков в трёх слоях.':'Проверь: в одном слое 4 кирпичика. Сколько получится в трёх таких слоях?';break;
 case 2:{let a=S.numA!==''&&Number(S.numA)===6,b=S.numB!==''&&Number(S.numB)===12;correct=a&&b;message=correct?'Верно! В одном слое 3 кирпичика в длину и 2 в ширину: 3 × 2 = 6. В двух слоях: 6 + 6 = 12 кирпичиков.':`Проверь расчёт: ${a?'первый слой найден правильно':'найди, сколько кирпичиков нужно для первого слоя'}${a&&!b?', затем прибавь столько же для второго слоя':''}.`;break}
 case 3:correct=S.selected===0;message=correct?'Правильно! Для первого слоя нужно 4 кирпичика, и для второго столько же: 4 + 4 = 8.':'В одном слое 4 кирпичика. Сколько понадобится в двух одинаковых слоях?';break;
 case 4: correct=JSON.stringify(S.model)===JSON.stringify(target);if(correct)message=`Постройка совпала с планом! Основание занимает 7 мест, а всего ты использовал ${countAll()} одинаковых кирпичиков.`;else{const wrong=target.flat().filter((v,i)=>v!==S.model.flat()[i]).length;message=`Пока не совпадают ${wrong} ${wrong===1?'клетка':wrong<5?'клетки':'клеток'} с планом. Сравни числа в клетках и поправь высоту.`}break;
 case 5:correct=S.practice!==''&&Number(S.practice)===12;message=correct?'Верно! В первом слое 4 кирпичика, в трёх слоях — 12. Покажи учителю свою постройку.':'Проверь расчёт: на основании 4 × 4 шипа помещаются четыре кирпичика 2 × 2. Сколько их в трёх слоях?';break;
 }
 S.success=correct;S.feedback=message;if(correct)S.done.add(S.step);render();
}
function advance(){if(S.step===tasks.length-1){complete();return}S.step++;S.success=false;S.feedback='';S.numA='';S.numB='';S.selected=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function complete(){$('#app').innerHTML=`<section class="end"><div class="cup">🏆</div><div class="brandCaps">Миссия завершена</div><h2>Отличная работа, LEGO-строитель!</h2><p>Ты научился считать кирпичики в одном слое и в нескольких слоях, строить по плану и проверять свои расчёты.</p><div class="actions"><button id="restart" class="btn primary">Пройти урок ещё раз ↻</button></div></section>`;$('#restart').addEventListener('click',()=>{S.step=0;S.done=new Set();S.success=false;S.feedback='';S.bricks=[];S.layerCount=0;S.numA='';S.numB='';S.selected=null;S.order=[];S.model=[[0,0,0],[0,0,0],[0,0,0]];S.practice='';S.checks=new Set();render();window.scrollTo({top:0,behavior:'smooth'})})}
render();
</script>
</body>
</html>
