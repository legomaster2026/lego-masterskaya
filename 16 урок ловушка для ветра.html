button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1586da;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,5vw,38px);line-height:1.12;margin:5px 0 9px}h2{font-size:clamp(22px,4vw,28px);line-height:1.23;margin:9px 0 12px}h3{font-size:17px;margin:0 0 10px}.wrap{width:min(1020px,calc(100% - 26px));margin:auto}.brand{display:flex;gap:11px;align-items:center;padding:18px 0}.logo{display:grid;grid-template-columns:repeat(2,20px);gap:3px;transform:rotate(-8deg)}.logo span{height:18px;border-radius:5px;background:#f7b73b;box-shadow:inset 0 -5px 0 #bd7823}.logo span:nth-child(2){background:#e85a5b;box-shadow:inset 0 -5px 0 #bb3c42}.logo span:nth-child(3){background:#357ed5;box-shadow:inset 0 -5px 0 #245bb1}.logo span:nth-child(4){background:#28a79b;box-shadow:inset 0 -5px 0 #138276}.caps{font-weight:850;letter-spacing:.11em;font-size:10px;color:#22609e;text-transform:uppercase}.brandname{font-size:19px;line-height:1.2;font-weight:900}.hero{background:linear-gradient(115deg,#195399,#267bb8);border-radius:21px;color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero .caps{color:#cae6ff}.hero p{color:#e7f4ff;font-size:15px;margin:0;max-width:750px}.hero .emoji{font-size:54px}.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0}.progress b{font-size:12px;color:#5e738b;margin-right:5px}.step{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid #cadced;background:white;font-weight:800;font-size:13px;color:#547193}.step.current{color:#1761b0;background:#e7f1ff;border-color:#3380cc}.step.done{color:#116b52;background:#dff6ec;border-color:#95dac0}.panel{background:white;border:1px solid #dce6f2;box-shadow:0 12px 34px #22517b12;border-radius:23px;padding:clamp(17px,4vw,30px);margin-bottom:35px}.badge{display:inline-block;background:#edf5ff;color:#235e9c;padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}
@media(max-width:720px){.hero{padding:18px 19px}.hero .emoji{display:none}.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.builder{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{padding:18px}.scene{padding:6px}.wheelSlot{border-radius:8px}}
@media(max-width:420px){.choicegrid{grid-template-columns:1fr}.answer{min-height:70px}.hero h1{font-size:27px}.progress{gap:6px}.step{width:33px;height:33px}.editpanel{padding:9px}.buildgrid,.wheelrow{gap:3px}.cell{border-radius:5px}.wheelSlot{border-radius:6px}}

.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}
.tower-body{transition:transform .8s cubic-bezier(.30,.08,.76,1.16)}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}}</style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">Урок 16 · Ветреная гора</div><h1>Ловушка для ветра</h1><p>Поймай невидимую силу воздуха и стань Мастером Ветра LEGO-страны!</p></div><div class="emoji" aria-hidden="true">🌬️</div></section><div id="app"></div></main><script>
'use strict';
const S={step:0,done:new Set(),wind:0,angle:30,logs:[],seen:new Set(),base:'narrow',axis:false,blades:0,checks:new Set(),note:''};
const $=s=>document.querySelector(s);let frame=0,busy=false;const titles=['Ветер и движение','Секрет лопастей','Ветряная башня','Мой ветряк'];
function msg(t,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=t}
function mark(){S.done.add(S.step);if($('#next'))$('#next').disabled=false}
function windName(v){return ['Нет ветра','Слабый','Умеренный','Сильный'][v]}
function scene(){const build=S.step===2,n=build?S.blades:4,w=build&&S.base==='narrow'?48:155;let b='';for(let i=0;i<n;i++){const theta=i*360/n;b+=`<g transform="rotate(${theta})"><path d="M-9 -19 L-19 -110 Q-18 -126 2 -125 L21 -118 L13 -22 Z" fill="${i%2?'#f1bb4f':'#4291d9'}" stroke="#295b85" stroke-width="2"/><path d="M-3 -28 L-5 -109" stroke="#fff" opacity=".7" stroke-width="3"/></g>`}
return `<svg viewBox="0 0 660 375" role="img" aria-label="Ветряная башня с вращающейся турбиной. В отдельной схеме показан наклон лопасти."><rect x="30" y="40" width="170" height="93" rx="13" fill="#eaf4ff"/><text x="115" y="65" text-anchor="middle" font-size="14" fill="#335d82">Поток воздуха</text><g id="air"><path d="M55 88 H160 m-13 -8 l13 8 -13 8 M55 113 H160 m-13 -8 l13 8 -13 8" fill="none" stroke="#75b1d5" stroke-width="3"/></g><rect x="321" y="169" width="18" height="172" rx="5" fill="#8ab2d8"/><path d="M${330-w/2} 338 L330 225 L${330+w/2} 338" fill="none" stroke="#427cb5" stroke-width="6"/><rect x="${330-w/2-10}" y="334" width="${w+20}" height="16" rx="5" fill="#3378bd"/><g transform="translate(330,167)"><g id="rotor">${b}</g><circle r="18" fill="${build&&!S.axis?'#adbdcb':'#275e93'}" stroke="#fff" stroke-width="3"/><circle r="5" fill="#e7f2fc"/></g><rect x="470" y="45" width="165" height="130" rx="14" fill="#eef6ff"/><text x="552" y="68" text-anchor="middle" font-size="13" fill="#335d82">Лопасть: вид с торца</text><path d="M490 115 H615" stroke="#a8bed3" stroke-dasharray="4 4"/><g transform="translate(552,115) rotate(${-S.angle})"><rect x="-45" y="-5" width="90" height="10" rx="4" fill="#edb247" stroke="#996e23"/></g><text x="552" y="160" text-anchor="middle" font-size="14" fill="#335d82">Наклон ${S.angle}°</text><text x="330" y="371" text-anchor="middle" font-size="13" fill="#4d6784">Вид спереди. Стрелки потока показаны условно.</text></svg>`}
function readout(){return `<div class="controls row"><b>Опыт: 5 секунд</b><span>Прошло: <b id="time">0,0</b> с</span><span>Обороты: <b id="count">0,0</b></span></div>`}
function settings(angle=true){return `<div class="two controls"><label for="wind">Сила ветра <select id="wind">${[0,1,2,3].map(n=>`<option value="${n}" ${S.wind===n?'selected':''}>${windName(n)}</option>`).join('')}</select></label>${angle?`<label for="angle">Наклон лопастей <select id="angle">${[0,15,30,45,60,90].map(n=>`<option value="${n}" ${S.angle===n?'selected':''}>${n}°</option>`).join('')}</select></label>`:'<p class="small">Наклон лопастей: 30°. Меняем только ветер.</p>'}</div>`}
function table(){return S.logs.length?`<div style="overflow-x:auto"><table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr><th>Опыт</th><th>Ветер</th><th>Наклон</th><th>Обороты за 5 с</th></tr></thead><tbody>${S.logs.map((r,i)=>`<tr><td>${i+1}</td><td>${windName(r.w)}</td><td>${r.a}°</td><td>${r.n.toLocaleString('ru',{maximumFractionDigits:1})}</td></tr>`).join('')}</tbody></table></div>`:''}
function render(){cancelAnimationFrame(frame);busy=false;let i=S.step,h='';
if(i===0)h=`<span class="badge">Исследование 1</span><h2>Что приводит турбину в движение?</h2><p class="sub">Сначала проведи опыт без ветра. Затем включи умеренный ветер и повтори. В каждом опыте наблюдай за лопастями 5 секунд.</p>${settings(false)}<div class="scene" id="scene">${scene()}</div>${readout()}<button class="btn primary" id="run">Начать опыт</button><p class="explain">Турбина — колесо с лопастями. Воздух действует на наклонённые лопасти и может вращать ось. Без потока воздуха эта модель не начинает вращаться.</p>`;
if(i===1)h=`<span class="badge">Исследование 2</span><h2>Найди удачный наклон</h2><p class="sub">При одном и том же ненулевом ветре сравни два разных наклона лопастей. Затем оставь наклон тем же и сравни слабый и умеренный ветер. Каждый опыт длится 5 секунд.</p>${settings()}<div class="scene" id="scene">${scene()}</div>${readout()}<button class="btn primary" id="run">Испытать лопасти</button><h3 style="margin-top:18px">Журнал наблюдений</h3><div id="logs">${table()}</div><p class="small">Модель условная: число оборотов помогает сравнивать опыты. У настоящей турбины результат зависит также от формы лопастей, трения и нагрузки. Наибольший угол не обязательно даёт наибольшую скорость.</p>`;
if(i===2)h=`<span class="badge">Инженерная задача</span><h2>Построй Ветряную башню</h2><p class="sub">Выбери широкое основание, установи свободно вращающуюся ось и 3 или 4 лёгкие лопасти. При умеренном ветре добейся хотя бы 3 оборотов за 5 секунд.</p><div class="controls row"><label for="base">Основание <select id="base"><option value="narrow" ${S.base==='narrow'?'selected':''}>Узкое</option><option value="wide" ${S.base==='wide'?'selected':''}>Широкое</option></select></label><label for="blades">Лопасти <select id="blades">${[0,3,4].map(n=>`<option value="${n}" ${S.blades===n?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn ${S.axis?'primary':''}" id="axis" aria-pressed="${S.axis}">${S.axis?'✓ Ось вращается свободно':'Установить свободную ось'}</button></div>${settings()}<div class="scene" id="scene">${scene()}</div>${readout()}<button class="btn primary" id="run">Испытать башню</button><p class="small">На экране показана схема сборки. Устойчивость настоящей башни проверь отдельно.</p>`;
if(i===3)h=`<span class="badge">Практическая работа</span><h2>Поймай настоящий ветер</h2><p class="sub">Построй устойчивую башню. Установи на свободной оси 3–4 лёгкие лопасти с одинаковым наклоном. Используй угловые соединители. Под направленным учителем потоком воздуха сравни два положения лопастей, сохраняя расстояние до источника ветра.</p><div class="checklist">${['Моя башня стоит устойчиво, лопасти закреплены надёжно.','Ось вращается свободно, лопасти не задевают башню.','Я сравнил два наклона при одинаковом ветре и выбрал удачный.'].map((t,k)=>`<label><input type="checkbox" data-check="${k}" ${S.checks.has(k)?'checked':''}>${t}</label>`).join('')}</div><p class="explain">В этой работе ветер превращается во вращение. Для получения электричества нужен ещё генератор — он не входит в нашу модель.</p><p class="small">Если деталей пока нет, выполни этот этап после сборки.</p><label for="note"><h3 style="margin-top:18px">Запиши своё открытие</h3></label><textarea id="note" placeholder="Лучше всего мой ветряк вращался, когда… Ветер передаёт энергию…"></textarea><button class="btn primary" id="finish">Завершить работу</button><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Шаги задания"><b>Твои шаги</b>${titles.map((t,k)=>`<button class="step ${k===i?'current':S.done.has(k)?'done':''}" data-step="${k}" aria-label="${k+1}. ${t}" ${k>0&&!S.done.has(k-1)?'disabled':''}>${S.done.has(k)?'✓':k+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div></section>`;
for(const k of ['wind','angle','base','blades'])if($('#'+k))$('#'+k).onchange=e=>{S[k]=k==='base'?e.target.value:Number(e.target.value);if(i===2)S.done.delete(2);render()};if($('#axis'))$('#axis').onclick=()=>{S.axis=!S.axis;S.done.delete(2);render()};if($('#run'))$('#run').onclick=run;
if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));
if(i===3){$('#note').value=S.note;$('#note').oninput=e=>S.note=e.target.value;document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let k=Number(c.dataset.check);c.checked?S.checks.add(k):S.checks.delete(k)});$('#finish').onclick=()=>{if(S.checks.size<3||!S.note.trim()){msg('Отметь выполненные действия и запиши своё открытие.',false);return}mark();$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Мастер Ветра!</h2><p>Ты научился превращать энергию ветра во вращение, испытал лопасти и построил Ветряную башню!</p><button class="btn" id="again">Начать заново</button></div>';$('#again').onclick=()=>{S.done.clear();S.seen.clear();S.logs=[];S.checks.clear();S.note='';S.wind=0;S.angle=30;S.base='narrow';S.axis=false;S.blades=0;go(0)}};}}
function speed(w,a){return w*.6*Math.max(0,Math.sin(2*a*Math.PI/180))}
function compared(){let angle=false,wind=false;for(const a of S.logs)for(const b of S.logs){if(a.w===b.w&&a.w>0&&a.a!==b.a)angle=true;if(a.a===b.a&&a.a>0&&a.a<90&&((a.w===1&&b.w===2)||(a.w===2&&b.w===1)))wind=true}return angle&&wind}
function lock(v){document.querySelectorAll('#run,#wind,#angle,#base,#blades,#axis').forEach(b=>b.disabled=v)}
function run(){if(busy)return;const i=S.step;if(i===2){if(S.base!=='wide'){msg('Выбери широкое основание для башни.',false);return}if(!S.axis){msg('Установи ось, которая свободно вращается.',false);return}if(S.blades<3){msg('Установи 3 или 4 лопасти.',false);return}if(S.wind!==2){msg('Для честного испытания башни установи умеренный ветер.',false);return}}const w=S.wind,a=S.angle,rate=speed(w,a);busy=true;lock(true);let start=null;function tick(ts){if(start===null)start=ts;const t=Math.min(5,(ts-start)/1000),turns=rate*t;$('#rotor').setAttribute('transform',`rotate(${turns*360})`);$('#air').setAttribute('opacity',w===0?'.15':String(.45+.55*Math.sin(t*5)**2));$('#time').textContent=t.toLocaleString('ru',{minimumFractionDigits:1,maximumFractionDigits:1});$('#count').textContent=turns.toLocaleString('ru',{minimumFractionDigits:1,maximumFractionDigits:1});if(t<5){frame=requestAnimationFrame(tick);return}busy=false;lock(false);const n=Math.round(rate*50)/10;if(i===0){S.seen.add(w);if(S.seen.has(0)&&S.seen.has(2)){mark();msg('Сравнение готово! Без ветра турбина стояла, а умеренный ветер привёл её во вращение.')}else msg(w===0?'Без ветра турбина стоит. Теперь включи умеренный ветер и повтори опыт.':'Теперь проведи опыт без ветра и с умеренным ветром.');}else if(i===1){S.logs.push({w,a,n});$('#logs').innerHTML=table();if(compared()){mark();msg('Оба сравнения выполнены! Ветер передаёт энергию лопастям. Скорость зависит и от ветра, и от наклона. Найди в журнале самый удачный наклон.')}else msg('Результат: '+n.toLocaleString('ru')+' оборота за 5 секунд. Продолжи опыты, меняя один параметр за раз.');}else if(n>=3){mark();msg('Башня прошла испытание: '+n.toLocaleString('ru')+' оборота за 5 секунд при умеренном ветре!')}else msg('Получилось '+n.toLocaleString('ru')+' оборота. Измени наклон лопастей и повтори опыт при том же ветре.',false);}frame=requestAnimationFrame(tick)}
function go(i){S.step=i;if(i===0)S.angle=30;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
