<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO-Мастерская — урок 12. Зубчатый код</title><style>
:root{--ink:#143151;--muted:#4d6784;--blue:#1a5cb2;--line:#d7e4f2;--sky:#eef6ff;--bg:#f4f7fd;--ok:#128164;--warn:#ad6d20}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top left,#dfedff 0,transparent 38%),radial-gradient(ellipse at top right,#fff0d5 0,transparent 40%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1586da;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,5vw,38px);line-height:1.12;margin:5px 0 9px}h2{font-size:clamp(22px,4vw,28px);line-height:1.23;margin:9px 0 12px}h3{font-size:17px;margin:0 0 10px}.wrap{width:min(1020px,calc(100% - 26px));margin:auto}.brand{display:flex;gap:11px;align-items:center;padding:18px 0}.logo{display:grid;grid-template-columns:repeat(2,20px);gap:3px;transform:rotate(-8deg)}.logo span{height:18px;border-radius:5px;background:#f7b73b;box-shadow:inset 0 -5px 0 #bd7823}.logo span:nth-child(2){background:#e85a5b;box-shadow:inset 0 -5px 0 #bb3c42}.logo span:nth-child(3){background:#357ed5;box-shadow:inset 0 -5px 0 #245bb1}.logo span:nth-child(4){background:#28a79b;box-shadow:inset 0 -5px 0 #138276}.caps{font-weight:850;letter-spacing:.11em;font-size:10px;color:#22609e;text-transform:uppercase}.brandname{font-size:19px;line-height:1.2;font-weight:900}.hero{background:linear-gradient(115deg,#195399,#267bb8);border-radius:21px;color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero .caps{color:#cae6ff}.hero p{color:#e7f4ff;font-size:15px;margin:0;max-width:750px}.hero .emoji{font-size:54px}.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0}.progress b{font-size:12px;color:#5e738b;margin-right:5px}.step{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid #cadced;background:white;font-weight:800;font-size:13px;color:#547193}.step.current{color:#1761b0;background:#e7f1ff;border-color:#3380cc}.step.done{color:#116b52;background:#dff6ec;border-color:#95dac0}.panel{background:white;border:1px solid #dce6f2;box-shadow:0 12px 34px #22517b12;border-radius:23px;padding:clamp(17px,4vw,30px);margin-bottom:35px}.badge{display:inline-block;background:#edf5ff;color:#235e9c;padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}
@media(max-width:720px){.hero{padding:18px 19px}.hero .emoji{display:none}.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.builder{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{padding:18px}.scene{padding:6px}.wheelSlot{border-radius:8px}}
@media(max-width:420px){.choicegrid{grid-template-columns:1fr}.answer{min-height:70px}.hero h1{font-size:27px}.progress{gap:6px}.step{width:33px;height:33px}.editpanel{padding:9px}.buildgrid,.wheelrow{gap:3px}.cell{border-radius:5px}.wheelSlot{border-radius:6px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Падение модели при испытании: поворот вокруг нижнего края. */
.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}
.tower-body{transition:transform .8s cubic-bezier(.30,.08,.76,1.16)}
@keyframes toppleTower{from{transform:rotate(0deg)}to{transform:rotate(63deg)}}
.topple-now{animation:toppleTower .85s cubic-bezier(.35,.05,.73,1.1) forwards}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}}</style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">Урок 12 · Механическая башня</div><h1>Зубчатый код</h1><p>Исследуй шестерни и помоги замедлить механизм башни. Стань Мастером передач!</p></div><div class="emoji" aria-hidden="true">⚙️</div></section><div id="app"></div></main><script>
'use strict';
const S={step:0,done:new Set(),a:16,b:16,turns:0,dir:1,seen:new Set(),checks:new Set(),note:'',passed:false};
const names=['Направление','Скорость','Механизм башни','Моя модель'];let frame=0,last=0,running=false;
const $=s=>document.querySelector(s);
function gear(n,c){let p=[];const r=n*4;for(let i=0;i<n;i++)for(const [f,k] of [[0,.94],[.2,.94],[.3,1.06],[.7,1.06],[.8,.94]]){let t=(i+f)*2*Math.PI/n;p.push(`${(Math.cos(t)*r*k).toFixed(3)},${(Math.sin(t)*r*k).toFixed(3)}`)}return `<polygon points="${p.join(' ')}" fill="${c}" stroke="#214b73" stroke-width="2"/><circle r="${r*.62}" fill="white" opacity=".3"/><path d="M0 0 L${r*.76} 0" stroke="#fff" stroke-width="6" stroke-linecap="round"/><circle r="8" fill="#234767"/>`}
function scene(){const x=170,y=170,r1=S.a*4,r2=S.b*4,dist=r1+r2;return `<div class="scene"><svg viewBox="0 0 620 340" role="img" aria-label="Сцепленные шестерни: синяя ведущая и оранжевая ведомая. Белые метки показывают обороты."><path d="M50 295 H565" stroke="#c0d3e8" stroke-width="10" stroke-linecap="round"/><g transform="translate(${x},${y})"><g id="g1">${gear(S.a,'#3988db')}</g></g><g transform="translate(${x+dist},${y})"><g id="g2">${gear(S.b,'#f4b442')}</g></g><text x="${x}" y="325" text-anchor="middle" fill="#225a9b" font-size="17" font-weight="800">Ведущая · ${S.a} зубов</text><text x="${x+dist}" y="325" text-anchor="middle" fill="#895b16" font-size="17" font-weight="800">Ведомая · ${S.b} зубов</text></svg></div><p class="small">Вид спереди. Белые метки помогают считать обороты. Синюю шестерню вращаешь ты; оранжевая получает движение.</p><div class="controls row"><button class="btn primary" id="turn">Повернуть на 1 оборот</button><button class="btn" id="reverse">Сменить направление</button><button class="btn soft" id="zero">Сбросить обороты</button></div><div class="two"><p class="readout">Ведущая: <span id="count1">0</span> об.<br><span id="d1"></span></p><p class="readout">Ведомая: <span id="count2">0</span> об.<br><span id="d2"></span></p></div>`}
function stop(){cancelAnimationFrame(frame);running=false;last=0}
function update(t=S.turns){$('#g1').setAttribute('transform',`rotate(${t*360*S.dir})`);const phase=180+180/S.b;$('#g2').setAttribute('transform',`rotate(${phase-t*360*S.dir*S.a/S.b})`);$('#count1').textContent=t.toLocaleString('ru',{maximumFractionDigits:2});$('#count2').textContent=(t*S.a/S.b).toLocaleString('ru',{maximumFractionDigits:2});$('#d1').textContent=S.dir===1?'↻ По часовой стрелке':'↺ Против часовой стрелки';$('#d2').textContent=S.dir===1?'↺ Против часовой стрелки':'↻ По часовой стрелке'}
function opts(v){return [8,16,24].map(n=>`<option ${n===v?'selected':''} value="${n}">${n} зубов</option>`).join('')}
function slots(){return `<div class="row"><label class="slot">Ведущая (синяя)<br><select id="a" aria-label="Зубья ведущей шестерни">${opts(S.a)}</select></label><label class="slot">Ведомая (оранжевая)<br><select id="b" aria-label="Зубья ведомой шестерни">${opts(S.b)}</select></label></div>`}
function feedback(text,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=text}
function render(){stop();const i=S.step;let h='';
if(i===0)h=`<span class="badge">Лаборатория 1</span><h2>Поверни движение</h2><p class="sub">Две одинаковые шестерни сцеплены зубьями. Сделай оборот, затем смени направление и повтори опыт. Следи за белыми метками.</p>${scene()}<p class="explain">Открой секрет: что происходит со второй шестернёй, когда первая меняет направление?</p>`;
if(i===1)h=`<span class="badge">Лаборатория 2</span><h2>Управляй скоростью</h2><p class="sub">Выбирай шестерни и вращай ведущую. Найди три режима: ведомая вращается быстрее, медленнее и с той же скоростью. Испытай каждый режим хотя бы одним полным оборотом.</p>${slots()}${scene()}<div id="discover" class="explain"></div>`;
if(i===2)h=`<span class="badge">Инженерная задача</span><h2>Замедли Механическую башню</h2><p class="sub">Механизм башни работает слишком быстро! Подбери две шестерни так, чтобы <b>3 оборота ведущей дали ровно 1 оборот ведомой</b>. Установи детали и проверь свою передачу.</p>${slots()}${scene()}<button class="btn primary" id="test">Испытать: 3 оборота</button><p class="small">Модель показывает идеальную передачу. В настоящей конструкции есть трение.</p>`;
if(i===3)h=`<span class="badge">Из экрана — в LEGO</span><h2>Построй свой редуктор</h2><p class="sub">Собери механизм из настоящих деталей: ведущая — 8 зубов, ведомая — 24 зуба. Закрепи оси на опоре, проверь сцепление и отметь начальное положение каждой шестерни.</p><div class="checklist">${['Я собрал две шестерни на отдельных осях: зубья сцеплены, оси свободно вращаются.','Я сделал 3 оборота ведущей и получил 1 оборот ведомой.','Я могу показать, что шестерни вращаются в противоположные стороны.'].map((s,i)=>`<label><input type="checkbox" data-check="${i}" ${S.checks.has(i)?'checked':''}>${s}</label>`).join('')}</div><p class="small">Если деталей пока нет, вернись к этому шагу после практической работы.</p><label for="note"><h3 style="margin-top:18px">Объясни секрет своей передачи</h3></label><textarea id="note" placeholder="Мой механизм замедляет движение, потому что…"></textarea><div class="explain">При замедлении увеличивается крутящий момент — способность поворачивать ось под нагрузкой. Шестерни помогают обменять скорость на усилие.</div><button class="btn primary" id="finish">Завершить работу</button><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Шаги задания"><b>Твои шаги</b>${names.map((s,j)=>`<button class="step ${i===j?'current':S.done.has(j)?'done':''}" data-step="${j}" title="${s}" aria-label="Шаг ${j+1}: ${s}" ${j>i&&!S.done.has(j-1)?'disabled':''}>${S.done.has(j)?'✓':j+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i>0?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div></section>`;
if(i<3){update();$('#turn').onclick=()=>animate(1);$('#reverse').onclick=()=>{stop();S.dir*=-1;S.turns=0;update()};$('#zero').onclick=()=>{stop();S.turns=0;update()};}
for(const id of ['a','b'])if($('#'+id))$('#'+id).onchange=e=>{S[id]=Number(e.target.value);S.turns=0;S.passed=false;S.done.delete(2);render()};
if(i===1)$('#discover').textContent='Испытано: '+['fast','slow','same'].filter(k=>S.seen.has(k)).map(k=>({fast:'быстрее',slow:'медленнее',same:'та же скорость'})[k]).join(' · ');
if($('#test'))$('#test').onclick=()=>{S.turns=0;animate(3,true)};
if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));
if(i===3){$('#note').value=S.note;$('#note').oninput=e=>S.note=e.target.value;document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{const k=Number(c.dataset.check);c.checked?S.checks.add(k):S.checks.delete(k)});$('#finish').onclick=()=>{if(S.checks.size<3||!S.note.trim()){feedback('Отметь выполненные действия и запиши свой вывод.',false);return}S.done.add(3);$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Мастер передач!</h2><p>Ты исследовал направление вращения, изменял скорость и построил редуктор для Механической башни.</p><button class="btn" id="again">Начать заново</button></div>';$('#again').onclick=()=>{S.done.clear();S.seen.clear();S.checks.clear();directions.clear();S.note='';go(0)}};}}
function go(i){S.step=i;S.turns=0;S.dir=1;if(i===0){S.a=16;S.b=16}render();window.scrollTo({top:0,behavior:'smooth'})}
function complete(){S.done.add(S.step);if($('#next'))$('#next').disabled=false}
function animate(count,test=false){stop();const start=S.turns,end=start+count;let began=null;running=true;$('#turn').disabled=true;if($('#test'))$('#test').disabled=true;function tick(ts){if(began===null)began=ts;let f=Math.min(1,(ts-began)/(count*1300));update(start+count*f);if(f<1){frame=requestAnimationFrame(tick);return}S.turns=end;running=false;$('#turn').disabled=false;if($('#test'))$('#test').disabled=false;observed(test)}frame=requestAnimationFrame(tick)}
const directions=new Set();function observed(test){if(S.step===0){directions.add(S.dir);if(directions.size===2){complete();feedback('Секрет открыт! Две сцепленные шестерни вращаются в противоположные стороны. Одинаковые шестерни делают одинаковое число оборотов.')}else feedback('Теперь смени направление и сделай ещё один оборот.');}
if(S.step===1){const k=S.a>S.b?'fast':S.a<S.b?'slow':'same';S.seen.add(k);$('#discover').textContent='Испытано: '+[...S.seen].map(k=>({fast:'быстрее',slow:'медленнее',same:'та же скорость'})[k]).join(' · ');feedback(S.a>S.b?'Маленькая ведомая вращается быстрее, но крутящий момент на её оси меньше.':S.a<S.b?'Большая ведомая вращается медленнее, зато крутящий момент на её оси больше.':'Одинаковые шестерни вращаются с одинаковой скоростью.');if(S.seen.size===3)complete();}
if(S.step===2&&test){let ok=S.b===3*S.a;feedback(ok?'Башня спасена! Ведущая сделала 3 оборота, ведомая — 1. Получилось замедление в 3 раза.':'Ведомая сделала '+(3*S.a/S.b).toLocaleString('ru',{maximumFractionDigits:2})+' об. Нужно ровно 1. Измени шестерни и повтори испытание.',ok);if(ok)complete();}}
render();
</script></body></html>
