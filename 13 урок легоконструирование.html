padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}
@media(max-width:720px){.hero{padding:18px 19px}.hero .emoji{display:none}.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.builder{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{padding:18px}.scene{padding:6px}.wheelSlot{border-radius:8px}}
@media(max-width:420px){.choicegrid{grid-template-columns:1fr}.answer{min-height:70px}.hero h1{font-size:27px}.progress{gap:6px}.step{width:33px;height:33px}.editpanel{padding:9px}.buildgrid,.wheelrow{gap:3px}.cell{border-radius:5px}.wheelSlot{border-radius:6px}}

.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}
.tower-body{transition:transform .8s cubic-bezier(.30,.08,.76,1.16)}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}}</style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">Урок 13 · Вершина стройки</div><h1>Секрет подъёма</h1><p>Исследуй Колесо-Помощник и построй башню-кран для LEGO-страны!</p></div><div class="emoji" aria-hidden="true">🏗️</div></section><div id="app"></div></main><script>
'use strict';
const S={step:0,done:new Set(),pull:0,mode:'direct',tried:new Set(),width:1,height:3,fixed:false,rope:false,tested:false,checks:new Set(),note:''};
const $=s=>document.querySelector(s);let frame=0;
const titles=['Колесо-Помощник','Два способа','Башня-кран','Моя постройка'];
function svg(p,block=true,builder=false){const h=builder?S.height:3,top=245-h*43,cy=top+28,cx=330,r=24,loadY=245-p*1.05,endY=cy+65+p*1.05;const w=builder?S.width*34:120;let a=`<svg viewBox="0 0 660 395" role="img" aria-label="${block?'Неподвижный блок: свободный конец верёвки движется вниз, груз вверх':'Подъём груза напрямую вверх'}"><path d="M50 350 H610" stroke="#bed0e1" stroke-width="9" stroke-linecap="round"/>`;
if(block){a+=`<rect x="${cx-w/2}" y="330" width="${w}" height="18" rx="5" fill="#397fce"/><rect x="${cx-9}" y="${top-15}" width="18" height="${345-top}" fill="#8eb7e0"/><path d="M${cx-w/2} 330 L${cx} ${top+50} L${cx+w/2} 330" fill="none" stroke="#427cb5" stroke-width="6"/><rect x="${cx-53}" y="${top-15}" width="106" height="13" rx="4" fill="#397fce"/>`;
if(!builder||S.fixed){a+=`<path d="M${cx} ${top} V${cy}" stroke="#385976" stroke-width="7"/><g transform="translate(${cx},${cy}) rotate(${-p*1.05/r*180/Math.PI})"><circle r="24" fill="#f8c04d" stroke="#a56f18" stroke-width="4"/><path d="M-19 0 H19 M0 -19 V19" stroke="#fff1bc" stroke-width="4"/></g><circle cx="${cx}" cy="${cy}" r="5" fill="#29455d"/>`;}
if(!builder||S.rope){a+=`<path d="M${cx-r} ${loadY} V${cy} A${r} ${r} 0 0 1 ${cx+r} ${cy} V${endY}" fill="none" stroke="#694b32" stroke-width="4"/><circle cx="${cx+r}" cy="${endY}" r="9" fill="#ea8457"/><text x="${cx+43}" y="${endY+5}" font-size="16" fill="#325674">↓ тяни вниз</text>`;}
}else{a+=`<path d="M306 ${loadY} V${loadY-48}" stroke="#694b32" stroke-width="4"/><text x="340" y="${loadY-30}" fill="#325674" font-size="16">↑ тяни вверх</text>`;}
if(!builder||S.rope){a+=`<rect x="281" y="${loadY}" width="50" height="46" rx="5" fill="#e89c5e" stroke="#99582e" stroke-width="2"/><path d="M289 ${loadY+11} H323" stroke="#f7d6b5" stroke-width="5"/><text x="306" y="${loadY+32}" font-size="13" text-anchor="middle" fill="#54391f">ГРУЗ</text>`;}
a+=`<text x="330" y="382" text-anchor="middle" fill="#4d6784" font-size="15">${block?'Блок закреплён на одном месте':'Тот же груз · без блока'}</text></svg>`;return a;}
function range(){return `<div class="controls"><label for="pull"><b>${S.mode==='direct'&&S.step===1?'Подтяни груз вверх':'Потяни свободный конец верёвки вниз'}</b></label><input id="pull" type="range" min="0" max="100" value="${S.pull}" style="width:100%;accent-color:#1a5cb2"><div class="row"><button class="btn soft" id="reset">Опустить груз</button><span id="distance" class="readout"></span></div></div>`;}
function mark(){S.done.add(S.step);if($('#next'))$('#next').disabled=false;}
function msg(t,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=t;}
function draw(){const block=S.step!==1||S.mode==='block';$('#scene').innerHTML=svg(S.pull,block,S.step===2);if($('#distance'))$('#distance').textContent='Подъём: '+S.pull+' см';}
function render(){cancelAnimationFrame(frame);let i=S.step,h='';
if(i===0)h=`<span class="badge">Исследование 1</span><h2>Вниз — и вверх!</h2><p class="sub">На Вершине Стройки нужно поднять груз. Передвигай ползунок: тяни свободный конец вниз и наблюдай за грузом и колесом. Подними груз на 60 см.</p><div class="scene" id="scene"></div>${range()}<div class="explain">Неподвижный блок — колесо с желобком для верёвки. Его ось закреплена на опоре. Колесо вращается, а его ось остаётся на месте.</div>`;
if(i===1)h=`<span class="badge">Исследование 2</span><h2>Сравни два способа</h2><p class="sub">Подними один и тот же груз сначала напрямую, затем через блок. В каждом опыте подними его минимум на 60 см. Следи, куда нужно тянуть верёвку.</p><div class="pills">${[['direct','Без блока'],['block','С блоком']].map(([v,t])=>`<button class="pill ${S.mode===v?'active':''}" data-mode="${v}" aria-pressed="${S.mode===v}">${t} ${S.tried.has(v)?'✓':''}</button>`).join('')}</div><div class="scene" id="scene"></div>${range()}<p class="explain">Груз тот же. Неподвижный блок меняет направление тяги, но не даёт выигрыша в силе. В идеальной модели для подъёма груза на 60 см нужно вытянуть 60 см верёвки.</p><p class="small">В настоящем механизме трение может немного увеличить требуемое усилие.</p>`;
if(i===2)h=`<span class="badge">Инженерная задача</span><h2>Собери башню-кран</h2><p class="sub">Подними груз на отметку 100 см. Для этой условной модели выбери широкое основание — 4 секции — и высоту 4 секции. Затем закрепи блок и проведи верёвку.</p><div class="two"><label class="slot">Основание<br><select id="width" aria-label="Ширина основания">${[1,2,3,4].map(n=>`<option value="${n}" ${S.width===n?'selected':''}>${n} секц.</option>`).join('')}</select></label><label class="slot">Высота<br><select id="height" aria-label="Высота башни">${[2,3,4].map(n=>`<option value="${n}" ${S.height===n?'selected':''}>${n} секц.</option>`).join('')}</select></label></div><div class="controls row"><button class="btn ${S.fixed?'primary':''}" id="fix" aria-pressed="${S.fixed}">${S.fixed?'✓ Блок закреплён':'Закрепить блок'}</button><button class="btn ${S.rope?'primary':''}" id="rope" aria-pressed="${S.rope}">${S.rope?'✓ Верёвка проведена':'Провести верёвку'}</button></div><div class="scene" id="scene"></div><button class="btn primary" id="test">Испытать кран</button><p class="small">Это схема сборки, а не расчёт устойчивости. Настоящую башню нужно испытать: устойчивость зависит также от груза, креплений и положения блока.</p>`;
if(i===3)h=`<span class="badge">Практическая работа</span><h2>Испытай настоящую башню</h2><p class="sub">Построй башню с широким основанием, надёжно закрепи неподвижный блок наверху и пропусти верёвку через его желобок. Прикрепи небольшой LEGO-груз. Тяни плавно, наблюдая за основанием.</p><div class="checklist">${['Я проверил крепления: блок держится, колесо и верёвка двигаются свободно.','Я тяну свободный конец вниз — груз поднимается вверх.','Моя башня остаётся устойчивой при подъёме груза.'].map((t,k)=>`<label><input type="checkbox" data-check="${k}" ${S.checks.has(k)?'checked':''}>${t}</label>`).join('')}</div><p class="small">Если деталей пока нет, выполни этот шаг после практической сборки.</p><label for="note"><h3 style="margin-top:18px">Что изменил блок?</h3></label><textarea id="note" placeholder="Мне стало удобнее поднимать груз, потому что…"></textarea><button class="btn primary" id="finish">Завершить работу</button><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Этапы задания"><b>Твои шаги</b>${titles.map((t,k)=>`<button class="step ${k===i?'current':S.done.has(k)?'done':''}" data-step="${k}" aria-label="${k+1}. ${t}" ${k>0&&!S.done.has(k-1)?'disabled':''}>${S.done.has(k)?'✓':k+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div></section>`;
if(i<3)draw();if($('#pull')){$('#pull').oninput=e=>{S.pull=Number(e.target.value);draw();observe()};$('#reset').onclick=()=>{S.pull=0;draw()};}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;S.pull=0;render()});
for(const key of ['width','height'])if($('#'+key))$('#'+key).onchange=e=>{S[key]=Number(e.target.value);S.pull=0;S.done.delete(2);render()};
for(const [id,key] of [['fix','fixed'],['rope','rope']])if($('#'+id))$('#'+id).onclick=()=>{S[key]=!S[key];S.pull=0;S.done.delete(2);render()};
if($('#test'))$('#test').onclick=test;
if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));
if(i===3){$('#note').value=S.note;$('#note').oninput=e=>S.note=e.target.value;document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{const k=Number(c.dataset.check);c.checked?S.checks.add(k):S.checks.delete(k)});$('#finish').onclick=()=>{if(S.checks.size<3||!S.note.trim()){msg('Отметь выполненные действия и запиши свой вывод.',false);return}mark();$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Мастер Высоты!</h2><p>Ты научился поднимать груз с помощью неподвижного блока. Блок меняет направление тяги: тянешь вниз — груз идёт вверх!</p><button class="btn" id="again">Начать заново</button></div>';$('#again').onclick=()=>{S.done.clear();S.tried.clear();S.checks.clear();S.note='';S.width=1;S.height=3;S.fixed=false;S.rope=false;S.mode='direct';go(0)}};}}
function observe(){if(S.pull<60)return;if(S.step===0){mark();msg('Секрет открыт! Ты тянешь вниз, груз поднимается вверх. Блок меняет направление тяги.')}if(S.step===1){S.tried.add(S.mode);if(S.tried.size===2){mark();msg('Оба способа испытаны! Без блока тянешь вверх, с блоком — вниз. Масса груза не изменилась.')}else msg('Первый опыт выполнен. Переключи способ подъёма и повтори опыт.');document.querySelectorAll('[data-mode]').forEach(b=>b.textContent=(b.dataset.mode==='direct'?'Без блока':'С блоком')+(S.tried.has(b.dataset.mode)?' ✓':''));}}
function test(){cancelAnimationFrame(frame);S.pull=0;draw();if(!S.fixed){msg('Сначала закрепи блок на вершине башни.',false);return}if(!S.rope){msg('Проведи верёвку через желобок блока.',false);return}if(S.width<4){msg('Расширь основание до 4 секций, чтобы выполнить условие этой модели.',false);return}if(S.height<4){msg('Для подъёма на нужную отметку увеличь высоту до 4 секций.',false);return}$('#test').disabled=true;let began=null;function tick(t){if(began===null)began=t;S.pull=Math.min(100,Math.round((t-began)/20));draw();if(S.pull<100)frame=requestAnimationFrame(tick);else{$('#test').disabled=false;mark();msg('Груз поднят на 100 см! Свободный конец опустился на 100 см. Башня-кран готова к практической проверке.')}}frame=requestAnimationFrame(tick);}
function go(i){S.step=i;S.pull=0;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
