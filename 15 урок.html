button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1586da;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,5vw,38px);line-height:1.12;margin:5px 0 9px}h2{font-size:clamp(22px,4vw,28px);line-height:1.23;margin:9px 0 12px}h3{font-size:17px;margin:0 0 10px}.wrap{width:min(1020px,calc(100% - 26px));margin:auto}.brand{display:flex;gap:11px;align-items:center;padding:18px 0}.logo{display:grid;grid-template-columns:repeat(2,20px);gap:3px;transform:rotate(-8deg)}.logo span{height:18px;border-radius:5px;background:#f7b73b;box-shadow:inset 0 -5px 0 #bd7823}.logo span:nth-child(2){background:#e85a5b;box-shadow:inset 0 -5px 0 #bb3c42}.logo span:nth-child(3){background:#357ed5;box-shadow:inset 0 -5px 0 #245bb1}.logo span:nth-child(4){background:#28a79b;box-shadow:inset 0 -5px 0 #138276}.caps{font-weight:850;letter-spacing:.11em;font-size:10px;color:#22609e;text-transform:uppercase}.brandname{font-size:19px;line-height:1.2;font-weight:900}.hero{background:linear-gradient(115deg,#195399,#267bb8);border-radius:21px;color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero .caps{color:#cae6ff}.hero p{color:#e7f4ff;font-size:15px;margin:0;max-width:750px}.hero .emoji{font-size:54px}.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0}.progress b{font-size:12px;color:#5e738b;margin-right:5px}.step{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid #cadced;background:white;font-weight:800;font-size:13px;color:#547193}.step.current{color:#1761b0;background:#e7f1ff;border-color:#3380cc}.step.done{color:#116b52;background:#dff6ec;border-color:#95dac0}.panel{background:white;border:1px solid #dce6f2;box-shadow:0 12px 34px #22517b12;border-radius:23px;padding:clamp(17px,4vw,30px);margin-bottom:35px}.badge{display:inline-block;background:#edf5ff;color:#235e9c;padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}
@media(max-width:720px){.hero{padding:18px 19px}.hero .emoji{display:none}.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.builder{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{padding:18px}.scene{padding:6px}.wheelSlot{border-radius:8px}}
@media(max-width:420px){.choicegrid{grid-template-columns:1fr}.answer{min-height:70px}.hero h1{font-size:27px}.progress{gap:6px}.step{width:33px;height:33px}.editpanel{padding:9px}.buildgrid,.wheelrow{gap:3px}.cell{border-radius:5px}.wheelSlot{border-radius:6px}}

/* Падение модели при испытании: поворот вокруг нижнего края. */
.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}
.tower-body{transition:transform .8s cubic-bezier(.30,.08,.76,1.16)}
@keyframes toppleTower{from{transform:rotate(0deg)}to{transform:rotate(63deg)}}
.topple-now{animation:toppleTower .85s cubic-bezier(.35,.05,.73,1.1) forwards}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}}</style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">Урок 15 · Долина рекордов</div><h1>Сила резинки</h1><p>Запаси энергию в резинке и создай машину, которая едет сама!</p></div><div class="emoji" aria-hidden="true">🏎️</div></section><div id="app"></div></main><script>
'use strict';
const S={step:0,done:new Set(),wind:0,turns:5,friction:'free',logs:[],axles:false,fixed:false,drive:false,body:'heavy',checks:new Set(),note:''};
const $=s=>document.querySelector(s);let frame=0,busy=false;const titles=['Запас энергии','Тест-драйв','Моя машина','Практика'];
function msg(t,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=t}function mark(){S.done.add(S.step);if($('#next'))$('#next').disabled=false}
function motor(n){let path='M170 160';const loops=Math.max(1,Math.round(n));for(let j=0;j<=100;j++){const x=170+j*3.1,y=160+Math.sin(j/100*loops*2*Math.PI)*11;path+=` L${x.toFixed(2)} ${y.toFixed(2)}`;}return `<svg viewBox="0 0 660 290" role="img" aria-label="Резинка между неподвижным креплением рамы и ведущей осью. При заводе она скручивается."><rect x="115" y="85" width="420" height="150" rx="15" fill="#e9f2fc" stroke="#3578be" stroke-width="8"/><rect x="155" y="135" width="22" height="50" rx="6" fill="#f0b44e"/><path d="M485 80 V240" stroke="#36526c" stroke-width="12"/><rect x="460" y="57" width="50" height="45" rx="10" fill="#294b6b"/><rect x="460" y="222" width="50" height="45" rx="10" fill="#294b6b"/><path d="${path}" stroke="#27a18c" stroke-width="6" fill="none"/><circle cx="485" cy="160" r="10" fill="#efa34c"/><text x="166" y="40" text-anchor="middle" font-size="16" fill="#345c80">Крепление на раме</text><text x="485" y="40" text-anchor="middle" font-size="16" fill="#345c80">Ведущая ось</text><text x="330" y="205" text-anchor="middle" font-size="15" fill="#28786a">${n>0?'Резинка скручена — энергия запасена':'Резинка раскручена'}</text></svg>`}
function road(d=0,spin=0){const x=85+d*13;let a=`<svg viewBox="0 0 660 315" role="img" aria-label="Машина на испытательной дорожке. Шкала пути в шипах LEGO."><rect x="345" y="110" width="220" height="100" rx="15" fill="#e6f6ec"/><text x="440" y="140" text-anchor="middle" font-size="15" fill="#27714c">Зона рекорда: 20+ шипов</text><path d="M40 240 H620" stroke="#9ab3cb" stroke-width="6"/><path d="M345 160 V250" stroke="#4d9e71" stroke-width="2" stroke-dasharray="5 5"/>`;
for(let i=0;i<=35;i+=5)a+=`<path d="M${85+i*13} 241 v9" stroke="#6b8da9"/><text x="${85+i*13}" y="270" font-size="14" text-anchor="middle" fill="#496c8b">${i}</text>`;
a+=`<g transform="translate(${x},0)"><rect x="-48" y="187" width="96" height="34" rx="6" fill="#3884d3"/><rect x="-17" y="165" width="40" height="25" rx="5" fill="#f0b94e"/><path d="M-10 164 v-6 h24 v6" fill="#f6ce7a"/>`;
for(const wx of [-30,30])a+=`<g transform="translate(${wx},225) rotate(${spin})"><circle r="16" fill="#294963"/><path d="M-11 0 H11 M0 -11 V11" stroke="#c2d5e5" stroke-width="3"/></g>`;
return a+'</g><text x="330" y="302" text-anchor="middle" font-size="14" fill="#4d6784">Путь от старта, в шипах</text></svg>'}
function energy(n,max=15){return `<div class="controls"><label for="energy">Запас энергии: <b id="remaining">${n.toLocaleString('ru',{maximumFractionDigits:1})}</b> об. завода</label><progress id="energy" max="${max}" value="${n}" style="width:100%;height:20px;accent-color:#28a58d"></progress></div>`}
function settings(){return `<div class="two controls"><label>Обороты завода <select id="turns">${[5,10,15].map(n=>`<option value="${n}" ${S.turns===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Колёса <select id="friction"><option value="free" ${S.friction==='free'?'selected':''}>Вращаются свободно</option><option value="rub" ${S.friction==='rub'?'selected':''}>Трутся о корпус</option></select></label></div><p class="small">Условная модель: одна и та же резинка и дорожка. Числа на экране не предсказывают пробег настоящей машины.</p>`}
function table(){return S.logs.length?`<div style="overflow-x:auto"><table style="width:100%;text-align:left;border-collapse:collapse"><thead><tr><th>Опыт</th><th>Завод</th><th>Колёса</th><th>Путь</th></tr></thead><tbody>${S.logs.map((r,i)=>`<tr><td>${i+1}</td><td>${r.n} об.</td><td>${r.f==='free'?'Свободно':'Трутся'}</td><td>${r.d} шип.</td></tr>`).join('')}</tbody></table></div>`:''}
function render(){cancelAnimationFrame(frame);busy=false;let i=S.step,h='';
if(i===0)h=`<span class="badge">Исследование 1</span><h2>Спрячь энергию в резинке</h2><p class="sub">Нажми «Завести» хотя бы два раза, затем отпусти ось. Наблюдай: резинка раскручивается, колёса вращаются и машина едет.</p><div class="scene" id="motor">${motor(S.wind)}</div>${energy(S.wind)}<div class="scene" id="scene">${road()}</div><div class="controls row"><button class="btn" id="wind">Завести: +5 оборотов</button><button class="btn primary" id="release">Отпустить ось</button></div><p class="explain">Когда ты заводишь машину, твоя работа запасается в упругой резинке. При раскручивании резинка вращает ведущую ось и колёса.</p>`;
if(i===1)h=`<span class="badge">Исследование 2</span><h2>Что помогает ехать дальше?</h2><p class="sub">Сравни два пробега с одинаковыми колёсами и разным заводом. Затем оставь число оборотов прежним и измени трение колёс. Для перехода выполни оба сравнения.</p>${settings()}<div class="scene" id="scene">${road()}</div>${energy(S.turns)}<button class="btn primary" id="run">Завести и запустить</button><h3 style="margin-top:18px">Журнал тест-драйва</h3><div id="logs">${table()}</div>`;
if(i===2)h=`<span class="badge">Инженерная задача</span><h2>Собери самодвижущуюся машину</h2><p class="sub">Собери лёгкую модель с двумя осями. Прикрепи один конец резинки к неподвижной точке рамы, другой — к ведущей оси. Добейся пробега не меньше 20 шипов.</p><div class="controls row">${[['axles','Две оси и колёса'],['fixed','Конец резинки на раме'],['drive','Другой конец на ведущей оси']].map(([k,t])=>`<button class="btn ${S[k]?'primary':''}" data-part="${k}" aria-pressed="${S[k]}">${S[k]?'✓ ':''}${t}</button>`).join('')}</div><label class="slot">Каркас <select id="body"><option value="heavy" ${S.body==='heavy'?'selected':''}>Тяжёлый</option><option value="light" ${S.body==='light'?'selected':''}>Лёгкий</option></select></label>${settings()}<div class="scene" id="scene">${road()}</div>${energy(S.turns)}<button class="btn primary" id="run">Испытать машину</button><p class="small">Для настоящей модели важны также сцепление колёс с поверхностью, масса, трение и свойства резинки.</p>`;
if(i===3)h=`<span class="badge">Практическая работа</span><h2>Установи свой рекорд</h2><p class="sub">Собери лёгкое шасси с двумя осями и колёсами. Закрепи резинку между рамой и ведущей осью. Заведи, поставь на ровную дорожку и отпусти без толчка. Измерь путь и попробуй улучшить результат.</p><p class="explain">Число безопасных оборотов зависит от резинки. Начинай с малого и согласуй завод с учителем. Не закручивай до предела; если резинка повреждена, замени её.</p><div class="checklist">${['Резинка закреплена на раме и ведущей оси, колёса не трутся о корпус.','Моя машина поехала сама после раскручивания резинки.','Я сравнил два пробега, изменив только один параметр.'].map((t,k)=>`<label><input type="checkbox" data-check="${k}" ${S.checks.has(k)?'checked':''}>${t}</label>`).join('')}</div><p class="small">Этот шаг выполни после работы с настоящими деталями.</p><label for="note"><h3 style="margin-top:18px">Запиши свой рекорд и объясни движение</h3></label><textarea id="note" placeholder="Машина проехала… Я улучшил… Энергия резинки…"></textarea><button class="btn primary" id="finish">Завершить работу</button><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Шаги задания"><b>Твои шаги</b>${titles.map((t,k)=>`<button class="step ${k===i?'current':S.done.has(k)?'done':''}" data-step="${k}" aria-label="${k+1}. ${t}" ${k>0&&!S.done.has(k-1)?'disabled':''}>${S.done.has(k)?'✓':k+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div></section>`;
if($('#wind'))$('#wind').onclick=()=>{S.wind=Math.min(15,S.wind+5);$('#motor').innerHTML=motor(S.wind);updateEnergy(S.wind);if(S.wind===15)msg('Для этой модели достаточно: 15 оборотов — предел завода.')};if($('#release'))$('#release').onclick=()=>{if(S.wind<10){msg('Заведи резинку хотя бы на 10 оборотов для этого опыта.',false);return}runCar(S.wind,'free')};
for(const k of ['turns','friction','body'])if($('#'+k))$('#'+k).onchange=e=>{S[k]=k==='turns'?Number(e.target.value):e.target.value;S.done.delete(2);render()};
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{S[b.dataset.part]=!S[b.dataset.part];S.done.delete(2);render()});if($('#run'))$('#run').onclick=()=>{if(i===2&&(!S.axles||!S.fixed||!S.drive)){msg('Установи две оси с колёсами и закрепи оба конца резинки.',false);return}runCar(S.turns,S.friction)};
if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));
if(i===3){$('#note').value=S.note;$('#note').oninput=e=>S.note=e.target.value;document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let k=Number(c.dataset.check);c.checked?S.checks.add(k):S.checks.delete(k)});$('#finish').onclick=()=>{if(S.checks.size<3||!S.note.trim()){msg('Отметь выполненные действия и запиши свой результат.',false);return}mark();$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Мастер Рекордов!</h2><p>Ты запас энергию в резинке, превратил её в движение и создал самодвижущуюся машину!</p><button class="btn" id="again">Начать заново</button></div>';$('#again').onclick=()=>{S.done.clear();S.logs=[];S.checks.clear();S.note='';S.wind=0;S.turns=5;S.friction='free';S.axles=false;S.fixed=false;S.drive=false;S.body='heavy';go(0)}};}}
function updateEnergy(n){$('#energy').value=n;$('#remaining').textContent=n.toLocaleString('ru',{maximumFractionDigits:1})}
function distance(n,f,light=true){return n*2*(f==='free'?1:.4)*(light?1:.6)}
function compared(){let wind=false,friction=false;for(const a of S.logs)for(const b of S.logs){if(a.f===b.f&&a.n!==b.n)wind=true;if(a.n===b.n&&a.f!==b.f)friction=true}return wind&&friction}
function lock(v){document.querySelectorAll('#wind,#release,#run,#turns,#friction,#body,[data-part]').forEach(b=>b.disabled=v)}
function runCar(n,f){if(busy)return;busy=true;lock(true);const i=S.step,d=distance(n,f,i!==2||S.body==='light');let began=null;function tick(ts){if(began===null)began=ts;const t=Math.min(1,(ts-began)/2400),travel=d*(1-(1-t)**2),left=n*(1-t);$('#scene').innerHTML=road(travel,travel*13/16*180/Math.PI);updateEnergy(left);if(i===0)$('#motor').innerHTML=motor(left);if(t<1){frame=requestAnimationFrame(tick);return}busy=false;lock(false);const label=d.toLocaleString('ru',{maximumFractionDigits:1});if(i===0){S.wind=0;mark();msg('Машина проехала сама! Резинка раскрутилась, передала движение оси и колёсам. Запас энергии уменьшился.')}else if(i===1){S.logs.push({n,f,d:Math.round(d*10)/10});$('#logs').innerHTML=table();if(compared()){mark();msg('Оба сравнения выполнены! В этой модели больший завод увеличил пробег, а трение колёс о корпус уменьшило его.')}else msg('Пробег: '+label+' шип. Продолжи сравнение, меняя один параметр за раз.');}else{const ok=S.body==='light'&&f==='free'&&d>=20;if(ok){mark();msg('Рекорд! Лёгкая машина проехала '+label+' шипов. Резинка передала энергию ведущей оси.')}else msg('Пробег: '+label+' шип. Проверь массу каркаса, свободное вращение колёс и число оборотов завода.',false);}}frame=requestAnimationFrame(tick)}
function go(i){S.step=i;S.wind=0;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
