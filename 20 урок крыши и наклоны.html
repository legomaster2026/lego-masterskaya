button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1586da;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,5vw,38px);line-height:1.12;margin:5px 0 9px}h2{font-size:clamp(22px,4vw,28px);line-height:1.23;margin:9px 0 12px}h3{font-size:17px;margin:0 0 10px}.wrap{width:min(1020px,calc(100% - 26px));margin:auto}.brand{display:flex;gap:11px;align-items:center;padding:18px 0}.logo{display:grid;grid-template-columns:repeat(2,20px);gap:3px;transform:rotate(-8deg)}.logo span{height:18px;border-radius:5px;background:#f7b73b;box-shadow:inset 0 -5px 0 #bd7823}.logo span:nth-child(2){background:#e85a5b;box-shadow:inset 0 -5px 0 #bb3c42}.logo span:nth-child(3){background:#357ed5;box-shadow:inset 0 -5px 0 #245bb1}.logo span:nth-child(4){background:#28a79b;box-shadow:inset 0 -5px 0 #138276}.caps{font-weight:850;letter-spacing:.11em;font-size:10px;color:#22609e;text-transform:uppercase}.brandname{font-size:19px;line-height:1.2;font-weight:900}.hero{background:linear-gradient(115deg,#195399,#267bb8);border-radius:21px;color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero .caps{color:#cae6ff}.hero p{color:#e7f4ff;font-size:15px;margin:0;max-width:750px}.hero .emoji{font-size:54px}.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0}.progress b{font-size:12px;color:#5e738b;margin-right:5px}.step{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid #cadced;background:white;font-weight:800;font-size:13px;color:#547193}.step.current{color:#1761b0;background:#e7f1ff;border-color:#3380cc}.step.done{color:#116b52;background:#dff6ec;border-color:#95dac0}.panel{background:white;border:1px solid #dce6f2;box-shadow:0 12px 34px #22517b12;border-radius:23px;padding:clamp(17px,4vw,30px);margin-bottom:35px}.badge{display:inline-block;background:#edf5ff;color:#235e9c;padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}

/* Падение модели при испытании: поворот вокруг нижнего края. */
.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}} .plan{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:500px;margin:18px auto}.tile{aspect-ratio:1;border:2px solid #ccdeed;border-radius:6px;background:#fff;min-width:0;font-size:clamp(12px,3vw,23px);padding:0}.tile.wall{background:#659bd0}.tile.window{background:#b4ecff;border-color:#1889ac}.tile.door{background:#f4cf8a}.tile.bed{background:#d8c6f3}.tile.table{background:#f2b78b}.tile.chair{background:#b1dfca}.tile.route{box-shadow:inset 0 0 0 4px #31ac7c}.sortrow{display:flex;gap:10px;flex-wrap:wrap;padding:12px;border-bottom:1px solid #dce6f2;align-items:center}.sortrow strong{min-width:150px} .scene svg{max-height:360px}input[type=range]{width:min(320px,70vw);accent-color:#226cb7}.record{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.record span{padding:9px 12px;border-radius:10px;background:#edf6ff}.roofgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}@media(max-width:500px){.roofgrid{grid-template-columns:1fr}}@media print{.hero .caps,.hero p{color:#143151}textarea{border:0}.small:last-child{display:none}} </style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">20 урок · Гора Снегопадов</div><h1>Крыши и наклоны</h1><p>Исследуй скаты, укрепи каркас и построй надёжную крышу для LEGO-дома!</p></div><div class="emoji" aria-hidden="true">🏔️</div></section>

<div id="app"></div></main><script>
'use strict';
const $=s=>document.querySelector(s),names=['Секрет наклона','Секрет треугольника','Собери крышу','Настоящий опыт'];
const S={step:0,done:new Set(),angle:0,slide:0,roofTests:new Set(),frame:'square',pushed:false,frameTests:new Set(),base:false,left:false,right:false,tie:false,cover:false,fixed:false,checks:new Set(),note:'',observation:''};let raf=0,busy=false;
function msg(t,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=t}
function mark(){S.done.add(S.step);if($('#next'))$('#next').disabled=false}
function svg(label,body){return `<svg viewBox="0 0 660 340" role="img" aria-label="${label}">${body}</svg>`}
function slope(){let a=S.angle*Math.PI/180,x=140,y=140,dx=Math.cos(a),dy=Math.sin(a),len=360;let t=S.slide;let bx=x+dx*(40+t*260)+dy*12,by=y+dy*(40+t*260)-dx*12;return svg('Наклонная поверхность: '+S.angle+' градусов',`<rect x="70" y="302" width="520" height="10" rx="5" fill="#c7d8e7"/><path d="M${x} ${y+9} L${x+len*dx} ${y+len*dy+9} L${x} ${y+len*dy+9} Z" fill="#e2edf8"/><line x1="${x}" y1="${y}" x2="${x+len*dx}" y2="${y+len*dy}" stroke="#bc6952" stroke-width="14" stroke-linecap="round"/><circle id="snow" cx="${bx}" cy="${by}" r="12" fill="#fff" stroke="#3387bd" stroke-width="3"/><text x="330" y="45" text-anchor="middle" fill="#285579" font-size="20" font-weight="800">${S.angle===0?'Ровная поверхность':'Наклонный скат'}</text><text x="330" y="78" text-anchor="middle" fill="#54718e" font-size="15">${S.angle}° · один и тот же гладкий шарик</text>`)}
function frame(){const shift=S.pushed&&S.frame==='square'?75:0;let b=`<path d="M140 285 H520" stroke="#b6ccdf" stroke-width="10"/>`;if(S.frame==='triangle')b+='<path d="M180 280 L330 100 L480 280 Z" fill="#e5f3fa" stroke="#357bb7" stroke-width="14" stroke-linejoin="round"/>';else{b+=`<path d="M180 280 L${180+shift} 100 L${480+shift} 100 L480 280 Z" fill="#e5f3fa" stroke="#357bb7" stroke-width="14" stroke-linejoin="round"/>`;if(S.frame==='brace')b+='<path d="M180 280 L480 100" stroke="#e7ad47" stroke-width="12"/>';}let points=S.frame==='triangle'?[[180,280],[330,100],[480,280]]:[[180,280],[180+shift,100],[480+shift,100],[480,280]];b+=points.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="white" stroke="#285b8d" stroke-width="3"/>`).join('');if(S.pushed)b+='<path d="M75 140 H145 M125 125 L145 140 L125 155" stroke="#d57655" stroke-width="6" fill="none"/>';return svg('Каркас: '+({square:'четырёхугольник',triangle:'треугольник',brace:'четырёхугольник с диагональю'}[S.frame]),b)}
function house(){let b='<rect x="185" y="180" width="290" height="135" fill="#f2d38a" stroke="#b78c48" stroke-width="4"/><rect x="220" y="215" width="50" height="45" fill="#abdef0" stroke="#4383b4" stroke-width="4"/><rect x="385" y="215" width="50" height="45" fill="#abdef0" stroke="#4383b4" stroke-width="4"/><rect x="306" y="237" width="48" height="78" fill="#b58b68"/>';
if(S.cover)b+='<path d="M155 180 L330 45 L505 180" fill="#e9a394" stroke="#c76f5a" stroke-width="16" stroke-linejoin="round"/>';
if(S.base)b+='<path d="M185 180 H475" stroke="#427db3" stroke-width="12"/>';
if(S.left)b+='<path d="M185 180 L330 60" stroke="#427db3" stroke-width="12"/>';
if(S.right)b+='<path d="M330 60 L475 180" stroke="#427db3" stroke-width="12"/>';
if(S.tie)b+='<path d="M240 135 H420" stroke="#edbb51" stroke-width="10"/>';
if(S.fixed)b+=[185,475].map(x=>`<rect x="${x-11}" y="169" width="22" height="23" rx="3" fill="#6fae88" stroke="#3b7e57" stroke-width="3"/>`).join('');
return svg('Дом и выбранные элементы крыши',b)}
function render(){cancelAnimationFrame(raf);busy=false;let i=S.step,h='';
if(i===0)h=`<span class="badge">Гора Снегопадов · Секрет Наклона</span><h2>Что меняется при наклоне?</h2><p class="sub">Эксперт по Крышам просит проверить поверхность для крыши LEGO-дома. Сначала испытай ровную поверхность (0°). Затем выбери наклон от 10° и повтори опыт.</p><div class="controls"><label for="angle"><b>Наклон: <span id="degrees">${S.angle}</span>°</b></label><div class="row"><input id="angle" type="range" min="0" max="25" step="5" value="${S.angle}"><button class="btn primary" id="roll">Отпустить шарик</button></div></div><div class="scene">${slope()}</div><div class="record"><span>${S.roofTests.has('flat')?'✓':'○'} Ровная поверхность</span><span>${S.roofTests.has('slope')?'✓':'○'} Наклонная поверхность</span></div><div class="explain">Скат — наклонная часть крыши. Гладкому шарику наклон помогает двигаться вниз. На настоящей крыше снег может задерживаться: это зависит от материала, трения и других условий.</div><p class="small">Экранный опыт — условная модель гладкой поверхности. Он помогает сравнить наклоны.</p>`;
if(i===1)h=`<span class="badge">Лаборатория каркасов</span><h2>Зачем крыше треугольник?</h2><p class="sub">В этих каркасах балки сохраняют длину, а соединения могут поворачиваться. Выбери каждый из трёх вариантов и проверь лёгким боковым нажимом.</p><div class="pills">${[['square','Четырёхугольник'],['triangle','Треугольник'],['brace','Добавить диагональ']].map(([k,t])=>`<button class="pill ${S.frame===k?'active':''}" data-frame="${k}" aria-pressed="${S.frame===k}">${t}</button>`).join('')}</div><div class="scene">${frame()}</div><button class="btn primary" id="push">Нажать сбоку</button><p class="small">Проверено ${S.frameTests.size} из 3 каркасов.</p><div class="explain">Четырёхугольник с подвижными углами может перекоситься. Диагональ делит его на треугольники и помогает сохранить форму. Прочность настоящего каркаса зависит также от деталей и соединений.</div>`;
if(i===2)h=`<span class="badge">Конструкторская мастерская</span><h2>Надёжная двускатная крыша</h2><p class="sub">Собери замкнутый треугольный каркас из основания и двух стропил. Установи покрытие и закрепи крышу на стенах. Поперечную связь можно добавить для усиления.</p><div class="roofgrid">${[['base','Основание каркаса'],['left','Левое стропило'],['right','Правое стропило'],['tie','Поперечная связь'],['cover','Покрытие двух скатов'],['fixed','Крепления к стенам']].map(([k,t])=>`<button class="pill ${S[k]?'active':''}" data-part="${k}" aria-pressed="${S[k]}">${S[k]?'✓ ':''}${t}</button>`).join('')}</div><div class="scene">${house()}</div><div class="explain">Стропила поддерживают скаты. Основание замыкает треугольник. Покрытие закрывает дом сверху, а крепления соединяют крышу со стенами.</div><button class="btn primary" id="buildCheck">Проверить конструкцию</button>`;
if(i===3)h=`<span class="badge">Практическая работа с LEGO</span><h2>Проведи настоящий опыт</h2><p class="sub">Используй дом из урока 19 или собери опоры. Построй двускатную крышу. Если наклонных деталей нет, используй подходящие балки и пластины либо ступенчатую кладку.</p><div class="explain"><b>Сравни честно:</b> возьми один и тот же небольшой шарик и одну пластину. Сначала положи её ровно, затем приподними один край. Отпускай шарик с одинакового места, без толчка. Лови его в коробочку. На ступенчатой крыше шарик может застревать — это тоже наблюдение.</div><div class="checklist">${['Я сравнил ровную и наклонную поверхность с одним и тем же предметом.','В моей крыше есть замкнутый треугольный каркас или другое прочное соединение скатов.','Крыша закреплена на стенах, покрытие закрывает дом сверху.','Я аккуратно проверил соединения и улучшил слабое место.'].map((t,k)=>`<label><input type="checkbox" data-check="${k}" ${S.checks.has(k)?'checked':''}>${t}</label>`).join('')}</div><h3 style="margin-top:20px">Как прошёл опыт?</h3><label for="observation" class="small">Опиши поведение предмета на ровной и наклонной поверхности.</label><textarea id="observation" placeholder="На ровной поверхности… На наклонной…"></textarea><h3 style="margin-top:18px">Мой Секрет Наклона</h3><label for="note" class="small">Что делает твою крышу прочной? Что ты улучшил?</label><textarea id="note" placeholder="Каркас моей крыши… Я улучшил…"></textarea><button class="btn primary" id="finish">Завершить урок</button><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Этапы урока"><b>Твои шаги</b>${names.map((t,k)=>`<button class="step ${i===k?'current':S.done.has(k)?'done':''}" data-step="${k}" aria-label="${k+1}. ${t}" ${k>0&&!S.done.has(k-1)?'disabled':''}>${S.done.has(k)?'✓':k+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div><p class="small" style="margin-top:20px">Покажи выполненную работу учителю. После обновления страницы прогресс сбрасывается.</p></section>`;
if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(+b.dataset.step));
if($('#angle'))$('#angle').oninput=e=>{cancelAnimationFrame(raf);busy=false;S.angle=+e.target.value;S.slide=0;$('#degrees').textContent=S.angle;$('.scene').innerHTML=slope();$('#roll').disabled=false;$('#feedback').textContent=''};
if($('#roll'))$('#roll').onclick=roll;
document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>{S.frame=b.dataset.frame;S.pushed=false;render()});
if($('#push'))$('#push').onclick=()=>{S.pushed=true;S.frameTests.add(S.frame);if(S.frameTests.size===3)mark();render();msg(S.frame==='square'?'Каркас перекосился: углы повернулись, длины балок сохранились. Сравни с треугольником.':S.frame==='triangle'?'Треугольник сохранил форму при условном боковом нажиме.':'Диагональ образовала два треугольника и не дала каркасу перекоситься.')};
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{const k=b.dataset.part;S[k]=!S[k];S.done.delete(2);S.done.delete(3);render()});if($('#buildCheck'))$('#buildCheck').onclick=checkBuild;
if(i===3){for(const k of ['note','observation']){$('#'+k).value=S[k];$('#'+k).oninput=e=>{S[k]=e.target.value;S.done.delete(3);$('#award').innerHTML=''}}document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{c.checked?S.checks.add(+c.dataset.check):S.checks.delete(+c.dataset.check);S.done.delete(3);$('#award').innerHTML=''});$('#finish').onclick=()=>{if(S.checks.size<4||!S.note.trim()||!S.observation.trim()){msg('Отметь выполненные действия и запиши наблюдение и вывод.',false);return}mark();msg('Урок завершён! Покажи свою крышу и расскажи о результатах опыта.');$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Мастер Геометрии!</h2><p>Ты исследовал наклон, сравнил каркасы и построил крышу. Секрет Наклона открыт!</p><button class="btn" id="print">Распечатать результат</button></div>';$('#print').onclick=()=>window.print()}}}
function checkBuild(){const required=[['base','основание'],['left','левое стропило'],['right','правое стропило'],['cover','покрытие скатов'],['fixed','крепления к стенам']];const missing=required.filter(([k])=>!S[k]);if(missing.length){msg('Добавь: '+missing.map(v=>v[1]).join(', ')+'.',false);return}mark();msg('Крыша готова: каркас замкнут, два ската покрыты и закреплены на стенах.'+(S.tie?' Поперечная связь добавлена.':''))}
function roll(){if(busy)return;S.slide=0;const a=S.angle;if(a===0){S.roofTests.add('flat');if(S.roofTests.size===2)mark();render();msg('На ровной поверхности шарик остался на месте. Теперь приподними край: выбери наклон от 10°.');return}busy=true;$('#roll').disabled=true;let start;const duration=2400-55*a;function tick(ts){if(start===undefined)start=ts;const f=Math.min(1,(ts-start)/duration);S.slide=f*f;$('.scene').innerHTML=slope();if(f<1){raf=requestAnimationFrame(tick);return}busy=false;if(a>=10)S.roofTests.add('slope');if(S.roofTests.size===2)mark();render();msg(a<10?'Шарик движется по небольшому наклону. Для сравнения попробуй наклон от 10°.':'На наклонной поверхности шарик переместился вниз по скату.'+(S.roofTests.size===2?' Оба опыта выполнены!':' Теперь сравни с ровной поверхностью: 0°.'))}raf=requestAnimationFrame(tick)}
function go(i){S.step=i;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
