:root{--ink:#143151;--muted:#4d6784;--blue:#1a5cb2;--line:#d7e4f2;--sky:#eef6ff;--bg:#f4f7fd;--ok:#128164;--warn:#ad6d20}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top left,#dfedff 0,transparent 38%),radial-gradient(ellipse at top right,#fff0d5 0,transparent 40%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #1586da;outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.5}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(27px,5vw,38px);line-height:1.12;margin:5px 0 9px}h2{font-size:clamp(22px,4vw,28px);line-height:1.23;margin:9px 0 12px}h3{font-size:17px;margin:0 0 10px}.wrap{width:min(1020px,calc(100% - 26px));margin:auto}.brand{display:flex;gap:11px;align-items:center;padding:18px 0}.logo{display:grid;grid-template-columns:repeat(2,20px);gap:3px;transform:rotate(-8deg)}.logo span{height:18px;border-radius:5px;background:#f7b73b;box-shadow:inset 0 -5px 0 #bd7823}.logo span:nth-child(2){background:#e85a5b;box-shadow:inset 0 -5px 0 #bb3c42}.logo span:nth-child(3){background:#357ed5;box-shadow:inset 0 -5px 0 #245bb1}.logo span:nth-child(4){background:#28a79b;box-shadow:inset 0 -5px 0 #138276}.caps{font-weight:850;letter-spacing:.11em;font-size:10px;color:#22609e;text-transform:uppercase}.brandname{font-size:19px;line-height:1.2;font-weight:900}.hero{background:linear-gradient(115deg,#195399,#267bb8);border-radius:21px;color:white;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero .caps{color:#cae6ff}.hero p{color:#e7f4ff;font-size:15px;margin:0;max-width:750px}.hero .emoji{font-size:54px}.progress{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0}.progress b{font-size:12px;color:#5e738b;margin-right:5px}.step{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;border:1px solid #cadced;background:white;font-weight:800;font-size:13px;color:#547193}.step.current{color:#1761b0;background:#e7f1ff;border-color:#3380cc}.step.done{color:#116b52;background:#dff6ec;border-color:#95dac0}.panel{background:white;border:1px solid #dce6f2;box-shadow:0 12px 34px #22517b12;border-radius:23px;padding:clamp(17px,4vw,30px);margin-bottom:35px}.badge{display:inline-block;background:#edf5ff;color:#235e9c;padding:6px 11px;border-radius:25px;font-size:12px;font-weight:850}.sub{color:var(--muted);font-size:15px;max-width:850px}.scene{background:#f5f9ff;border:1px solid #dae7f5;border-radius:17px;padding:12px;overflow:hidden}.scene svg{width:100%;height:auto;max-height:360px;display:block;margin:auto}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.controls{background:#f5f9ff;border:1px solid #deebf7;border-radius:15px;padding:13px;margin:13px 0}.flex{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.btn{border:2px solid #1b5aaf;border-radius:12px;padding:10px 16px;background:white;color:#1b5aaf;font-weight:850;font-size:14px}.btn.primary{background:#1b5aaf;color:white}.btn.soft{border-color:#cddff0;color:#345f84}.btn:hover:not(:disabled){filter:brightness(.965)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.feedback{border-radius:12px;padding:12px 14px;margin-top:16px;font-weight:650;font-size:14px}.feedback.good{background:#e7f7ee;border-left:5px solid #159367;color:#176847}.feedback.bad{background:#fff7e9;border-left:5px solid #da9f4c;color:#86551b}.legend{font-size:12px;color:#5a7892;margin:7px 0 0}.choicegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}.answer{min-height:105px;border:2px solid #dce7f3;border-radius:15px;background:#fbfdff;color:#183753;display:flex;flex-direction:column;gap:9px;align-items:flex-start;text-align:left;padding:13px;font-weight:750}.answer.selected{border-color:#1c6bc0;background:#eaf3ff}.answer .letter{display:grid;place-items:center;width:28px;height:28px;background:#eaf0f8;border-radius:8px;color:#295d95;font-size:13px}.answer svg{width:100%;height:auto;max-height:165px}.answer:hover{border-color:#82b0e1}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:2px solid #d7e5f3;background:white;border-radius:11px;padding:9px 14px;color:#315d84;font-size:14px;font-weight:800}.pill.active{border-color:#1a63ba;background:#e7f2ff;color:#154f9c}.pills label{display:flex;gap:7px;align-items:center}.numbox{font-weight:900;color:#195aab}.explain{padding:12px 14px;background:#f0f7ff;border-left:4px solid #77a7db;border-radius:11px;color:#335778;font-size:14px;margin:13px 0}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.editing{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.editing .pill{font-size:13px}.builder{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:13px;margin-top:12px}.editpanel{background:#f5f9ff;border:1px solid #dbe9f5;border-radius:17px;padding:14px}.buildgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:0 auto}.cell{aspect-ratio:1;border:1.5px solid #cfdfea;border-radius:7px;background:#fff;color:#235b93;display:grid;place-items:center;padding:1px;min-width:0;font-size:clamp(13px,3vw,18px);font-weight:900}.cell.brick{background:#86b7f1;border-color:#3979c8;box-shadow:inset 0 -6px #3376c4}.cell.cargo{background:#efa36a;border-color:#be6e39;box-shadow:inset 0 -6px #d17d43}.wheelrow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:430px;margin:7px auto 2px}.wheelSlot{border:1.5px dashed #bbd0e4;border-radius:12px;background:#fff;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(19px,3.6vw,27px);color:#b8c9d8}.wheelSlot.has{border-style:solid;background:#dcecf9;color:#1a4c83}.wheellabel{text-align:center;color:#526e8a;font-weight:750;font-size:12px;margin:9px 0 0}.stat{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;color:#4d6984;font-size:12px;margin-top:10px}.checklist{display:grid;gap:9px}.checklist label{border:1px solid #dbe6f1;border-radius:12px;background:#fbfdff;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;font-weight:650;font-size:14px}.checklist input{width:21px;height:21px;flex-shrink:0;accent-color:#1c70be}.complete{background:linear-gradient(130deg,#e8fbf0,#eef7ff);border:1px solid #b6decf;border-radius:22px;padding:clamp(23px,5vw,36px);margin-top:18px}.complete p{max-width:700px;color:#3e6571}.award{font-size:46px;margin-bottom:5px}.small{font-size:12px;color:var(--muted)}.direction{font-size:12px;color:#476b90;font-weight:700;text-align:center}.hidden{display:none!important} .footer{height:24px}
@media(max-width:720px){.hero{padding:18px 19px}.hero .emoji{display:none}.choicegrid{grid-template-columns:repeat(2,minmax(0,1fr))}.builder{grid-template-columns:1fr}.two{grid-template-columns:1fr}.panel{padding:18px}.scene{padding:6px}.wheelSlot{border-radius:8px}}
@media(max-width:420px){.choicegrid{grid-template-columns:1fr}.answer{min-height:70px}.hero h1{font-size:27px}.progress{gap:6px}.step{width:33px;height:33px}.editpanel{padding:9px}.buildgrid,.wheelrow{gap:3px}.cell{border-radius:5px}.wheelSlot{border-radius:6px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Падение модели при испытании: поворот вокруг нижнего края. */
.tower-platform,.tower-body{transform-box:view-box;transition:transform .55s ease}
.tower-body{transition:transform .8s cubic-bezier(.30,.08,.76,1.16)}
@keyframes toppleTower{from{transform:rotate(0deg)}to{transform:rotate(63deg)}}
.topple-now{animation:toppleTower .85s cubic-bezier(.35,.05,.73,1.1) forwards}

select{font:inherit;padding:9px;border:2px solid #cddff0;border-radius:10px;background:white;color:#143151} .readout{font-variant-numeric:tabular-nums;font-weight:800}.scene svg{max-height:310px}textarea{width:100%;min-height:85px;font:inherit;border:2px solid #cddff0;border-radius:12px;padding:12px} .slot{flex:1;min-width:190px;padding:15px;border:2px dashed #bdd4ed;border-radius:16px}.gearlabel{text-align:center;font-size:14px;font-weight:800} .progress button{cursor:pointer} @media print{button,.progress,.controls{display:none}.hero{color:#143151;background:white}.panel{box-shadow:none}}</style></head><body><header class="wrap brand"><span class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></span><div><div class="caps">Интерактивный курс · 2 класс</div><div class="brandname">LEGO-Мастерская</div></div></header><main class="wrap"><section class="hero"><div><div class="caps">18 урок · Замок секретов</div><h1>Сейф для сокровищ</h1><p>Открой секрет прочных стен и построй контейнер, который сохранит твой секрет!</p></div><div class="emoji" aria-hidden="true">💎</div></section><div id="app"></div></main><script>
'use strict';
const S={step:0,done:new Set(),pattern:'columns',wallTests:new Set(),wallResult:false,walls:new Set(),floor:false,lid:false,closed:false,treasure:false,corners:false,tests:new Set(),checks:new Set(),note:''};
const $=s=>document.querySelector(s);const names=['Секрет кладки','Собери сейф','Испытания','Мой контейнер'];let frame=0,busy=false;
function msg(t,ok=true){$('#feedback').className='feedback '+(ok?'good':'bad');$('#feedback').textContent=t}function mark(){S.done.add(S.step);if($('#next'))$('#next').disabled=false}
function brick(x,y,w){let a=`<rect x="${x}" y="${y}" width="${w-2}" height="38" rx="4" fill="#4b94d7" stroke="#245f9a" stroke-width="2"/>`;for(let j=0;j<Math.floor(w/28);j++)a+=`<rect x="${x+8+j*28}" y="${y-5}" width="15" height="7" rx="2" fill="#a3d4f2"/>`;return a;}
function wall(){let a='<svg viewBox="0 0 660 340" role="img" aria-label="Стена из кирпичиков: '+(S.pattern==='columns'?'вертикальные швы совпадают':'верхние кирпичи перекрывают швы нижних')+'"><path d="M110 285 H550" stroke="#b6ccdf" stroke-width="8"/>';
for(let row=0;row<4;row++){const offset=S.pattern==='bond'&&row%2===1;const widths=offset?[40,80,80,80,40]:[80,80,80,80];let x=170;for(const w of widths){const broken=S.wallResult&&S.pattern==='columns';a+=`<g transform="translate(${broken?(x<330?-18:18):0},${broken?10:0})">${brick(x,240-row*43,w)}</g>`;x+=w;}}
if(S.pattern==='columns')a+='<path d="M250 102 V278 M330 102 V278 M410 102 V278" stroke="#d5694d" stroke-width="2" stroke-dasharray="5 4"/>';
return a+'<text x="330" y="38" text-anchor="middle" font-size="17" font-weight="750" fill="#345c80">'+(S.pattern==='bond'?'Швы перекрыты соседними рядами':'Длинные вертикальные швы')+'</text><text x="330" y="323" text-anchor="middle" font-size="14" fill="#526f89">'+(S.wallResult?(S.pattern==='bond'?'Кирпичи связывают соседние участки стены.':'Соседние столбики разошлись в условном испытании.'):'Сравни, как кирпичики соединяют соседние ряды.')+'</text></svg>'}
function box(){const wallFill=S.pattern==='bond'?'#4389ca':'#80a7ce';let a='<svg viewBox="0 0 660 425" role="img" aria-label="Сборка контейнера: четыре стены, дно, съёмная крышка и сокровище"><g id="safe">';
if(S.walls.has(0))a+=`<path d="M180 240 L340 160 V70 L180 150 Z" fill="${wallFill}" stroke="#285e91" stroke-width="3"/>`;
if(S.walls.has(1))a+=`<path d="M340 160 L500 240 V150 L340 70 Z" fill="#5c9bd3" stroke="#285e91" stroke-width="3"/>`;
a+=S.floor?'<path d="M180 240 L340 160 L500 240 L340 320 Z" fill="#efbf5b" stroke="#a67c29" stroke-width="3"/>':'<path d="M180 240 L340 160 L500 240 L340 320 Z" fill="#eff5fa" stroke="#a3b9cd" stroke-width="2" stroke-dasharray="6 5"/>';
if(S.treasure&&(!S.lid||!S.closed))a+='<path d="M309 213 L340 201 L371 213 L340 250 Z" fill="#36bba9" stroke="#137d79" stroke-width="3"/><path d="M309 213 H371 M325 207 L340 250 L355 207" fill="none" stroke="#d2fff1" stroke-width="2"/>';
if(S.walls.has(2))a+=`<path d="M180 240 L340 320 V230 L180 150 Z" fill="${wallFill}" fill-opacity=".65" stroke="#285e91" stroke-width="3"/>`;
if(S.walls.has(3))a+=`<path d="M340 320 L500 240 V150 L340 230 Z" fill="#397db9" fill-opacity=".65" stroke="#285e91" stroke-width="3"/>`;
if(S.corners)for(const [x,y] of [[180,150],[340,70],[500,150],[340,230]])a+=`<rect x="${x-8}" y="${y-7}" width="16" height="18" rx="3" fill="#ecb84f" stroke="#ad7d28"/>`;
if(S.lid){const dy=S.closed?0:-46;a+=`<g transform="translate(0,${dy})"><path d="M180 150 L340 70 L500 150 L340 230 Z" fill="#8c72c4" stroke="#57418c" stroke-width="3"/><path d="M180 150 L340 230 L500 150 V162 L340 242 L180 162 Z" fill="#6c52a2" stroke="#57418c" stroke-width="2"/><path d="M310 143 L340 128 L370 143 L340 158 Z" fill="#d3c2f2"/></g>`;}
a+='</g><text x="330" y="373" text-anchor="middle" font-size="15" fill="#426889">'+(S.lid?(S.closed?'Крышка закрыта':'Крышка снята'):'Крышка пока не установлена')+'</text><text x="330" y="402" text-anchor="middle" font-size="12" fill="#56748e">Передние стены полупрозрачны, чтобы было видно внутреннее пространство.</text></svg>';return a;}
function settings(){return `<div class="controls row"><label for="pattern">Способ кладки <select id="pattern"><option value="columns" ${S.pattern==='columns'?'selected':''}>Столбиками</option><option value="bond" ${S.pattern==='bond'?'selected':''}>С перекрытием швов</option></select></label></div>`}
function invalidate(){S.tests.clear();S.done.delete(2)}
function render(){cancelAnimationFrame(frame);busy=false;const i=S.step;let h='';
if(i===0)h=`<span class="badge">Исследование 1</span><h2>Почему стена держится?</h2><p class="sub">Испытай стену из отдельных столбиков. Затем выбери кладку с перекрытием швов и повтори испытание.</p>${settings()}<div class="scene">${wall()}</div><button class="btn primary" id="wallTest">Проверить боковое соединение</button><p class="small">Испытано: ${S.wallTests.has('columns')?'✓':'○'} столбиками · ${S.wallTests.has('bond')?'✓':'○'} с перекрытием</p><p class="explain">Верхний кирпичик должен соединять соседние нижние кирпичики. Перекрытие швов связывает стену в одно целое.</p><p class="small">Это условная схема соединений, а не расчёт допустимой нагрузки на LEGO-детали.</p>`;
if(i===1)h=`<span class="badge">Конструкторская мастерская</span><h2>Создай место для сокровища</h2><p class="sub">Установи дно, четыре стены и съёмную крышку. Положи сокровище внутрь и закрой сейф. Укрепи стены перекрытием швов и свяжи углы.</p>${settings()}<div class="controls pills">${[['floor','Дно'],['lid','Крышка'],['corners','Связанные углы']].map(([k,t])=>`<button class="pill ${S[k]?'active':''}" data-part="${k}" aria-pressed="${S[k]}">${S[k]?'✓ ':''}${t}</button>`).join('')}</div><div class="pills">${['Задняя левая','Задняя правая','Передняя левая','Передняя правая'].map((t,k)=>`<button class="pill ${S.walls.has(k)?'active':''}" data-wall="${k}" aria-pressed="${S.walls.has(k)}">${S.walls.has(k)?'✓ ':''}${t} стена</button>`).join('')}</div><div class="scene">${box()}</div><div class="controls row"><button class="btn" id="treasure">${S.treasure?'Вынуть сокровище':'Положить сокровище'}</button><button class="btn" id="lidToggle" ${!S.lid?'disabled':''}>${S.closed?'Открыть крышку':'Закрыть крышку'}</button><button class="btn primary" id="volume">Проверить закрытый контейнер</button></div>`;
if(i===2)h=`<span class="badge">Испытательная площадка</span><h2>Сохранится ли секрет?</h2><p class="sub">Проведи две проверки: переноску и прочность соединений. Затем открой крышку и достань сокровище. Если найдёшь слабое место, вернись в мастерскую и улучши сейф.</p><div class="scene">${box()}</div><div class="controls row"><button class="btn primary" id="carry">Проверить переноску</button><button class="btn" id="strength">Проверить соединения</button><button class="btn" id="openTest">Открыть и достать секрет</button></div><p class="small">Успешные проверки: ${[['carry','переноска'],['strength','соединения'],['open','открывание']].map(([k,t])=>(S.tests.has(k)?'✓ ':'○ ')+t).join(' · ')}</p><p class="explain">Прочный контейнер удерживает предмет внутри и позволяет открыть крышку. Дно, стены, углы и крышка работают вместе.</p><p class="small">Экранная проверка оценивает выбранные соединения. Прочность настоящей постройки проверь отдельно.</p>`;
if(i===3)h=`<span class="badge">Практическая работа</span><h2>Построй настоящий сейф</h2><p class="sub">Собери дно и четыре стены с перекрытием швов. Свяжи углы соседними рядами кирпичиков. Сделай крышку из скреплённых пластин; гладкие плитки можно добавить сверху. Проверь, что крышку удобно снимать и она удерживается при переноске.</p><div class="checklist">${['Швы стен перекрыты, углы связаны, дно закреплено.','Сокровище осталось внутри при аккуратной переноске.','Я снял крышку, достал предмет и снова закрыл контейнер.'].map((t,k)=>`<label><input type="checkbox" data-check="${k}" ${S.checks.has(k)?'checked':''}>${t}</label>`).join('')}</div><p class="explain">Найди слабое место, улучши его и повтори проверку. Дополнительно можно сравнить массу двух сейфов на весах из 17-го урока.</p><p class="small">Этот этап выполни после сборки из настоящих деталей.</p><label for="note"><h3 style="margin-top:18px">Что помогло сохранить сокровище?</h3></label><textarea id="note" placeholder="Мой контейнер прочный, потому что… Я улучшил…"></textarea><button class="btn primary" id="finish">Завершить работу</button><div id="award"></div>`;
$('#app').innerHTML=`<nav class="progress" aria-label="Этапы задания"><b>Твои шаги</b>${names.map((t,k)=>`<button class="step ${k===i?'current':S.done.has(k)?'done':''}" data-step="${k}" aria-label="${k+1}. ${t}" ${k>0&&!S.done.has(k-1)?'disabled':''}>${S.done.has(k)?'✓':k+1}</button>`).join('')}</nav><section class="panel">${h}<div id="feedback" role="status" aria-live="polite"></div><div class="actions">${i?'<button class="btn soft" id="back">Назад</button>':''}${i<3?`<button class="btn primary" id="next" ${S.done.has(i)?'':'disabled'}>Дальше →</button>`:''}</div></section>`;
if($('#pattern'))$('#pattern').onchange=e=>{S.pattern=e.target.value;S.wallResult=false;invalidate();render()};if($('#wallTest'))$('#wallTest').onclick=()=>{S.wallTests.add(S.pattern);S.wallResult=true;if(S.wallTests.size===2)mark();render();msg(S.pattern==='bond'?'Перекрытие швов связало соседние участки стены.':'Столбики не связаны соседними кирпичиками. Сравни с перекрытием швов.',S.pattern==='bond')};
document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{if(S.closed){msg('Сначала открой крышку, чтобы изменить конструкцию.',false);return}const k=b.dataset.part;S[k]=!S[k];if(k==='lid')S.closed=false;invalidate();S.done.delete(1);render()});document.querySelectorAll('[data-wall]').forEach(b=>b.onclick=()=>{if(S.closed){msg('Сначала открой крышку.',false);return}const k=Number(b.dataset.wall);S.walls.has(k)?S.walls.delete(k):S.walls.add(k);invalidate();S.done.delete(1);render()});
if($('#treasure'))$('#treasure').onclick=()=>{if(S.closed){msg('Открой крышку, чтобы положить или вынуть сокровище.',false);return}S.treasure=!S.treasure;invalidate();S.done.delete(1);render()};if($('#lidToggle'))$('#lidToggle').onclick=()=>{S.closed=!S.closed;invalidate();S.done.delete(1);render()};if($('#volume'))$('#volume').onclick=volume;
if($('#carry'))$('#carry').onclick=()=>test('carry');if($('#strength'))$('#strength').onclick=()=>test('strength');if($('#openTest'))$('#openTest').onclick=()=>test('open');
if($('#next'))$('#next').onclick=()=>go(i+1);if($('#back'))$('#back').onclick=()=>go(i-1);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>go(Number(b.dataset.step)));
if(i===3){$('#note').value=S.note;$('#note').oninput=e=>S.note=e.target.value;document.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{const k=Number(c.dataset.check);c.checked?S.checks.add(k):S.checks.delete(k)});$('#finish').onclick=()=>{if(S.checks.size<3||!S.note.trim()){msg('Отметь выполненные действия и запиши свой вывод.',false);return}mark();$('#award').innerHTML='<div class="complete"><div class="award">🏅</div><h2>Ты — Мастер Хранения!</h2><p>Ты соединил стены, создал закрытый контейнер и проверил сохранность сокровища.</p><button class="btn" id="again">Начать заново</button></div>';$('#again').onclick=()=>{S.done.clear();S.wallTests.clear();S.walls.clear();S.tests.clear();S.checks.clear();S.pattern='columns';S.wallResult=false;S.floor=false;S.lid=false;S.closed=false;S.treasure=false;S.corners=false;S.note='';go(0)}};}}
function completeBox(){return S.floor&&S.walls.size===4&&S.lid}
function volume(){if(!completeBox()){msg('Для закрытого контейнера нужны дно, четыре стены и крышка.',false);return}if(!S.treasure){msg('Положи сокровище внутрь.',false);return}if(!S.closed){msg('Закрой крышку.',false);return}mark();msg('Закрытый контейнер готов! Сокровище находится внутри. Теперь проверь прочность.')}
function passed(k,text){S.tests.add(k);if(S.tests.size===3)mark();render();msg(S.tests.size===3?'Все проверки пройдены! Секрет сохранён, крышка открывается, соединения усилены.':text)}
function test(k){if(busy)return;if(!completeBox()){msg('Вернись в мастерскую: нужны дно, четыре стены и крышка.',false);return}if(k==='strength'){if(S.pattern!=='bond'||!S.corners){msg('Слабое место: '+(S.pattern!=='bond'?'швы стоят друг над другом. Выбери перекрытие швов.':'углы не связаны. Свяжи соседние стены.')+' Вернись в мастерскую.',false);return}passed(k,'Соединения проверены: швы перекрыты, стены связаны в углах.');return}
if(k==='open'){if(!S.tests.has('carry')||!S.tests.has('strength')){msg('Сначала проверь переноску и соединения, пока сейф закрыт.',false);return}if(!S.treasure){msg('Внутри пока нет сокровища.',false);return}S.closed=false;S.treasure=false;passed(k,'Крышка открывается, сокровище можно достать.');return}
if(!S.closed||!S.treasure){msg('Для переноски положи сокровище внутрь и закрой крышку в мастерской.',false);return}busy=true;document.querySelectorAll('#carry,#strength,#openTest').forEach(b=>b.disabled=true);let start=null;function tick(ts){if(start===null)start=ts;const f=Math.min(1,(ts-start)/1100);$('#safe').setAttribute('transform',`translate(${Math.sin(f*Math.PI*4)*5},${-Math.sin(f*Math.PI)*20})`);if(f<1){frame=requestAnimationFrame(tick);return}busy=false;passed(k,'Сейф перенесён: дно, четыре стены и крышка удержали сокровище внутри.')}frame=requestAnimationFrame(tick)}
function go(i){S.step=i;render();window.scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
