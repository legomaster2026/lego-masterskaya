const S={lesson:0,task:0,chosen:new Set(),feedback:'',kind:'',passed:new Set(),selected:'red',grid:[],project:new Set(),optionOrder:null};
// Перемешиваем варианты, сохраняя их исходные индексы для проверки.
// При повторной проверке или выборе варианта порядок не меняется.
function randomInt(max){
  if(globalThis.crypto && crypto.getRandomValues){
    const v=new Uint32Array(1);crypto.getRandomValues(v);
    return Math.floor(v[0]/4294967296*max);
  }
  return Math.floor(Math.random()*max);
}
function shuffleIndices(task){
  const make=()=>{const out=task.options.map((_,i)=>i);for(let i=out.length-1;i>0;i--){const j=randomInt(i+1);[out[i],out[j]]=[out[j],out[i]]}return out};
  if(task.type!=='multi'||task.options.length<5)return make();
  const correct=new Set(task.answer);
  for(let attempt=0;attempt<60;attempt++){
    const order=make(),pattern=order.map(i=>correct.has(i)?1:0).join('');
    // Не допускаем группу из трёх правильных подряд и явный шаблон 101010/010101.
    if(!pattern.includes('111')&&!pattern.includes('000')&&!/^([01])(?:\1)?$/.test(pattern)&&pattern!=='101010'&&pattern!=='010101')return order;
  }
  return make();
}
function getOptionOrder(t){if(!S.optionOrder)S.optionOrder=shuffleIndices(t);return S.optionOrder;}

const $=s=>document.querySelector(s);const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function brick(r,c,kind='brick'){let s=`<div class="studVisual"><div class="brick-demo ${kind==='plate'?'plate':''}" style="--bc:${kind==='plate'?'#3279cd':'#e65550'};grid-template-columns:repeat(${c},minmax(0,1fr))" role="img" aria-label="${kind==='plate'?'пластина':'кирпичик'} ${r} на ${c}">`;for(let i=0;i<r*c;i++)s+='<span class="stud"></span>';return s+'</div></div>'}
function wall(mode){let rects='';if(mode==='stack'){for(let y=0;y<3;y++){for(let x=0;x<3;x++)rects+=`<rect x="${19+x*62}" y="${10+y*27}" width="58" height="23" rx="3" fill="${y%2?'#ee8271':'#e9564f'}" stroke="#ac493c"/>`}}else{const rows=[[19,81,143],[50,112],[19,81,143]];rows.forEach((xs,y)=>xs.forEach(x=>{rects+=`<rect x="${x}" y="${10+y*27}" width="58" height="23" rx="3" fill="${y%2?'#ee8271':'#e9564f'}" stroke="#ac493c"/>`}))}return `<svg class="diagram" viewBox="0 0 225 104" aria-label="схема кирпичной стены" role="img">${rects}</svg>`}
function brace(mode){return `<svg class="diagram" viewBox="0 0 215 110" aria-label="опора ${mode==='diagonal'?'с диагональю':'без диагонали'}" role="img"><g fill="none" stroke="#236bb2" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M38 91V20H176V91H38"/>${mode==='diagonal'?'<path stroke="#e39a31" d="M42 88 L174 22"/>':''}</g></svg>`}
function tile(c,clickable=false,edge=false,left=false,id=-1){const filled=c&&c!=='none';const label=filled?({red:'красная',blue:'синяя',yellow:'жёлтая'}[c]||'цветная'):'пустая';return clickable?`<button type="button" class="tile ${filled?'filled':''} ${edge?'edge':''}" style="--fill:${colors[c]||colors['']}" data-cell="${id}" aria-label="Клетка ${id+1}: ${label}"></button>`:`<div class="tile ${filled?'filled':''} ${left?'mirror-left':''}" style="--fill:${colors[c]||colors['']}" aria-label="${label} клетка" role="img"></div>`}
function miniPattern(pattern){return `<div class="board" style="grid-template-columns:repeat(5,1fr);width:min(100%,160px);gap:2px">${pattern.map(v=>tile(v)).join('')}</div>`}
function optHTML(o){if(typeof o==='string')return `<span>${safe(o)}</span>`;if(o.visual==='brick'||o.visual==='plate')return brick(o.rows,o.cols,o.visual);if(o.visual==='wall')return wall(o.mode);if(o.visual==='brace')return brace(o.mode);if(o.visual==='miniPattern')return miniPattern(o.pattern);return ''}
// Пока опубликованы пять уроков. Не показываем детям недоступные занятия или служебные статусы.
const availableLessons = 5;
function showHome(){
  S.lesson=0;
  const blocksHTML=blocks
    .filter(b=>b.from<availableLessons)
    .map(b=>{
      const visible=syllabus.slice(b.from,Math.min(b.to,availableLessons));
      const lessons=visible.map(([name],i)=>{
        const num=b.from+i+1,meta=brief[num];
        return `<button type="button" class="lesson" data-lesson="${num}"><div class="lesson-top"><span class="num">${num}</span></div><h3>${meta?meta.title:safe(name)}</h3><p>${meta?meta.desc:''}</p><div class="lesson-foot"><strong>Открыть →</strong></div></button>`;
      }).join('');
      return `<section class="section"><div class="sectionHead"><h2>${b.title}</h2></div><div class="lessonGrid">${lessons}</div></section>`;
    }).join('');
  $('#app').innerHTML=`<div class="intro"><div><div class="smallcaps">Путешествие по LEGO-стране</div><h1>Учись строить, думать и исследовать</h1><p>Выбирай мастерскую, решай интерактивные задачи и проверяй себя. Для практических проектов понадобится настоящий конструктор.</p></div></div>${blocksHTML}`;
  document.querySelectorAll('[data-lesson]').forEach(b=>b.addEventListener('click',()=>start(Number(b.dataset.lesson))));
  window.scrollTo({top:0,behavior:'instant'});
}
function clearTask(){S.chosen=new Set();S.feedback='';S.kind='';S.selected='red';S.grid=[];S.project=new Set();S.optionOrder=null}
function start(n){if(n<1||n>5)return;for(const key of [...S.passed])if(key.startsWith(n+':'))S.passed.delete(key);S.lesson=n;S.task=0;clearTask();showTask();window.scrollTo({top:0,behavior:'instant'});}
function getTask(){return missions[S.lesson][S.task]}
function taskKey(){return S.lesson+':'+S.task}
function fb(){return S.feedback?`<div role="status" class="feedback ${S.kind==='ok'?'ok':S.kind==='bad'?'bad':''}">${safe(S.feedback)}</div>`:''}
function navButtons(end=false){let out='<div class="actions">';if(S.passed.has(taskKey()))out+=`<button class="btn main" data-next="1">${end?'Завершить урок →':'Следующее задание →'}</button>`;else if(getTask().type==='project')out+=`<button class="btn main" data-self="1" ${S.project.size===getTask().steps.length?'':'disabled'}>Я выполнил практику ✓</button><button class="btn alt" data-skip="1">Практика позже</button>`;else out+='<button class="btn main" data-check="1">Проверить ответ</button>';out+='</div>';return out}
function showTask(){const m=brief[S.lesson],arr=missions[S.lesson],t=getTask(),complete=S.passed.has(taskKey());let content='';if(t.type==='choice'){content=`<div class="answerGrid ${t.options.some(o=>typeof o==='object')?'visualoptions':''}">${getOptionOrder(t).map((i,position)=>`<button type="button" class="answer ${typeof t.options[i]==='object'?'visual':''} ${S.chosen.has(i)?'selected':''}" data-option="${i}" aria-pressed="${S.chosen.has(i)}"><span class="letter">${String.fromCharCode(1040+position)}</span>${optHTML(t.options[i])}</button>`).join('')}</div>`}else if(t.type==='multi'){content=`<div class="answerGrid">${getOptionOrder(t).map((i,position)=>`<label class="checkchoice ${S.chosen.has(i)?'selected':''}"><input type="checkbox" data-multi="${i}" ${S.chosen.has(i)?'checked':''}><span class="letter">${String.fromCharCode(1040+position)}</span><span>${safe(t.options[i])}</span></label>`).join('')}</div>`}else if(t.type==='mosaic'){content=showMosaic(t)}else if(t.type==='mirror'){content=showMirror(t)}else if(t.type==='project'){content=`<div class="project"><div class="projectchecks">${t.steps.map((s,i)=>`<label><input type="checkbox" data-project="${i}" ${S.project.has(i)?'checked':''}><span>${safe(s)}</span></label>`).join('')}</div><div class="projectIdea"><h3>🔧 Настоящая сборка</h3><p>Отмечай действия по мере выполнения. Когда закончишь, покажи свою постройку учителю.</p><strong>Подумай и ответь:</strong><p>${safe(t.reflect)}</p></div></div>`}const extra=t.type==='mosaic'||t.type==='mirror'?'<p class="legend">Выбирай цвет и нажимай клетки. Серые клетки должны остаться пустыми.</p>':'';const taskProgress=arr.map((x,i)=>`<span class="stepbubble ${i===S.task?'on':S.passed.has(S.lesson+':'+i)?'done':''}">${S.passed.has(S.lesson+':'+i)?'✓ ':''}${i+1}</span>`).join('');$('#app').innerHTML=`<button class="back" id="goHome">← Все уроки</button><div class="banner"><div><div class="smallcaps">Урок ${S.lesson} · ${S.task+1} из ${arr.length} заданий</div><h1>${safe(m.title)}</h1><p>${safe(m.goal)}</p></div><div style="font-size:40px" aria-hidden="true">🧱</div></div><div class="mapline">${taskProgress}</div><section class="task"><span class="badge">Испытание ${S.task+1} / ${arr.length}</span><h2>${safe(t.name)}</h2><p class="sub">${safe(t.ask)}</p>${content}${extra}${navButtons(S.task===arr.length-1)}${fb()}</section>`;$('#goHome').addEventListener('click',showHome);document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{S.chosen=new Set([Number(b.dataset.option)]);S.feedback='';S.kind='';showTask()}));document.querySelectorAll('[data-multi]').forEach(b=>b.addEventListener('change',()=>{const i=Number(b.dataset.multi);b.checked?S.chosen.add(i):S.chosen.delete(i);S.feedback='';S.kind='';showTask()}));document.querySelectorAll('[data-project]').forEach(b=>b.addEventListener('change',()=>{const i=Number(b.dataset.project);b.checked?S.project.add(i):S.project.delete(i);S.feedback='';showTask()}));document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{S.selected=b.dataset.color;showTask()}));document.querySelectorAll('[data-cell]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.cell);S.grid[i]=S.selected==='erase'?'':S.selected;S.feedback='';S.kind='';showTask()}));document.querySelectorAll('#wipeGrid').forEach(b=>b.addEventListener('click',()=>{S.grid=Array(S.grid.length).fill('');S.feedback='';S.kind='';showTask()}));document.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',check));document.querySelectorAll('[data-next]').forEach(b=>b.addEventListener('click',next));document.querySelectorAll('[data-self]').forEach(b=>b.addEventListener('click',()=>{if(S.project.size===t.steps.length){S.passed.add(taskKey());S.feedback='Практика отмечена. Покажи модель учителю и расскажи, как ты её построил.';S.kind='ok';showTask()}}));document.querySelectorAll('[data-skip]').forEach(b=>b.addEventListener('click',()=>{S.passed.add(taskKey());S.feedback='Практическая часть пропущена. К ней можно вернуться, открыв урок заново.';S.kind='bad';showTask()}));}
function palette(){return `<div class="palette">${[['red','Красный'],['blue','Синий'],['yellow','Жёлтый'],['erase','Стереть']].map(([c,label])=>`<button class="colorOpt ${S.selected===c?'active':''}" data-color="${c}" aria-pressed="${S.selected===c}"><span class="chip" style="--fill:${colors[c]||colors['']}"></span>${label}</button>`).join('')}</div>`}
function showMosaic(t){if(S.grid.length===0)S.grid=Array(16).fill('');return `<div class="gridPair"><div class="widget"><h3>Схема художника</h3><div class="board" style="grid-template-columns:repeat(4,1fr)">${t.target.map(c=>tile(c)).join('')}</div></div><div class="widget"><h3>Твой орнамент</h3><div class="board" style="grid-template-columns:repeat(4,1fr)">${S.grid.map((c,i)=>tile(c,true,false,false,i)).join('')}</div></div></div>${palette()}<button class="btn alt" id="wipeGrid" type="button" >Очистить узор</button>`}
function showMirror(t){if(S.grid.length===0)S.grid=Array(15).fill('');let cells='';for(let r=0;r<5;r++){for(let c=0;c<3;c++)cells+=tile(t.left[r*3+c],false,false,true);for(let c=0;c<3;c++)cells+=tile(S.grid[r*3+c],true,c===0,false,r*3+c)}return `<div class="widget"><h3>Левая половина дана, правую собери сам</h3><div class="board mirror" style="grid-template-columns:repeat(6,minmax(0,1fr))">${cells}</div><p class="legend" style="text-align:center">← Образец &nbsp;│&nbsp; Твоя половина →</p></div>${palette()}<button class="btn alt" id="wipeGrid" type="button" >Очистить правую половину</button>`}
function check(){const t=getTask();let correct=false,ex='';if(t.type==='choice'){correct=S.chosen.size===1&&S.chosen.has(t.answer);if(!correct)ex='Пока неверно. Рассмотри варианты ещё раз и попробуй снова.'}else if(t.type==='multi'){correct=S.chosen.size===t.answer.length&&t.answer.every(x=>S.chosen.has(x));if(!correct)ex='Попробуй ещё раз: отмечены ли все безопасные действия и не отмечены ли опасные?'}else if(t.type==='mosaic'){const n=S.grid.filter((x,i)=>x===t.target[i]).length;correct=n===t.target.length;if(!correct)ex=`Правильно расположены ${n} из 16 деталей. Сравни каждую клетку со схемой.`;else ex='Орнамент повторён без ошибок! Ты умеешь читать графическую схему.'}else if(t.type==='mirror'){const goal=[];for(let r=0;r<5;r++)goal.push(...t.left.slice(r*3,r*3+3).reverse());const n=S.grid.filter((x,i)=>x===goal[i]).length;correct=n===15;if(!correct)ex=`Совпадает ${n} из 15 клеток. Каждая деталь справа должна быть на таком же расстоянии от оси, как слева.`;else ex='Фигура симметрична! Обе половины стали зеркальными.'}if(correct){S.passed.add(taskKey());S.feedback=ex||t.explain||'Верно!';S.kind='ok'}else{S.feedback=ex;S.kind='bad'}showTask()}
function next(){if(S.task<missions[S.lesson].length-1){S.task++;clearTask();showTask();window.scrollTo({top:0,behavior:'smooth'})}else showComplete()}
function showComplete(){const n=S.lesson;$('#app').innerHTML=`<button class="back" id="goHome">← Все уроки</button><div class="complete"><div class="award" aria-hidden="true">🏆</div><div class="smallcaps">Миссия завершена</div><h2>Отличная работа, LEGO-мастер!</h2><p>Ты прошёл тему «${safe(brief[n].title)}». Вспомни самый интересный момент и расскажи, чему научился.</p><div class="actions">${n<5?`<button class="btn main" id="nextLesson">Следующий урок →</button>`:''}<button class="btn alt" id="again">Пройти этот урок ещё раз</button><button class="btn alt" id="all">К списку уроков</button></div></div>`;$('#goHome').addEventListener('click',showHome);$('#all').addEventListener('click',showHome);$('#again').addEventListener('click',()=>start(n));if(n<5)$('#nextLesson').addEventListener('click',()=>start(n+1));window.scrollTo({top:0,behavior:'smooth'})}
showHome();
</script>
