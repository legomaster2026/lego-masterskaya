<main class="wrap" style="padding-bottom:45px"><section class="hero"><div><div class="overline">Урок 9 · В гостях у дизайнера коробок</div><h1>Секрет плоской коробки</h1><p>Ты узнаешь, как из плоских квадратов получается куб, и попробуешь построить свою развёртку.</p></div><span class="heroIcon" aria-hidden="true">📦</span></section><div id="app"></div></main>
<script>
'use strict';
const $=s=>document.querySelector(s);
const BASE_NET=[[1,0],[0,1],[1,1],[2,1],[3,1],[1,2]];
const BAD_ONE=[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]];
const BAD_TWO=[[0,0],[1,0],[2,0],[0,1],[1,1],[1,2]];
const BASE_FIVE=[[2,1],[1,2],[2,2],[3,2],[2,3]];
const COLORS=['#ffb94d','#4da5e5','#347dcc','#2f9f9c','#ea6f66','#92c68b'];
const S={step:0,done:new Set(),choice:null,order:null,feedback:'',correct:false,fold:0,animation:null,placed:null,editor:new Set(),pair:[],checklist:new Set(),showFold:false};
const taskTitles=['Открой секрет коробки','Какая развёртка подойдёт?','Добавь недостающую грань','Создай свою развёртку','Найди противоположные грани','Собери настоящую коробку'];
const v=(x,y,z)=>[x,y,z],add=(a,b)=>a.map((t,i)=>t+b[i]),sub=(a,b)=>a.map((t,i)=>t-b[i]),mul=(a,k)=>a.map(t=>t*k),neg=a=>mul(a,-1),key=(x,y)=>`${x},${y}`;
function seededShuffle(n){let a=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){let j;try{let x=new Uint32Array(1);crypto.getRandomValues(x);j=x[0]%(i+1)}catch(e){j=Math.floor(Math.random()*(i+1))} [a[j],a[i]]=[a[i],a[j]]}return a}
function analyzed(cells){const set=new Set(cells.map(c=>key(...c)));if(set.size!==6)return {valid:false,why:'count',faces:new Map()};const start=[...cells][0];const faces=new Map([[key(...start),{p:start,R:v(1,0,0),D:v(0,1,0),N:v(0,0,1)}]]);const queue=[start];let consistent=true;for(let idx=0;idx<queue.length;idx++){const [x,y]=queue[idx],p=faces.get(key(x,y));for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=key(x+dx,y+dy);if(!set.has(k))continue;let R,D,N;if(dx===1){R=neg(p.N);D=p.D;N=p.R}else if(dx===-1){R=p.N;D=p.D;N=neg(p.R)}else if(dy===1){R=p.R;D=neg(p.N);N=p.D}else{R=p.R;D=p.N;N=neg(p.D)};if(!faces.has(k)){faces.set(k,{p:[x+dx,y+dy],R,D,N,parent:key(x,y),dx,dy});queue.push([x+dx,y+dy])}else{const old=faces.get(k);if(old.R.some((q,i)=>q!==R[i])||old.N.some((q,i)=>q!==N[i]))consistent=false}}}if(faces.size!==6)return {valid:false,why:'apart',faces};if(!consistent||new Set([...faces.values()].map(f=>f.N.join(','))).size!==6)return {valid:false,why:'overlap',faces};return {valid:true,why:'',faces}}
function polyCoords(cells,W=240,H=170,labels=false){const xs=cells.map(c=>c[0]),ys=cells.map(c=>c[1]),minX=Math.min(...xs),minY=Math.min(...ys),nx=Math.max(...xs)-minX+1,ny=Math.max(...ys)-minY+1,s=Math.min((W-20)/nx,(H-20)/ny),x0=(W-nx*s)/2,y0=(H-ny*s)/2;let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Шесть квадратов, соединённых сторонами">`;cells.forEach(([x,y],i)=>{let X=x0+(x-minX)*s,Y=y0+(y-minY)*s;svg+=`<rect x="${(X+1).toFixed(1)}" y="${(Y+1).toFixed(1)}" width="${(s-2).toFixed(1)}" height="${(s-2).toFixed(1)}" rx="${Math.min(5,s*.12)}" fill="#92baf1" stroke="#1f65b1" stroke-width="1.6"/>`;if(labels)svg+=`<text x="${X+s/2}" y="${Y+s/2+5}" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">${'АБВГДЕ'[i]}</text>`});return svg+'</svg>'}
function fade(a,b,t){return a*(1-t)+b*t}
// Реальное геометрическое складывание шести граней куба вокруг общих рёбер.
function foldModel(cells,progress,W=520,H=340,label=false){let t=Math.max(0,Math.min(1,progress)),angle=t*Math.PI/2,C=Math.cos(angle),Q=Math.sin(angle),pos=new Map(),visited=new Set(),cellSet=new Set(cells.map(c=>key(...c))),first=cells[0];const normX=Math.min(...cells.map(c=>c[0])),normY=Math.min(...cells.map(c=>c[1]));pos.set(key(...first),{P:v(first[0]-normX,first[1]-normY,0),R:v(1,0,0),D:v(0,1,0),N:v(0,0,1)});const q=[first];for(let i=0;i<q.length;i++){const [x,y]=q[i],p=pos.get(key(x,y));for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const k=key(x+dx,y+dy);if(!cellSet.has(k)||pos.has(k))continue;let R,D,N,P;if(dx===1){R=sub(mul(p.R,C),mul(p.N,Q));D=p.D;N=add(mul(p.R,Q),mul(p.N,C));P=add(p.P,p.R)}else if(dx===-1){R=add(mul(p.R,C),mul(p.N,Q));D=p.D;N=sub(mul(p.N,C),mul(p.R,Q));P=sub(p.P,R)}else if(dy===1){R=p.R;D=sub(mul(p.D,C),mul(p.N,Q));N=add(mul(p.D,Q),mul(p.N,C));P=add(p.P,p.D)}else{R=p.R;D=add(mul(p.D,C),mul(p.N,Q));N=sub(mul(p.N,C),mul(p.D,Q));P=sub(p.P,D)}pos.set(k,{P,R,D,N});q.push([x+dx,y+dy])}}
 const yaw=t*.55,pitch=t*.31;const camera=[Math.sin(yaw)*Math.cos(pitch),-Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)];function point3(f,u,w){return add(f.P,add(mul(f.R,u),mul(f.D,w)))}function project(a){return [Math.cos(yaw)*a[0]-Math.sin(yaw)*a[2],Math.cos(pitch)*a[1]+Math.sin(pitch)*(Math.sin(yaw)*a[0]+Math.cos(yaw)*a[2])]};let faces=cells.map((c,i)=>{const f=pos.get(key(...c));if(!f)return null;const pts=[point3(f,0,0),point3(f,1,0),point3(f,1,1),point3(f,0,1)];const pp=pts.map(project),center=project(point3(f,.5,.5));const depth=pts.reduce((acc,p)=>acc+p[0]*camera[0]+p[1]*camera[1]+p[2]*camera[2],0)/4;return {c,i,pp,center,depth,faceNormal:f.N}}).filter(f=>f&&f.faceNormal.reduce((sum,n,i)=>sum+n*camera[i],0)>.005);
 // Сначала дальние поверхности, потом ближние.
 faces.sort((a,b)=>a.depth-b.depth);
 const xs=faces.flatMap(f=>f.pp.map(p=>p[0])),ys=faces.flatMap(f=>f.pp.map(p=>p[1]));const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);const scale=Math.min((W-45)/Math.max(1,maxX-minX),(H-35)/Math.max(1,maxY-minY)),dx=W/2-(minX+maxX)*scale/2,dy=H/2-(minY+maxY)*scale/2;
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t===0?'Плоская развёртка':t===1?'Сложенная объёмная модель':'Коробка складывается из плоской развёртки'}">`;
 faces.forEach(f=>{const pts=f.pp.map(p=>`${(p[0]*scale+dx).toFixed(1)},${(p[1]*scale+dy).toFixed(1)}`).join(' ');const visible=scale>18;svg+=`<polygon points="${pts}" fill="${COLORS[f.i%COLORS.length]}" stroke="#fff" stroke-width="${Math.max(1.4,scale*.036)}" stroke-linejoin="round"/>`;if(visible){const [X,Y]=f.center;svg+=`<circle cx="${(X*scale+dx).toFixed(1)}" cy="${(Y*scale+dy).toFixed(1)}" r="${Math.max(2.5,Math.min(9,scale*.12))}" fill="#ffffff" opacity=".58"/>`;if(label)svg+=`<text x="${X*scale+dx}" y="${Y*scale+dy+5}" font-size="${Math.min(25,Math.max(13,scale*.24))}" fill="#183d64" font-weight="850" text-anchor="middle">${'АБВГДЕ'[f.i]}</text>`}}
 );return svg+'</svg>'}
function modelBox(cells=S.editor.size===6?[...S.editor].map(k=>k.split(',').map(Number)):BASE_NET){return `<div class="scene" id="foldScene">${foldModel(cells,S.fold/100,500,330)}</div><div class="rangeRow"><label for="foldRange">Развернуть</label><input id="foldRange" type="range" min="0" max="100" value="${S.fold}" aria-label="Сложить или развернуть коробку"><label for="foldRange">Сложить</label></div><div class="btnrow" style="justify-content:center"><button type="button" class="btn" id="foldOpen">Развернуть</button><button type="button" class="btn primary" id="foldClose">Сложить коробку</button></div>`}
function letterAnswer(text){const options=['Это плоская фигура, из которой можно сложить коробку','Это узор для украшения коробки','Это рисунок только одной стороны коробки'];if(!S.order)S.order=seededShuffle(3);return `<div class="choicegrid">${S.order.map((idx,i)=>`<button type="button" data-answer="${idx}" class="choice ${S.choice===idx?'selected':''}" aria-pressed="${S.choice===idx}"><span class="letter">${'АБВ'[i]}</span><p>${options[idx]}</p></button>`).join('')}</div>`}
function taskOne(){return `<div class="duo"><div><div class="info"><b>Небольшой секрет:</b> у куба шесть квадратных сторон. Если аккуратно разложить коробку, они окажутся на одном листе. Попробуй сложить её обратно!</div></div><div>${modelBox(BASE_NET)}</div></div><h3 style="margin-top:22px">Что такое развёртка?</h3>${letterAnswer()}`}
function taskTwo(){const items=[BASE_NET,BAD_ONE,BAD_TWO];if(!S.order)S.order=seededShuffle(items.length);return `<div class="selectionHint">У всех трёх схем шесть квадратов. Но не из каждой получится закрытая коробка. Выбери подходящую.</div><div class="choicegrid">${S.order.map((idx,i)=>`<button type="button" data-answer="${idx}" class="choice ${S.choice===idx?'selected':''}" aria-pressed="${S.choice===idx}"><span class="letter">${'АБВ'[i]}</span>${polyCoords(items[idx],210,170)}</button>`).join('')}</div>`}
function taskThree(){let chosen=S.placed,base=new Set(BASE_FIVE.map(p=>key(...p)));return `<div class="duo"><div class="boardWrap"><div class="tinyTitle" style="text-align:center">Где разместить шестой квадрат?</div><div class="board">${Array.from({length:25},(_,i)=>{const x=i%5,y=Math.floor(i/5),k=key(x,y),fixed=base.has(k),added=chosen===k;return `<button type="button" ${fixed?'disabled':''} class="tile ${fixed?'fixed':added?'added':'selectable'}" data-add="${k}" aria-label="${fixed?'Уже есть квадрат':added?'Добавленный квадрат':'Пустая клетка'}" aria-pressed="${added}">${fixed||added?'■':''}</button>`}).join('')}</div><p class="hintline">Нажми на пустое место, чтобы добавить квадрат. Можно пробовать разные места.</p></div><div class="flexcol"><div class="info">Перед тобой пять соединённых квадратов. Чтобы получилась коробка, нужен ещё один. <b>Но важно выбрать место, где он не помешает складыванию!</b></div><div class="scene">${polyCoords(BASE_FIVE,300,195)}</div><p class="small">При проверке программа учитывает, не наложатся ли стороны куба друг на друга.</p></div></div>`}
function taskFour(){const items=S.editor;return `<div class="twoPanels"><div class="boardWrap"><div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px"><span class="tinyTitle">Твоя строительная площадка</span><span class="counter">Квадратов: ${items.size} из 6</span></div><div class="board">${Array.from({length:25},(_,i)=>{const x=i%5,y=Math.floor(i/5),k=key(x,y),on=items.has(k);return `<button type="button" class="tile selectable ${on?'marked':''}" aria-pressed="${on}" aria-label="${on?'Убрать квадрат':'Добавить квадрат'}" data-editor="${k}">${on?'■':'+'}</button>`}).join('')}</div><p class="hintline">Нажми на клетки. Получится шесть квадратов, соединённых сторонами.</p><button type="button" class="btn alt" id="clearEditor">Очистить площадку</button></div><div class="sidebox"><h3>Твоя задача</h3><p>Придумай собственную развёртку куба. Выложи на площадке шесть квадратов так, чтобы из них можно было сложить коробку.</p><div class="info">Один и тот же куб можно сложить из разных развёрток. Попробуй найти свою!</div>${S.showFold?`<div class="foldAfter"><h3>Смотри, твоя коробка складывается!</h3>${modelBox([...S.editor].map(k=>k.split(',').map(Number)))}</div>`:''}</div></div>`}
const LABELS='АБВГДЕ';
function taskFive(){return `<div class="duo"><div class="boardWrap"><div class="tinyTitle">Нажми на две грани</div><div class="sketch">${Array.from({length:12},(_,i)=>{const x=i%4,y=Math.floor(i/4),idx=BASE_NET.findIndex(c=>c[0]===x&&c[1]===y);if(idx<0)return '<div class="empty"></div>';return `<button type="button" class="facebtn ${S.pair.includes(idx)?'sel':''}" aria-pressed="${S.pair.includes(idx)}" data-face="${idx}">${LABELS[idx]}</button>`}).join('')}</div><p class="hintline">Выбери две стороны, которые окажутся друг напротив друга, когда коробку сложат.</p></div><div><div class="info"><b>Подсказка:</b> противоположные стороны не касаются друг друга внутри собранного куба. Они находятся по разные стороны коробки.</div><div class="scene" style="margin-top:12px" id="pairFold">${foldModel(BASE_NET,S.fold/100,380,245,true)}</div><div class="rangeRow"><label for="foldRange">Плоско</label><input id="foldRange" type="range" min="0" max="100" value="${S.fold}" aria-label="Сложить коробку"><label for="foldRange">Куб</label></div><button type="button" class="btn alt" id="foldClose">Сложить коробку</button></div></div>`}
function taskSix(){const parts=['Я нарисовал развёртку из шести квадратов на бумаге в клетку.','Я аккуратно вырезал её с помощью учителя и сложил коробку.','Я проверил, что все шесть сторон соединяются, и показал работу учителю.'];return `<div class="duo"><div class="boardWrap"><h3>Бумажная мастерская</h3><p>Возьми бумагу в клетку. Нарисуй шесть одинаковых квадратов, каждый размером 2 × 2 клетки. Соедини их так, чтобы получилась развёртка куба. Затем аккуратно собери коробку.</p><div class="scene">${polyCoords(BASE_NET,330,218)}</div><p class="hintline">Если нужно, используй бумагу, ножницы и скотч вместе с учителем.</p></div><div><h3>Проверь свою работу</h3><div class="checklist">${parts.map((s,i)=>`<label><input type="checkbox" data-check="${i}" ${S.checklist.has(i)?'checked':''}><span>${s}</span></label>`).join('')}</div><p class="note">Самую настоящую бумажную коробку проверяет учитель.</p></div></div>`}
const TASKS=[{title:'Разверни и сложи коробку',ask:'Нажимай «Сложить коробку» и «Развернуть». Посмотри, как плоская фигура превращается в куб.',content:taskOne},{title:'Какая развёртка подойдёт?',ask:'Рассмотри три плоские фигуры. Какую из них можно сложить в куб?',content:taskTwo},{title:'Добавь шестую сторону',ask:'Пять квадратов уже на месте. Найди подходящее место для шестого.',content:taskThree},{title:'Построй свою развёртку',ask:'Самостоятельно расположи шесть квадратов. Сможет ли из них получиться коробка?',content:taskFour},{title:'Кто напротив кого?',ask:'У каждой стороны куба есть противоположная сторона. Найди любые две такие стороны.',content:taskFive},{title:'Собери бумажную коробку',ask:'Теперь попробуй сделать настоящую коробку по развёртке.',content:taskSix}];
function progress(){return `<div class="stepsbar"><strong>Твои шаги</strong>${TASKS.map((t,i)=>`<span class="stepdot ${S.step===i?'on':S.done.has(i)?'ok':''}" title="${t.title}">${S.done.has(i)?'✓':i+1}</span>`).join('')}</div>`}
function controls(){if(S.correct)return `<div class="btnrow"><button type="button" class="btn primary" id="next">${S.step===5?'Завершить урок':'Следующее задание →'}</button></div>`;return `<div class="btnrow"><button type="button" class="btn primary" id="check">${S.step===5?'Я выполнил работу':'Проверить'}</button>${S.step===3?'<button type="button" class="btn alt" id="resetEditor">Начать заново</button>':''}</div>`}
function render(){const t=TASKS[S.step];$('#app').innerHTML=`${progress()}<section class="panel"><span class="tag">Задание ${S.step+1} из ${TASKS.length}</span><h2>${t.title}</h2><p class="sub">${t.ask}</p>${t.content()}${controls()}${S.feedback?`<div class="feedback ${S.correct?'good':'bad'}" role="status">${S.feedback}</div>`:''}</section>`;bind()}
function mut(resetFold=false){S.feedback='';S.correct=false;S.done.delete(S.step);S.showFold=false;if(resetFold)S.fold=0}
function bind(){document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{S.choice=+b.dataset.answer;mut();render()}));document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;const k=b.dataset.add;S.placed=S.placed===k?null:k;mut();render()}));document.querySelectorAll('[data-editor]').forEach(b=>b.addEventListener('click',()=>{let k=b.dataset.editor;if(S.editor.has(k))S.editor.delete(k);else if(S.editor.size<6)S.editor.add(k);else {S.feedback='У тебя уже шесть квадратов. Чтобы заменить один из них, сначала убери лишний.';S.correct=false;render();return}mut(true);render()}));document.querySelectorAll('[data-face]').forEach(b=>b.addEventListener('click',()=>{const ix=+b.dataset.face;if(S.pair.includes(ix))S.pair=S.pair.filter(q=>q!==ix);else if(S.pair.length<2)S.pair.push(ix);else S.pair=[ix];mut();render()}));document.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('change',()=>{let i=+b.dataset.check;b.checked?S.checklist.add(i):S.checklist.delete(i);mut();render()}));const chk=$('#check');if(chk)chk.onclick=validate;const next=$('#next');if(next)next.onclick=()=>{if(S.step===5){finish();return}S.step++;S.choice=null;S.order=null;S.feedback='';S.correct=false;S.fold=0;S.showFold=false;render();window.scrollTo({top:0,behavior:'smooth'})};['resetEditor','clearEditor'].forEach(id=>{const b=$('#'+id);if(b)b.onclick=()=>{S.editor.clear();mut(true);render()}});let slider=$('#foldRange');if(slider)slider.addEventListener('input',e=>{S.fold=+e.target.value;updateFoldOnly()});let fo=$('#foldOpen');if(fo)fo.onclick=()=>animateFold(0);let fc=$('#foldClose');if(fc)fc.onclick=()=>animateFold(100)}
function updateFoldOnly(){const sc=$('#foldScene');if(sc){const cells=S.step===3&&S.editor.size===6?[...S.editor].map(k=>k.split(',').map(Number)):BASE_NET;sc.innerHTML=foldModel(cells,S.fold/100,500,330)}const side=$('#pairFold');if(side)side.innerHTML=foldModel(BASE_NET,S.fold/100,380,245,true);const slider=$('#foldRange');if(slider)slider.value=S.fold}
function animateFold(to){if(S.animation)cancelAnimationFrame(S.animation);const from=S.fold,start=performance.now(),duration=Math.max(300,700*Math.abs(to-from)/100);const tick=now=>{const p=Math.min(1,(now-start)/duration);S.fold=Math.round(from+(to-from)*(p*p*(3-2*p)));updateFoldOnly();if(p<1)S.animation=requestAnimationFrame(tick)};S.animation=requestAnimationFrame(tick)}
function validate(){let good=false,msg='';switch(S.step){case 0:good=S.choice===0;msg=good?'Верно! Развёртка лежит на плоскости, а при складывании превращается в коробку.':S.choice===null?'Сначала выбери ответ.':'Попробуй ещё раз. Вспомни, как плоская фигура сложилась в куб.';break;case 1:good=S.choice===0;msg=good?'Молодец! У этой развёртки все шесть сторон соединятся и не наложатся друг на друга.':S.choice===null?'Выбери одну развёртку.':'Посмотри внимательнее: при складывании некоторые квадраты могут наложиться друг на друга.';break;case 2:if(!S.placed){msg='Нажми на пустую клетку и добавь недостающий квадрат.';break}const arr=BASE_FIVE.concat([S.placed.split(',').map(Number)]),test=analyzed(arr);good=test.valid;msg=good?'Получилось! Ты нашёл место для шестого квадрата. Такую развёртку можно сложить в куб.':test.why==='apart'?'Квадрат должен касаться остальных хотя бы одной стороной.':'Пока не получится: при складывании две стороны попадут на одно место. Перенеси квадрат.';break;case 3:if(S.editor.size!==6){msg='Построй шесть квадратов, прежде чем проверять.';break}const own=analyzed([...S.editor].map(k=>k.split(',').map(Number)));good=own.valid;msg=good?'Отличная работа! Это настоящая развёртка куба. Теперь посмотри, как складывается твоя модель.':own.why==='apart'?'Все шесть квадратов должны соприкасаться сторонами, чтобы получилась одна фигура.':'Почти! При складывании некоторые квадраты попадут на одно место. Попробуй поменять их расположение.';if(good){S.fold=0;S.showFold=true}break;case 4:if(S.pair.length!==2){msg='Сначала выбери две грани.';break}const faces=analyzed(BASE_NET).faces,f1=faces.get(key(...BASE_NET[S.pair[0]])),f2=faces.get(key(...BASE_NET[S.pair[1]]));good=f1.N.every((v,i)=>v===-f2.N[i]);msg=good?'Правильно! Эти стороны окажутся друг напротив друга, когда коробка сложится.':'Эти стороны не противоположные. Сложи коробку и попробуй ещё раз.';break;case 5:good=S.checklist.size===3;msg=good?'Отлично! Ты создал настоящую коробку по своей развёртке.':'Отметь выполненные шаги. Если нужна помощь, попроси учителя.';break}
S.correct=good;S.feedback=msg;if(good)S.done.add(S.step);render()}
function finish(){$('#app').innerHTML=`<section class="complete"><div class="award">🏆</div><div class="overline">Миссия выполнена</div><h2>Отличная работа, LEGO-дизайнер!</h2><p>Ты научился превращать плоскую развёртку в объёмную коробку и создавать собственные модели. Покажи учителю, какая развёртка у тебя получилась!</p><div class="btnrow"><button type="button" class="btn primary" id="again">Пройти урок ещё раз ↻</button></div></section>`;$('#again').onclick=()=>{if(S.animation)cancelAnimationFrame(S.animation);S.step=0;S.done.clear();S.choice=null;S.order=null;S.feedback='';S.correct=false;S.fold=0;S.placed=null;S.editor.clear();S.pair=[];S.checklist.clear();S.showFold=false;render();window.scrollTo({top:0,behavior:'smooth'})}}
render();
</script>
</body>
</html>
